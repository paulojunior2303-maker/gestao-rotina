<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowFire</title>
  <meta name="description" content="Gestão de rotina, tarefas, reuniões e equipe para líderes">
  <meta name="theme-color" content="#0e0c13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="76 76 360 360" aria-hidden="true"><g transform="translate(5.2 -16.0) scale(0.8000)"><path d="M352 128 C 395 175 398 240 360 282 C 330 315 280 340 252 378 C 232 405 225 445 222 480 C 190 455 175 405 188 365 C 205 315 255 285 300 255 C 340 228 360 185 352 128 Z" fill="#7a30f2"/><path d="M425 275 C 452 330 445 380 405 412 C 370 440 330 455 308 490 C 296 510 288 530 285 552 C 262 520 262 470 290 438 C 318 405 368 390 398 360 C 424 335 432 305 425 275 Z" fill="#7a30f2"/></g></svg>
        <div><strong>FlowFire</strong><small id="brand-sub">Calma Pae!</small></div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot" id="storage-status"></div>
    </aside>
    <div class="backdrop" id="backdrop"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Abrir menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <h1 id="page-title">Dashboard</h1>
        <span class="grow"></span>
        <span id="top-clock" class="top-clock"></span>
        <a href="#guia" class="icon-btn help-btn" aria-label="Guia de uso" title="Guia de uso"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9.8c0 1.7-2.4 2.2-2.4 3.7M12 17h.01"/></svg></a>
      </header>
      <main id="view" class="view"></main>
    </div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Atalhos"></nav>
    <button class="fab" id="fab" type="button" hidden><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="print-root"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/native.js"></script>
  <script src="js/transfer.js"></script>
  <script src="js/lembretes.js"></script>
  <script src="js/ia.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/fire.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/agenda.js"></script>
  <script src="js/views/imprevistos.js"></script>
  <script src="js/views/mensal.js"></script>
  <script src="js/views/reunioes.js"></script>
  <script src="js/views/feedbacks.js"></script>
  <script src="js/views/tarefas.js"></script>
  <script src="js/views/projetos.js"></script>
  <script src="js/views/indicadores.js"></script>
  <script src="js/views/config.js"></script>
  <script src="js/views/guia.js"></script>
  <script src="js/jogo.js"></script>
  <script src="js/equipes.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
