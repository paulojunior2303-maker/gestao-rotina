  <script>/* js/views/reunioes.js */
'use strict';
/* Reuniões e feedbacks — conversas com pessoas num lugar só.
   Aba Reuniões: marcar com pauta, gravar, registrar o que foi combinado (com IA, se quiser).
   Aba Feedbacks: conversas individuais com cada colaborador (FBPage, em feedbacks.js). */
const Meetings = {
  isMeeting: e => !!(e.reuniao || (e.pautas || []).length),
  passed(e) { const t = U.today(); return e.date < t || (e.date === t && (!e.time || U.toMin(e.time) <= U.nowMin())); },
  toRegister() { const from = U.addDays(U.today(), -30); return S.events.filter(e => Meetings.isMeeting(e) && !e.registro && e.date >= from && Meetings.passed(e)).sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || ''))); },
  upcoming() { return S.events.filter(e => !Meetings.passed(e)).sort((a, b) => (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99'))); },
  registered() { return S.events.filter(e => e.registro).sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || ''))).slice(0, 20); },
  card(e, side) {
    const d = U.parse(e.date), n = (e.pautas || []).length;
    const when = e.date === U.today() ? 'Hoje' : e.date === U.addDays(U.today(), 1) ? 'Amanhã' : U.WD_SHORT[d.getDay()];
    return `<div class="mt-card" role="button" tabindex="0" data-act="evView" data-id="${e.id}">
      <span class="mt-date"><strong>${d.getDate()}</strong><small>${U.MONTHS[d.getMonth()].slice(0, 3).toLowerCase()}</small></span>
      <span class="mt-body"><span class="mt-title">${U.esc(e.title)}${H.demo(e)}</span>
        <span class="mt-meta">${when}${e.time ? `, ${e.time}` : ''}${n ? ` · ${U.plural(n, 'assunto')} na pauta` : Meetings.isMeeting(e) ? ' · sem pauta' : ' · compromisso'}</span></span>
      ${side || U.icon('right', 16)}</div>`;
  },
};

Views.reunioes = {
  title: 'Reuniões e feedbacks', icon: 'users', nav: 'Reuniões e feedbacks',
  fab: () => App.ui.mtTab === 'feedbacks'
    ? { act: 'fbNew', label: 'Novo feedback', data: App.ui.fbWho ? { n: App.ui.fbWho } : {} }
    : { act: 'mtNew', label: 'Nova reunião' },
  render() {
    const tab = App.ui.mtTab === 'feedbacks' ? 'feedbacks' : 'reunioes';
    const nMt = Meetings.toRegister().length + Meetings.upcoming().filter(Meetings.isMeeting).length, nFb = FB.list().length;
    const tabs = `<div class="tabs mt-tabs" role="tablist">${[['reunioes', 'Reuniões', nMt], ['feedbacks', 'Feedbacks', nFb]].map(([v, l, n]) => `<button class="tab ${tab === v ? 'active' : ''}" role="tab" aria-selected="${tab === v}" data-act="mtTab" data-v="${v}">${l}${n ? ` <span class="tab-n">${n}</span>` : ''}</button>`).join('')}</div>`;
    return tabs + (tab === 'feedbacks' ? FBPage.render() : this.meetings());
  },
  meetings() {
    const reg = Meetings.toRegister(), up = Meetings.upcoming(), done = Meetings.registered();
    const empty = !reg.length && !up.length && !done.length;
    const iaHint = IA.supported() && !IA.ready() ? `<p class="muted small">Dica: com a <a class="link" href="#config" data-act="cfgJump" data-id="ia">IA ativada</a>, ela preenche o registro a partir da gravação ou das suas anotações.</p>` : '';
    return `
    ${empty ? `<div class="card mt-empty">
        <h3>Como funciona</h3>
        <ol class="mt-steps">
          <li>Toque em <strong>+</strong>: dia, horário e a pauta, um assunto por linha.</li>
          <li>Na hora, ${Reminders.on() ? 'o app avisa e ' : ''}você toca em <strong>Iniciar</strong> e depois em <strong>Iniciar gravação</strong>. A transcrição aparece na tela enquanto a reunião acontece, e você marca a pauta conforme os assuntos são tratados.</li>
          <li>No fim, toque em <strong>Encerrar gravação</strong>: a IA preenche os combinados e um resumo. Confira e salve. Cada combinado pode virar uma tarefa.</li>
        </ol>
        ${iaHint}
      </div>` : ''}
    ${reg.length ? `<section class="mt-sec"><h3 class="mt-h">Para registrar <span class="badge b-yellow">${reg.length}</span></h3>
      <div class="mt-list">${reg.map(e => Meetings.card(e, '<span class="btn sm primary">Registrar</span>')).join('')}</div>${empty ? '' : iaHint}</section>` : ''}
    ${up.length ? `<section class="mt-sec"><h3 class="mt-h">Próximas</h3><div class="mt-list">${up.slice(0, 30).map(e => Meetings.card(e, e.date === U.today() ? `<button class="btn sm primary" data-act="mtStart" data-id="${e.id}">${U.icon('mic', 14)} Iniciar</button>` : '')).join('')}</div></section>` : ''}
    ${done.length ? `<section class="mt-sec"><h3 class="mt-h">Registradas</h3><div class="mt-list">${done.map(e => Meetings.card(e, `<span class="badge b-green">${(e.pautas || []).length ? `${e.registro.tratadas.length}/${e.pautas.length} tratados` : 'Registrada'}</span>`)).join('')}</div></section>` : ''}`;
  },
};

Object.assign(Actions, {
  mtStart({ id }) { const e = S.events.find(x => x.id === id); if (e) Events.register(e); },
  mtNew() { Events.form(null, U.today(), { reuniao: true }); },
  mtTab({ v }) { App.ui.mtTab = v; if (v !== 'feedbacks') App.ui.fbWho = null; App.render({ resetScroll: true }); },
});

</script>
  <script>/* js/views/feedbacks.js */
'use strict';
/* Feedbacks individuais da equipe: gravar a conversa (transcrição ao vivo), a IA escreve o registro no padrão
   do agente (/feedback), acordos viram tarefas com o colaborador como responsável. Histórico por pessoa. */
const FB = {
  TOM_COLOR: { positivo: '#3dbe8b', neutro: '#8e87a3', melhorar: '#e3a043' },
  TIPO_COLOR: { feedback: '#9461f5', orientacao: '#e3a043', advertencia: '#ee5a6f' },
  list() { return S.feedbacks || (S.feedbacks = []); },
  people() {
    const names = new Map();
    S.settings.technicians.forEach(t => names.set(t.name, { name: t.name, demo: t.demo, items: [] }));
    this.list().forEach(f => { if (!names.has(f.pessoa)) names.set(f.pessoa, { name: f.pessoa, items: [] }); names.get(f.pessoa).items.push(f); });
    return [...names.values()].map(p => ({ ...p, items: p.items.sort((a, b) => b.date.localeCompare(a.date)) }))
      .sort((a, b) => ((b.items[0] || {}).date || '').localeCompare((a.items[0] || {}).date || '') || a.name.localeCompare(b.name));
  },
  initials(n) { return n.split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase(); },
  chips(f) { return `${H.chip(IA.TONS[f.tom] || 'Neutro', this.TOM_COLOR[f.tom] || '#8e87a3')}${f.tipo && f.tipo !== 'feedback' ? H.chip(IA.TIPOS[f.tipo], this.TIPO_COLOR[f.tipo]) : ''}${f.transcricao ? `<span class="muted" title="Conversa gravada">${U.icon('mic', 13)}</span>` : ''}`; },
  card(f, showName) {
    const first = (f.resumo || f.notas || '').split('\n').find(l => l.trim()) || 'Sem texto';
    return `<div class="fb-card" role="button" tabindex="0" data-act="fbView" data-id="${f.id}">
      <div class="fb-card-h">${showName ? `<strong>${U.esc(f.pessoa)}</strong>` : ''}<span class="muted small">${U.fmtDate(f.date)}</span>${this.chips(f)}</div>
      <p class="fb-card-t">${U.esc(first)}</p></div>`;
  },
};

/* Aba "Feedbacks" da tela Reuniões e feedbacks */
const FBPage = {
  render() {
    const who = App.ui.fbWho;
    if (who) return this.person(who);
    const people = FB.people(), recent = [...FB.list()].sort((a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt)).slice(0, 8);
    // Feedbacks pedidos em missões (ainda não registrados)
    const pend = (S.missoes || []).filter(m => m.tipo === 'feedbackItem' && !Missoes.itemFeito(m));
    return `
    ${pend.length ? `<section class="mt-sec"><h3 class="mt-h">Para fazer <span class="badge b-yellow">${pend.length}</span></h3><div class="mt-list">${pend.map(m => `<div class="mt-card" role="button" tabindex="0" data-act="msAbrir" data-id="${m.id}">
        <span class="fb-av">${U.esc(FB.initials(m.pessoa || '?'))}</span>
        <span class="mt-body"><span class="mt-title">${U.esc(m.titulo)}</span><span class="mt-meta">Missão${m.de_ ? ` de ${U.esc(m.de_)}` : ''}${m.data ? ` · ${U.fmtShort(m.data)}` : ''} · +${m.xp} XP</span></span>
        <span class="btn sm primary">Registrar</span></div>`).join('')}</div></section>` : ''}
    ${people.length ? `<section class="mt-sec"><h3 class="mt-h">Equipe</h3><div class="fb-people">${people.map(p => `<div class="fb-person" role="button" tabindex="0" data-act="fbWho" data-n="${U.esc(p.name)}">
        <span class="fb-av">${U.esc(FB.initials(p.name))}</span>
        <span class="fb-p-body"><strong>${U.esc(p.name)}${H.demo(p)}</strong><small class="muted">${p.items.length ? `${U.plural(p.items.length, 'feedback')} · último em ${U.fmtShort(p.items[0].date)}` : 'Nenhum feedback ainda'}</small></span>
        ${p.items[0] ? H.chip(IA.TONS[p.items[0].tom] || 'Neutro', FB.TOM_COLOR[p.items[0].tom] || '#8e87a3') : ''}${U.icon('right', 15)}</div>`).join('')}</div></section>` : `<div class="card mt-empty"><h3>Como funciona</h3><ol class="mt-steps">
        <li>Toque em <strong>+</strong> e escreva o nome do colaborador (ele entra na lista da equipe).</li>
        <li>Na conversa, toque em <strong>Iniciar gravação</strong> (avise o colaborador). A transcrição aparece na tela.</li>
        <li>No fim, toque em <strong>Encerrar gravação</strong>: a IA escreve o registro e separa os acordos. Confira e salve.</li></ol></div>`}
    ${recent.length ? `<section class="mt-sec"><h3 class="mt-h">Recentes</h3><div class="mt-list">${recent.map(f => FB.card(f, true)).join('')}</div></section>` : ''}`;
  },
  person(name) {
    const items = FB.list().filter(f => f.pessoa === name).sort((a, b) => b.date.localeCompare(a.date));
    const count = k => items.filter(f => f.tom === k).length;
    return `
    <div class="toolbar"><button class="btn sm ghost" data-act="fbWho" data-n="">${U.icon('left', 15)} Equipe</button></div>
    <div class="card fb-head"><span class="fb-av big">${U.esc(FB.initials(name))}</span><div><h2>${U.esc(name)}</h2>
      <p class="muted small">${items.length ? `${U.plural(items.length, 'feedback')}: ${count('positivo')} positivos, ${count('neutro')} neutros, ${count('melhorar')} a melhorar` : 'Nenhum feedback registrado ainda.'}</p></div></div>
    ${items.length ? `<div class="mt-list">${items.map(f => FB.card(f, false)).join('')}</div>` : H.empty('Toque em + para registrar a primeira conversa.')}`;
  },
};

Object.assign(FB, {
  form(f, pessoa) {
    const isNew = !f;
    const r = f || { pessoa: pessoa || '', date: U.today(), tipo: 'feedback', tom: 'neutro', notas: '', resumo: '', acordos: '' };
    let dirty = false, warned = false;
    Recorder.reset();
    const iaBox = !IA.supported() ? '' : `<div class="ia-box">
        <div class="ia-h">${U.icon('spark', 17)}<strong>Gravar e transcrever ao vivo</strong></div>
        ${IAUI.keyRow()}${IAUI.recHtml()}
        <textarea name="iaNotas" rows="2" placeholder="Anotações suas (opcional). Dá para ditar pelo microfone do teclado.">${U.esc(r.notas || '')}</textarea>
        <div class="ia-actions"><span class="muted small grow">Avise o colaborador antes de gravar.</span><button type="button" class="btn sm" data-ia>${U.icon('spark', 15)} Gerar registro com IA</button></div>
        <p class="ia-msg small" hidden></p>
      </div>`;
    const m = UI.form({
      title: isNew ? 'Novo feedback' : 'Editar feedback',
      submitLabel: 'Salvar feedback',
      canClose: () => {
        if (Recorder.recording()) { UI.toast('A gravação está em andamento. Toque em “Encerrar gravação” antes de sair.', 'warn'); return false; }
        if ((Recorder.text() || dirty) && !warned) { warned = true; UI.toast('O feedback ainda não foi salvo. Toque de novo para sair sem salvar.', 'warn'); return false; }
        return true;
      },
      onClose: () => { if (Recorder.recording()) Recorder.stop(); Recorder.reset(); },
      fields: [
        { name: 'pessoa', label: 'Colaborador', required: true, value: r.pessoa, list: D.techNames(), placeholder: 'Nome do colaborador' },
        { name: 'date', label: 'Data', type: 'date', required: true, value: r.date, half: true },
        { name: 'tipo', label: 'Tipo', type: 'select', options: Object.entries(IA.TIPOS), value: r.tipo, half: true },
        { name: 'tom', label: 'Tom', type: 'radio', options: Object.entries(IA.TONS), value: r.tom },
        { type: 'html', html: iaBox },
        { name: 'resumo', label: 'Registro do feedback', type: 'textarea', rows: 9, value: r.resumo, placeholder: 'A IA escreve aqui no padrão do seu agente ao encerrar a gravação. Você também pode escrever.' },
        ...(IA.supported() ? [{ type: 'html', html: IAUI.toolsHtml() }] : []),
        { name: 'acordos', label: 'Acordos e próximos passos', type: 'textarea', rows: 3, value: r.acordos, placeholder: 'Um por linha' },
        { name: 'mkTasks', label: 'Criar uma tarefa para cada acordo (responsável: o colaborador)', type: 'checkbox', value: false },
      ],
      onSubmit(v) {
        if (Recorder.recording()) return 'Encerre a gravação antes de salvar.';
        const tx = Recorder.text() || (f && f.transcricao) || '';
        const data = { pessoa: v.pessoa, date: v.date, tipo: v.tipo || 'feedback', tom: v.tom || 'neutro', notas: m.el.querySelector('[name=iaNotas]') ? m.el.querySelector('[name=iaNotas]').value.trim() : (r.notas || ''), resumo: v.resumo, acordos: v.acordos, ...(tx ? { transcricao: tx.slice(0, 30000) } : {}) };
        if (isNew) FB.list().push({ id: U.uid(), createdAt: new Date().toISOString(), ...data }); else Object.assign(f, data);
        if (!S.settings.technicians.some(t => t.name.toLowerCase() === v.pessoa.toLowerCase())) S.settings.technicians.push({ id: U.uid(), name: v.pessoa });
        let n = 0;
        if (v.mkTasks) v.acordos.split('\n').map(l => l.replace(/^[-•*\d.)\s]+/, '').trim()).filter(Boolean).forEach(title => {
          n++;
          S.tasks.push({ id: U.uid(), title, description: `Acordo do feedback com ${v.pessoa} (${U.fmtShort(v.date)}).`, category: 'equipe', priority: 'media', status: 'pendente', responsible: v.pessoa, createdAt: new Date().toISOString(), startDate: U.today(), dueDate: '', dueTime: '', notes: '', completedAt: null });
        });
        warned = true;
        if (App.route === 'reunioes' && App.ui.mtTab === 'feedbacks') App.ui.fbWho = v.pessoa;
        commit();
        UI.toast(n ? `Feedback salvo e ${U.plural(n, 'tarefa criada', 'tarefas criadas')}.` : 'Feedback salvo.');
      },
    });
    const el = m.el, fm = el.querySelector('form');
    fm.addEventListener('input', () => { dirty = true; });
    fm.addEventListener('change', () => { dirty = true; });
    const btnIA = el.querySelector('[data-ia]'); if (!btnIA) return;
    const fill = async () => {
      const notes = fm.elements.iaNotas.value, transcript = Recorder.text() || (f && f.transcricao) || '';
      if (needKey()) return;
      if (!fm.elements.pessoa.value.trim()) { say('Escreva o nome do colaborador primeiro.', 'err'); fm.elements.pessoa.focus(); return; }
      if (!notes.trim() && !transcript.trim()) { say('Grave a conversa ou escreva algumas anotações primeiro.', 'err'); return; }
      btnIA.disabled = true; btnIA.innerHTML = '<span class="spinner"></span> Escrevendo…';
      say('A IA está escrevendo o registro no padrão do seu agente…');
      const tom = (fm.querySelector('[name=tom]:checked') || {}).value || 'neutro';
      try {
        const res = await IA.feedback({ nome: fm.elements.pessoa.value.trim(), tipo: fm.elements.tipo.value, tom, date: fm.elements.date.value, notes, transcript });
        fm.elements.resumo.value = res.resumo;
        const cur = fm.elements.acordos.value.trim();
        fm.elements.acordos.value = [cur, ...res.acordos.filter(a => !cur.includes(a))].filter(Boolean).join('\n');
        dirty = true;
        say(`Pronto: registro escrito${res.acordos.length ? ` e ${U.plural(res.acordos.length, 'acordo')}` : ''}. Confira e toque em <strong>Salvar feedback</strong>.`, 'ok');
        fm.elements.resumo.scrollIntoView({ block: 'start', behavior: 'smooth' });
      } catch (err) { say(U.esc(err.message), 'err'); }
      btnIA.disabled = false; btnIA.innerHTML = `${U.icon('spark', 15)} Gerar registro com IA`;
    };
    const { say, needKey } = IAUI.wire(el, { onStop: fill });
    btnIA.onclick = fill;
    IAUI.wireTools(el, 'resumo', () => `Feedback: ${fm.elements.pessoa.value}`, { say, needKey, onChange: () => { dirty = true; }, source: () => Recorder.text() || (f && f.transcricao) || '' });
  },

  view(f) {
    const m = UI.modal({
      title: f.pessoa,
      body: `<p class="muted">${U.fmtLong(f.date)}</p><div class="fb-chips">${FB.chips(f)}</div>
        ${f.resumo ? `<div class="ata-doc"><p class="ata pre">${U.esc(f.resumo)}</p><div class="row-actions wrap"><button class="btn sm" data-copy>${U.icon('check', 14)} Copiar</button><button class="btn sm" data-share>${U.icon('upload', 14)} Compartilhar</button></div></div>` : '<p class="muted">Sem registro escrito.</p>'}
        ${f.acordos ? `<h4>Acordos</h4><p class="ata pre">${U.esc(f.acordos)}</p>` : ''}
        ${f.notas ? `<h4>Anotações</h4><p class="pre small">${U.esc(f.notas)}</p>` : ''}
        ${f.transcricao ? `<details class="tx"><summary>Ver transcrição</summary><p class="ata pre small">${U.esc(f.transcricao)}</p></details>` : ''}`,
      footer: `<button class="btn ghost danger-text" data-del>${U.icon('trash', 15)} Excluir</button><span class="grow"></span><button class="btn primary" data-ed>${U.icon('edit', 15)} Editar</button>`,
    });
    m.el.querySelector('[data-ed]').onclick = () => { m.close(); FB.form(f); };
    m.el.querySelector('[data-del]').onclick = () => { m.close(); UI.confirm(`Excluir o feedback de <strong>${U.esc(f.pessoa)}</strong> (${U.fmtShort(f.date)})?`, () => { S.feedbacks = FB.list().filter(x => x.id !== f.id); commit(); UI.toast('Feedback excluído.'); }, { danger: true, okLabel: 'Excluir' }); };
    const cp = m.el.querySelector('[data-copy]'); if (cp) cp.onclick = () => Events.copy(f.resumo);
    const sh = m.el.querySelector('[data-share]'); if (sh) sh.onclick = () => Events.share(f.resumo, `Feedback: ${f.pessoa}`);
  },
});

Object.assign(Actions, {
  fbNew({ n }) { FB.form(null, n || App.ui.fbWho || ''); },
  fbWho({ n }) { App.ui.fbWho = n || null; App.render({ resetScroll: true }); },
  fbView({ id }) { const f = FB.list().find(x => x.id === id); if (f) FB.view(f); },
});

  <script>/* js/views/tarefas.js */
'use strict';
/* Gestão de tarefas — cadastro, filtros e alertas de prazo */
Views.tarefas = {
  title: 'Gestão de tarefas', icon: 'tasks', nav: 'Tarefas',
  fab: { act: 'tkNew', label: 'Nova tarefa' },
  render(params) {
    const f = App.ui.taskF = App.ui.taskF || { q: '', status: 'abertas', priority: '', category: '', period: '', from: '', to: '' };
    const t = U.today(), ws = U.weekStart(t), we = U.addDays(ws, 6);
    const all = S.tasks;
    const counts = {
      abertas: all.filter(x => OPEN(x.status)).length,
      atrasadas: all.filter(D.taskLate).length,
      andamento: all.filter(x => x.status === 'andamento').length,
      concluida: all.filter(x => x.status === 'concluida').length,
      todas: all.length,
    };
    let list = all.filter(x => {
      if (f.status === 'abertas' && !OPEN(x.status)) return false;
      if (f.status === 'atrasadas' && !D.taskLate(x)) return false;
      if (['pendente', 'andamento', 'concluida', 'cancelada'].includes(f.status) && x.status !== f.status) return false;
      if (f.priority && x.priority !== f.priority) return false;
      if (f.category && x.category !== f.category) return false;
      if (f.q) { const q = f.q.toLowerCase(); if (![x.title, x.description, x.notes, x.responsible].some(s => (s || '').toLowerCase().includes(q))) return false; }
      if (f.period === 'hoje' && x.dueDate !== t) return false;
      if (f.period === 'semana' && !(x.dueDate >= ws && x.dueDate <= we)) return false;
      if (f.period === 'proximos' && !(x.dueDate >= t && x.dueDate <= U.addDays(t, 7))) return false;
      if (f.period === 'semprazo' && x.dueDate) return false;
      if (f.from && !(x.dueDate && x.dueDate >= f.from)) return false;
      if (f.to && !(x.dueDate && x.dueDate <= f.to)) return false;
      return true;
    });
    list.sort((a, b) => (OPEN(b.status) - OPEN(a.status)) || (D.taskLate(b) - D.taskLate(a)) || (a.dueDate || '9999').localeCompare(b.dueDate || '9999') || PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority]);

    const stat = (k, l, cls = '') => `<button class="stat-chip ${cls} ${f.status === k ? 'active' : ''}" data-act="tkStatusF" data-v="${k}"><strong>${counts[k]}</strong><span>${l}</span></button>`;
    const sel = (name, opts, label) => `<select data-change="tkFilter" data-k="${name}" aria-label="${label}"><option value="">${label}</option>${UI.opts(opts, f[name])}</select>`;
    const filtersOn = f.priority || f.category || f.period || f.from || f.to || f.q;

    const row = x => {
      const dl = D.deadline(x.dueDate, x.dueTime, !OPEN(x.status));
      return `<div class="task ${x.status} ${dl ? 'dl-row-' + dl.level : ''}" style="--c:${D.cat(x.category).color}">
        <div class="tk-body" data-act="tkEdit" data-id="${x.id}">
          <div class="tk-title">${U.esc(x.title)}${H.demo(x)}${x.status === 'andamento' || x.status === 'cancelada' ? ' ' + H.status(x.status) : ''}</div>
          ${x.description ? `<div class="tk-desc">${U.esc(x.description)}</div>` : ''}
          <div class="tk-meta">${H.cat(x.category)} ${H.prio(x.priority)} ${x.responsible ? `<span class="muted">${U.icon('user', 13)} ${U.esc(x.responsible)}</span>` : ''}
            ${x.dueDate ? `<span class="muted">${U.icon('flag', 13)} ${U.fmtDate(x.dueDate)}${x.dueTime ? ' ' + x.dueTime : ''}</span>` : '<span class="muted">Sem prazo</span>'}
            ${H.deadline(dl && dl.level !== 'ok' ? dl : null)}</div>
        </div>
        <div class="tk-side">
          ${x.status === 'concluida' || x.status === 'cancelada'
            ? `<button class="icon-btn" data-act="tkSet" data-id="${x.id}" data-s="pendente" title="Reabrir" aria-label="Reabrir">${U.icon('undo', 16)}</button>`
            : `${x.status === 'andamento'
                ? `<button class="icon-btn" data-act="tkSet" data-id="${x.id}" data-s="pendente" title="Voltar para pendente" aria-label="Voltar para pendente">${U.icon('undo', 16)}</button>`
                : `<button class="icon-btn info" data-act="tkSet" data-id="${x.id}" data-s="andamento" title="Começar agora" aria-label="Começar agora">${U.icon('play', 14)}</button>`}
               <button class="icon-btn ok" data-act="tkSet" data-id="${x.id}" data-s="concluida" title="Concluir" aria-label="Concluir">${U.icon('check', 16)}</button>
               <button class="icon-btn" data-act="tkSet" data-id="${x.id}" data-s="cancelada" title="Cancelar tarefa" aria-label="Cancelar tarefa">${U.icon('x', 16)}</button>`}
          <button class="icon-btn" data-act="tkMore" data-id="${x.id}" title="Mais opções" aria-label="Mais opções">${U.icon('more', 16)}</button>
        </div>
      </div>`;
    };

    return `
    <div class="toolbar">
      <div class="stat-chips">${stat('abertas', 'Abertas')}${stat('andamento', 'Em andamento', 'c-blue')}${stat('atrasadas', 'Atrasadas', 'c-red')}${stat('concluida', 'Concluídas', 'c-green')}${stat('todas', 'Todas')}</div>
    </div>
    <div class="filters card">
      <input type="search" placeholder="Buscar tarefa, descrição ou responsável…" value="${U.esc(f.q)}" data-input="tkSearch" aria-label="Buscar">
      ${sel('category', H.catOptions(), 'Todas as categorias')}
      ${sel('priority', H.prioOptions(), 'Todas as prioridades')}
      ${sel('period', [['hoje', 'Prazo hoje'], ['semana', 'Prazo nesta semana'], ['proximos', 'Próximos 7 dias'], ['semprazo', 'Sem prazo']], 'Qualquer prazo')}
      <label class="inline">De <input type="date" value="${f.from}" data-change="tkFilter" data-k="from"></label>
      <label class="inline">Até <input type="date" value="${f.to}" data-change="tkFilter" data-k="to"></label>
      ${filtersOn ? '<button class="btn sm ghost" data-act="tkClear">Limpar filtros</button>' : ''}
    </div>
    <p class="muted small">${U.plural(list.length, 'tarefa encontrada', 'tarefas encontradas')}</p>
    <div class="task-list">${list.length ? list.map(row).join('') : H.empty(all.length ? 'Nenhuma tarefa com esses filtros.' : 'Nenhuma tarefa cadastrada ainda.', all.length ? '' : '<button class="btn sm primary" data-act="tkNew">Criar primeira tarefa</button>')}</div>`;
  },
};

const Tasks = {
  form(x, defaults = {}) {
    const isNew = !x;
    x = x || { priority: 'media', status: 'pendente', category: 'administrativo', startDate: U.today(), ...defaults };
    UI.form({
      title: isNew ? 'Nova tarefa' : 'Editar tarefa',
      wide: true,
      fields: [
        { name: 'title', label: 'Nome', required: true, value: x.title },
        { name: 'description', label: 'Descrição', type: 'textarea', value: x.description },
        { name: 'category', label: 'Categoria', type: 'select', options: H.catOptions(), value: x.category, half: true },
        { name: 'responsible', label: 'Responsável (se delegada)', value: x.responsible, list: D.techNames(), half: true },
        { name: 'priority', label: 'Prioridade', type: 'select', options: H.prioOptions(), value: x.priority, half: true },
        { name: 'status', label: 'Status', type: 'select', options: H.statusOptions(), value: x.status, half: true },
        { name: 'startDate', label: 'Data de início', type: 'date', value: x.startDate, half: true },
        { name: 'dueDate', label: 'Prazo de conclusão', type: 'date', value: x.dueDate, half: true },
        { name: 'dueTime', label: 'Horário (opcional)', type: 'time', value: x.dueTime, half: true },
        { type: 'html', html: isNew ? '' : `<p class="muted small">Criada em ${U.fmtDateTime(x.createdAt)}${x.completedAt ? ` · Concluída em ${U.fmtDateTime(x.completedAt)}` : ''}</p>`, half: true },
        { name: 'notes', label: 'Observações', type: 'textarea', rows: 2, value: x.notes },
      ],
      validate: v => v.startDate && v.dueDate && v.dueDate < v.startDate ? 'O prazo não pode ser anterior à data de início.' : null,
      extra: isNew ? [] : [{ label: `${U.icon('trash', 15)} Excluir`, cls: 'ghost danger-text', onClick: (_, m) => { m.close(); Actions.tkDelete({ id: x.id }); } }],
      onSubmit(v) {
        if (isNew) S.tasks.push({ id: U.uid(), createdAt: new Date().toISOString(), completedAt: v.status === 'concluida' ? new Date().toISOString() : null, ...v });
        else { Tasks.setStatus(x, v.status); Object.assign(x, { ...v, status: x.status }); }
        commit(); UI.toast(isNew ? 'Tarefa criada.' : 'Tarefa atualizada.');
      },
    });
  },
  setStatus(x, s) {
    if (s === 'concluida' && x.status !== 'concluida') x.completedAt = new Date().toISOString();
    if (s !== 'concluida') x.completedAt = null;
    x.status = s;
  },
};

Object.assign(Actions, {
  tkNew() { Tasks.form(null); },
  tkEdit({ id }) { Tasks.form(S.tasks.find(x => x.id === id)); },
  /* Botões da lista (como na Agenda): ✓ conclui, ↶ reabre, ⋯ mais opções */
  tkSet({ id, s }) {
    const x = S.tasks.find(y => y.id === id); if (!x) return;
    const prev = x.status, prevAt = x.completedAt;
    Tasks.setStatus(x, s); commit();
    const undo = { label: 'Desfazer', onClick: () => { x.status = prev; x.completedAt = prevAt; commit(); } };
    if (s === 'concluida') UI.toast('Tarefa concluída.', 'ok', undo);
    else if (s === 'cancelada') UI.toast('Tarefa cancelada.', 'ok', undo);
  },
  tkMore({ id }) {
    const x = S.tasks.find(y => y.id === id); if (!x) return;
    UI.sheet(x.title, [
      { label: 'Editar', icon: 'edit', onClick: () => Tasks.form(x) },
      { label: 'Excluir', icon: 'trash', danger: true, onClick: () => Actions.tkDelete({ id }) },
    ]);
  },
  tkDelete({ id }) {
    const x = S.tasks.find(y => y.id === id);
    UI.confirm(`Excluir a tarefa <strong>${U.esc(x.title)}</strong>?`, () => {
      const i = S.tasks.indexOf(x); S.tasks.splice(i, 1); commit();
      UI.toast('Tarefa excluída.', 'ok', { label: 'Desfazer', onClick: () => { S.tasks.splice(i, 0, x); commit(); } });
    }, { danger: true, okLabel: 'Excluir' });
  },
  tkStatusF({ v }) { App.ui.taskF.status = v; App.render(); },
  tkFilter({ k }, el) { App.ui.taskF[k] = el.value; App.render(); },
  tkSearch(_, el) { App.ui.taskF.q = el.value; App.render({ keepFocus: true }); },
  tkClear() { Object.assign(App.ui.taskF, { q: '', priority: '', category: '', period: '', from: '', to: '' }); App.render(); },
});

</script>
  <script>/* js/views/projetos.js */
'use strict';
/* Gestão de projetos — Kanban e linha do tempo */
Views.projetos = {
  title: 'Gestão de projetos', icon: 'kanban', nav: 'Projetos',
  fab: { act: 'pjNew', label: 'Novo projeto' },
  render() {
    const mode = App.ui.projMode || 'kanban';
    const ps = S.projects;
    const card = p => {
      const pct = D.projectProgress(p);
      const dl = D.deadline(p.dueDate, null, ['concluido', 'cancelado'].includes(p.status));
      const pend = (p.pendencias || []).filter(x => !x.done).length;
      return `<div class="pj-card ${D.projectLate(p) ? 'late' : ''}" draggable="true" data-pid="${p.id}" data-act="pjOpen" data-id="${p.id}">
        <div class="pj-name">${U.esc(p.name)}${H.demo(p)}</div>
        ${p.client ? `<div class="muted small">${U.esc(p.client)}</div>` : ''}
        <div class="pm-b">${H.bar(pct, p.status === 'concluido' ? 'var(--green)' : D.projectLate(p) ? 'var(--red)' : 'var(--accent)')}<strong>${pct}%</strong></div>
        <div class="pj-meta">
          ${p.responsible ? `<span>${U.icon('user', 13)} ${U.esc(p.responsible)}</span>` : ''}
          ${p.stages && p.stages.length ? `<span>${U.icon('tasks', 13)} ${p.stages.filter(s => s.done).length}/${p.stages.length}</span>` : ''}
          ${pend ? `<span class="c-yellow">${U.icon('alert', 13)} ${U.plural(pend, 'pendência', 'pendências')}</span>` : ''}
        </div>
        ${dl && dl.level !== 'ok' ? H.deadline(dl) : p.dueDate ? `<small class="muted">Prazo ${U.fmtDate(p.dueDate)}</small>` : ''}
      </div>`;
    };

    let body;
    if (!ps.length) body = H.empty('Nenhum projeto cadastrado.', '<button class="btn sm primary" data-act="pjNew">Cadastrar projeto</button>');
    else if (mode === 'kanban') {
      body = `<div class="kanban">${Object.entries(PROJECT_STATUS).map(([k, st]) => {
        const items = ps.filter(p => p.status === k);
        if (k === 'cancelado' && !items.length) return '';
        return `<div class="kb-col" data-drop="${k}"><div class="kb-h" style="--c:${st.color}"><span class="cat-dot"></span>${st.label}<span class="kb-n">${items.length}</span></div><div class="kb-items">${items.map(card).join('') || '<div class="kb-empty">Arraste projetos para cá</div>'}</div></div>`;
      }).join('')}</div><p class="muted small">Arraste os cartões entre as colunas para mudar o status (no celular, abra o projeto e altere o status).</p>`;
    } else {
      const dated = ps.filter(p => p.startDate && p.dueDate && p.status !== 'cancelado');
      const undated = ps.filter(p => !(p.startDate && p.dueDate) && p.status !== 'cancelado');
      if (!dated.length) body = H.empty('Defina data de início e prazo nos projetos para vê-los na linha do tempo.');
      else {
        const t = U.today();
        let min = dated.reduce((m, p) => p.startDate < m ? p.startDate : m, t);
        let max = dated.reduce((m, p) => p.dueDate > m ? p.dueDate : m, t);
        min = U.monthStart(U.monthKey(min)); max = U.monthEnd(U.monthKey(max));
        const total = U.diffDays(min, max) + 1;
        const pos = k => U.clamp(U.diffDays(min, k) / total * 100, 0, 100);
        const months = []; for (let mk = U.monthKey(min); mk <= U.monthKey(max); mk = U.addMonths(mk, 1)) months.push(mk);
        body = `<div class="card gantt">
          <div class="g-row g-head"><div class="g-name"></div><div class="g-track">${months.map(mk => `<span class="g-month" style="left:${pos(U.monthStart(mk))}%;width:${(U.diffDays(U.monthStart(mk), U.monthEnd(mk)) + 1) / total * 100}%">${U.MONTHS[Number(mk.slice(5)) - 1].slice(0, 3)}/${mk.slice(2, 4)}</span>`).join('')}</div></div>
          ${dated.sort((a, b) => a.startDate.localeCompare(b.startDate)).map(p => {
            const pct = D.projectProgress(p), st = PROJECT_STATUS[p.status];
            const l = pos(p.startDate), w = Math.max(1.2, pos(U.addDays(p.dueDate, 1)) - l);
            return `<div class="g-row"><div class="g-name" data-act="pjOpen" data-id="${p.id}">${U.esc(p.name)}${H.demo(p)}<small>${st.label} · ${pct}%</small></div>
              <div class="g-track"><span class="g-today" style="left:${pos(t)}%"></span>
              <div class="g-bar ${D.projectLate(p) ? 'late' : ''}" style="left:${l}%;width:${w}%;--c:${st.color}" data-act="pjOpen" data-id="${p.id}" title="${U.esc(p.name)}: ${U.fmtDate(p.startDate)} → ${U.fmtDate(p.dueDate)}"><span style="width:${pct}%"></span></div></div></div>`;
          }).join('')}
          <p class="muted small mt">A linha vermelha vertical marca hoje. O preenchimento da barra indica o percentual concluído.</p>
        </div>
        ${undated.length ? `<p class="muted small">Sem datas definidas: ${undated.map(p => `<a class="link" data-act="pjOpen" data-id="${p.id}">${U.esc(p.name)}</a>`).join(', ')}</p>` : ''}`;
      }
    }

    const cnt = k => ps.filter(p => p.status === k).length;
    return `
    <div class="toolbar">
      <div class="tabs">
        <button class="tab ${mode === 'kanban' ? 'active' : ''}" data-act="pjMode" data-v="kanban">${U.icon('kanban', 15)} Kanban</button>
        <button class="tab ${mode === 'timeline' ? 'active' : ''}" data-act="pjMode" data-v="timeline">${U.icon('timeline', 15)} Linha do tempo</button>
      </div>
      <span class="muted small">${cnt('andamento')} em andamento · ${cnt('planejamento')} em planejamento · ${cnt('concluido')} concluídos${ps.filter(D.projectLate).length ? ` · <span class="c-red">${ps.filter(D.projectLate).length} com prazo vencido</span>` : ''}</span>
    </div>
    ${body}`;
  },
  mount(root) {
    root.querySelectorAll('.pj-card[draggable]').forEach(c => {
      c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.dataset.pid); c.classList.add('dragging'); });
      c.addEventListener('dragend', () => c.classList.remove('dragging'));
    });
    root.querySelectorAll('[data-drop]').forEach(col => {
      col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
      col.addEventListener('dragleave', () => col.classList.remove('over'));
      col.addEventListener('drop', e => {
        e.preventDefault(); col.classList.remove('over');
        const p = S.projects.find(x => x.id === e.dataTransfer.getData('text/plain'));
        if (p && p.status !== col.dataset.drop) { Projects.setStatus(p, col.dataset.drop); commit(); UI.toast(`Status alterado para ${PROJECT_STATUS[p.status].label}.`); }
      });
    });
  },
};

const Projects = {
  openId: null, modal: null,
  setStatus(p, s) {
    if (s === 'concluido' && p.status !== 'concluido') p.completedAt = new Date().toISOString();
    if (s !== 'concluido') p.completedAt = null;
    p.status = s;
  },
  form(p) {
    const isNew = !p;
    p = p || { status: 'planejamento', startDate: U.today(), manualProgress: 0 };
    UI.form({
      title: isNew ? 'Novo projeto' : 'Editar projeto', wide: true,
      fields: [
        { name: 'name', label: 'Nome do projeto', required: true, value: p.name },
        { name: 'client', label: 'Cliente ou empreendimento', value: p.client, half: true },
        { name: 'responsible', label: 'Responsável', value: p.responsible, list: D.techNames(), half: true },
        { name: 'description', label: 'Descrição', type: 'textarea', value: p.description },
        { name: 'startDate', label: 'Data de início', type: 'date', value: p.startDate, half: true },
        { name: 'dueDate', label: 'Prazo previsto', type: 'date', value: p.dueDate, half: true },
        { name: 'status', label: 'Status', type: 'select', options: Object.entries(PROJECT_STATUS).map(([k, v]) => [k, v.label]), value: p.status, half: true },
        { name: 'manualProgress', label: 'Percentual de conclusão (%)', type: 'number', min: 0, max: 100, value: p.manualProgress, half: true, hint: 'Usado apenas quando o projeto não tem etapas cadastradas. Com etapas, o percentual é calculado automaticamente.' },
        { name: 'stagesText', label: isNew ? 'Etapas de execução (uma por linha)' : 'Etapas', type: isNew ? 'textarea' : 'html', html: '<p class="muted small">As etapas e pendências são gerenciadas na tela de detalhes do projeto.</p>', rows: 4, placeholder: 'Ex.:\nVistoria técnica\nInstalação\nConfiguração\nEntrega' },
        { name: 'notes', label: 'Observações', type: 'textarea', rows: 2, value: p.notes },
      ],
      validate: v => v.startDate && v.dueDate && v.dueDate < v.startDate ? 'O prazo não pode ser anterior à data de início.' : (v.manualProgress !== null && (v.manualProgress < 0 || v.manualProgress > 100) ? 'O percentual deve estar entre 0 e 100.' : null),
      onSubmit(v) {
        const { stagesText, status, ...data } = v;
        if (isNew) {
          const np = { id: U.uid(), createdAt: new Date().toISOString(), completedAt: null, status: 'planejamento', stages: (stagesText || '').split('\n').map(s => s.trim()).filter(Boolean).map(name => ({ id: U.uid(), name, done: false })), pendencias: [], ...data };
          Projects.setStatus(np, status);
          S.projects.push(np);
        } else { Object.assign(p, data); Projects.setStatus(p, status); }
        commit(); Projects.refresh(); UI.toast(isNew ? 'Projeto criado.' : 'Projeto atualizado.');
      },
    });
  },
  detailHtml(p) {
    const pct = D.projectProgress(p);
    const dl = D.deadline(p.dueDate, null, ['concluido', 'cancelado'].includes(p.status));
    return `
      <div class="pj-detail">
        <div class="pj-info">
          <div><small>Cliente / empreendimento</small><strong>${U.esc(p.client || '—')}</strong></div>
          <div><small>Responsável</small><strong>${U.esc(p.responsible || '—')}</strong></div>
          <div><small>Início</small><strong>${U.fmtDate(p.startDate)}</strong></div>
          <div><small>Prazo previsto</small><strong>${U.fmtDate(p.dueDate)}</strong> ${H.deadline(dl && dl.level !== 'ok' ? dl : null)}</div>
          <div><small>Status</small><select data-change="pjStatus" data-id="${p.id}">${UI.opts(Object.entries(PROJECT_STATUS).map(([k, v]) => [k, v.label]), p.status)}</select></div>
        </div>
        ${p.description ? `<p>${U.esc(p.description)}</p>` : ''}
        <div class="pm-b big">${H.bar(pct, p.status === 'concluido' ? 'var(--green)' : 'var(--accent)')}<strong>${pct}%</strong></div>
        <small class="muted">${p.stages.length ? 'Calculado pelas etapas concluídas.' : 'Percentual manual (cadastre etapas para cálculo automático).'}</small>

        <h4>Etapas de execução</h4>
        <ul class="checklist">${p.stages.map(s => `<li><label class="check"><input type="checkbox" data-change="pjStage" data-id="${p.id}" data-sid="${s.id}" ${s.done ? 'checked' : ''}><span>${U.esc(s.name)}</span></label><button class="icon-btn xs" data-act="pjStageDel" data-id="${p.id}" data-sid="${s.id}" title="Remover">${U.icon('x', 13)}</button></li>`).join('') || '<li class="muted small">Nenhuma etapa.</li>'}</ul>
        <form class="inline-add" data-submit="pjStageAdd" data-id="${p.id}"><input name="text" placeholder="Nova etapa…" required><button class="btn sm">${U.icon('plus', 15)}</button></form>

        <h4>Pendências</h4>
        <ul class="checklist">${p.pendencias.map(s => `<li><label class="check"><input type="checkbox" data-change="pjPend" data-id="${p.id}" data-sid="${s.id}" ${s.done ? 'checked' : ''}><span>${U.esc(s.text)}</span></label><button class="icon-btn xs" data-act="pjPendDel" data-id="${p.id}" data-sid="${s.id}" title="Remover">${U.icon('x', 13)}</button></li>`).join('') || '<li class="muted small">Nenhuma pendência.</li>'}</ul>
        <form class="inline-add" data-submit="pjPendAdd" data-id="${p.id}"><input name="text" placeholder="Nova pendência…" required><button class="btn sm">${U.icon('plus', 15)}</button></form>

        ${p.notes ? `<h4>Observações</h4><p class="pre">${U.esc(p.notes)}</p>` : ''}
      </div>`;
  },
  open(id) {
    const p = S.projects.find(x => x.id === id); if (!p) return;
    Projects.openId = id;
    const m = UI.modal({
      title: p.name, wide: true, body: Projects.detailHtml(p),
      footer: `<button class="btn ghost danger-text" data-del>${U.icon('trash', 15)} Excluir</button><span class="grow"></span><button class="btn primary" data-edit>${U.icon('edit', 15)} Editar dados</button>`,
      onClose: () => { Projects.openId = null; Projects.modal = null; },
    });
    Projects.modal = m;
    m.el.querySelector('[data-edit]').onclick = () => Projects.form(S.projects.find(x => x.id === id));
    m.el.querySelector('[data-del]').onclick = () => UI.confirm(`Excluir o projeto <strong>${U.esc(p.name)}</strong>?`, () => { S.projects = S.projects.filter(x => x.id !== id); m.close(); commit(); UI.toast('Projeto excluído.'); }, { danger: true, okLabel: 'Excluir' });
  },
  refresh() {
    if (!Projects.modal) return;
    const p = S.projects.find(x => x.id === Projects.openId); if (!p) return;
    Projects.modal.setBody(Projects.detailHtml(p));
    Projects.modal.el.querySelector('.modal-head h2').textContent = p.name;
  },
  sub(id, list, sid) { const p = S.projects.find(x => x.id === id); return [p, p[list].find(s => s.id === sid)]; },
};

Object.assign(Actions, {
  pjMode({ v }) { App.ui.projMode = v; App.render(); },
  pjNew() { Projects.form(null); },
  pjOpen({ id }) { Projects.open(id); },
  pjStatus({ id }, el) { const p = S.projects.find(x => x.id === id); Projects.setStatus(p, el.value); commit(); Projects.refresh(); },
  pjStage({ id, sid }, el) { const [, s] = Projects.sub(id, 'stages', sid); s.done = el.checked; commit(); Projects.refresh(); },
  pjPend({ id, sid }, el) { const [, s] = Projects.sub(id, 'pendencias', sid); s.done = el.checked; commit(); Projects.refresh(); },
  pjStageDel({ id, sid }) { const p = S.projects.find(x => x.id === id); p.stages = p.stages.filter(s => s.id !== sid); commit(); Projects.refresh(); },
  pjPendDel({ id, sid }) { const p = S.projects.find(x => x.id === id); p.pendencias = p.pendencias.filter(s => s.id !== sid); commit(); Projects.refresh(); },
  pjStageAdd({ id }, form) { const p = S.projects.find(x => x.id === id); p.stages.push({ id: U.uid(), name: form.elements.text.value.trim(), done: false }); commit(); Projects.refresh(); Projects.modal.el.querySelector('[data-submit="pjStageAdd"] input').focus(); },
  pjPendAdd({ id }, form) { const p = S.projects.find(x => x.id === id); p.pendencias.push({ id: U.uid(), text: form.elements.text.value.trim(), done: false }); commit(); Projects.refresh(); Projects.modal.el.querySelector('[data-submit="pjPendAdd"] input').focus(); },
});

</script>
  <script>/* js/views/indicadores.js */
'use strict';
/* Indicadores e relatórios — dados lançados manualmente; sem dados = "sem dados" */
const Ind = {
  range() {
    const f = App.ui.indF = App.ui.indF || { period: 'mes', from: '', to: '', metric: 'pontosCamera', gran: 'diario' };
    const t = U.today();
    if (f.period === 'semana') { const ws = U.weekStart(t); return [ws, U.addDays(ws, 6), 'Semana atual']; }
    if (f.period === 'mes') { const mk = U.monthKey(t); return [U.monthStart(mk), U.monthEnd(mk), U.fmtMonth(mk)]; }
    if (f.period === 'mesant') { const mk = U.addMonths(U.monthKey(t), -1); return [U.monthStart(mk), U.monthEnd(mk), U.fmtMonth(mk)]; }
    if (f.period === 'ano') { const y = t.slice(0, 4); return [`${y}-01-01`, `${y}-12-31`, `Ano de ${y}`]; }
    const from = f.from || U.addDays(t, -30), to = f.to || t;
    return [from, to, `${U.fmtDate(from)} a ${U.fmtDate(to)}`];
  },
  buckets(from, to, gran) {
    if (gran === 'mensal') { const out = []; for (let mk = U.monthKey(from); mk <= U.monthKey(to); mk = U.addMonths(mk, 1)) out.push({ label: U.MONTHS[Number(mk.slice(5)) - 1].slice(0, 3) + '/' + mk.slice(2, 4), from: U.monthStart(mk) < from ? from : U.monthStart(mk), to: U.monthEnd(mk) > to ? to : U.monthEnd(mk) }); return out; }
    if (gran === 'semanal') { const out = []; for (let ws = U.weekStart(from); ws <= to; ws = U.addDays(ws, 7)) out.push({ label: U.fmtShort(ws), from: ws < from ? from : ws, to: U.addDays(ws, 6) > to ? to : U.addDays(ws, 6) }); return out; }
    let days = U.daysInRange(from, to);
    if (days.length > 62) days = days.slice(-62);
    return days.map(k => ({ label: U.fmtShort(k), from: k, to: k }));
  },
  techRows(from, to) {
    const names = [...new Set([...D.techNames(), ...D.records(from, to).map(r => r.technician).filter(Boolean)])];
    return names.map(n => {
      const recs = D.records(from, to).filter(r => r.technician === n);
      const v = m => D.metricValue(m, from, to, r => r.technician === n);
      return { name: n, days: new Set(recs.map(r => r.date)).size, pontosCamera: v('pontosCamera'), manutencoes: v('manutencoes'), retrabalhos: v('retrabalhos') };
    });
  },
  form(r) {
    const isNew = !r;
    r = r || { date: U.today(), technician: '', values: {} };
    UI.form({
      title: isNew ? 'Lançar dados de indicadores' : 'Editar lançamento', wide: true,
      fields: [
        { type: 'html', html: '<p class="muted small">Preencha apenas o que você tem. Campos em branco ficam como <strong>sem dados</strong> (não são tratados como zero).</p>' },
        { name: 'date', label: 'Data', type: 'date', required: true, value: r.date, half: true },
        { name: 'technician', label: 'Pessoa', type: 'select', options: H.techOptions(r.technician).map(([v, l]) => [v, v ? l : 'Equipe (geral)']), value: r.technician, half: true, hint: D.techNames().length ? '' : 'Cadastre a equipe em Configurações para lançar a produtividade de cada pessoa.' },
        ...METRICS.map(m => ({ name: m.key, label: m.label, type: 'number', min: 0, step: 1, value: r.values[m.key], half: true })),
        { name: 'notes', label: 'Observações', type: 'textarea', rows: 2, value: r.notes },
      ],
      validate: v => METRICS.every(m => v[m.key] === null) ? 'Preencha pelo menos um indicador.' : (METRICS.some(m => v[m.key] !== null && v[m.key] < 0) ? 'Os valores não podem ser negativos.' : null),
      onSubmit(v) {
        const values = {}; METRICS.forEach(m => { values[m.key] = v[m.key]; });
        if (isNew) S.indicators.push({ id: U.uid(), date: v.date, technician: v.technician, notes: v.notes, values });
        else Object.assign(r, { date: v.date, technician: v.technician, notes: v.notes, values });
        commit(); UI.toast('Lançamento salvo.');
      },
    });
  },
};

Views.indicadores = {
  title: 'Indicadores e relatórios', icon: 'chart', nav: 'Indicadores',
  fab: { act: 'indNew', label: 'Lançar dados' },
  render() {
    const [from, to, label] = Ind.range();
    const f = App.ui.indF;
    const recs = D.records(from, to).sort((a, b) => b.date.localeCompare(a.date) || (a.technician || '').localeCompare(b.technician || ''));
    const val = m => D.metricValue(m, from, to);
    const man = val('manutencoes'), ret = val('retrabalhos');
    const projDone = D.metricValue('projetosConcluidos', from, to);
    const projAnd = S.projects.filter(p => p.status === 'andamento').length;
    const goals = S.settings.goals.map(g => ({ g, st: D.goalStatus(g, to < U.today() ? to : U.today()) }));
    const goalsWithData = goals.filter(x => x.st.achieved !== null);

    const kpi = (m) => {
      const v = val(m.key);
      const sub = m.snapshot ? (v === null ? '' : `posição em ${U.fmtShort(D.lastDateWith(m.key, from, to))}`) : 'soma no período';
      return `<div class="kpi ${v === null ? 'nodata' : ''}"><span class="kpi-l">${m.label}</span><strong class="kpi-v">${v === null ? '—' : U.fmtNum(v)}</strong><span class="kpi-s">${v === null ? 'Sem dados' : sub}</span></div>`;
    };

    const b = Ind.buckets(from, to, f.gran);
    const metricMeta = METRICS.find(m => m.key === f.metric) || METRICS[0];
    const series1 = [{ name: metricMeta.label, color: 'var(--accent)', values: b.map(x => D.metricValue(metricMeta.key, x.from, x.to)) }];
    const series2 = [
      { name: mLabel('manutencoes'), color: 'var(--lilac)', values: b.map(x => D.metricValue('manutencoes', x.from, x.to)) },
      { name: mLabel('retrabalhos'), color: 'var(--red)', values: b.map(x => D.metricValue('retrabalhos', x.from, x.to)) },
    ];
    const techs = Ind.techRows(from, to);
    const techWithData = techs.filter(r => r.days);

    return `
    <div class="toolbar">
      <div class="tabs">
        ${[['semana', 'Semana'], ['mes', 'Mês atual'], ['mesant', 'Mês anterior'], ['ano', 'Ano'], ['custom', 'Personalizado']].map(([v, l]) => `<button class="tab ${f.period === v ? 'active' : ''}" data-act="indPeriod" data-v="${v}">${l}</button>`).join('')}
      </div>
      ${f.period === 'custom' ? `<label class="inline">De <input type="date" value="${from}" data-change="indDate" data-k="from"></label><label class="inline">Até <input type="date" value="${to}" data-change="indDate" data-k="to"></label>` : ''}
      <span class="grow"></span>
      <button class="btn ghost" data-act="indXlsx">${U.icon('download')} Excel</button>
      <button class="btn ghost" data-act="indPdf">${U.icon('printer')} PDF</button>
    </div>
    <p class="muted small">Período: <strong>${label}</strong> (${U.fmtDate(from)} a ${U.fmtDate(to)}) · ${U.plural(recs.length, 'lançamento')}</p>

    <section class="kpis kpis-ind">
      ${METRICS.map(kpi).join('')}
      <div class="kpi"><span class="kpi-l">Projetos concluídos</span><strong class="kpi-v">${projDone}</strong><span class="kpi-s">no período</span></div>
      <div class="kpi"><span class="kpi-l">Projetos em andamento</span><strong class="kpi-v">${projAnd}</strong><span class="kpi-s">situação atual</span></div>
      <div class="kpi ${goalsWithData.length ? '' : 'nodata'}"><span class="kpi-l">Metas alcançadas</span><strong class="kpi-v">${goals.length ? `${goalsWithData.filter(x => x.st.achieved).length}/${goals.length}` : '—'}</strong><span class="kpi-s">${goals.length ? (goalsWithData.length ? 'período vigente de cada meta' : 'Sem dados') : 'Nenhuma meta configurada'}</span></div>
    </section>

    <section class="grid-2">
      <div class="card">
        <div class="card-h"><h3>Acompanhamento</h3>
          <div class="chart-ctrl">
            <select data-change="indSet" data-k="metric">${UI.opts(METRICS.map(m => [m.key, m.label]), f.metric)}</select>
            <select data-change="indSet" data-k="gran">${UI.opts([['diario', 'Diário'], ['semanal', 'Semanal'], ['mensal', 'Mensal']], f.gran)}</select>
          </div></div>
        ${Charts.bars({ labels: b.map(x => x.label), series: series1 })}
        ${metricMeta.snapshot ? '<p class="muted small">Indicador de posição: cada barra mostra o último valor registrado no intervalo.</p>' : ''}
      </div>
      <div class="card">
        <div class="card-h"><h3>${U.esc(mLabel('manutencoes'))} × ${U.esc(mLabel('retrabalhos'))}</h3><span class="muted small">${{ diario: 'Diário', semanal: 'Semanal', mensal: 'Mensal' }[f.gran]}</span></div>
        ${Charts.bars({ labels: b.map(x => x.label), series: series2 })}
      </div>
    </section>

    <section class="grid-2">
      <div class="card">
        <div class="card-h"><h3>${U.icon('user')} Produtividade por pessoa</h3></div>
        ${techWithData.length ? `${Charts.hbars(techWithData.map(r => ({ label: r.name, value: r.pontosCamera, color: 'var(--accent)' })), '')}
          <div class="table-wrap"><table class="table"><thead><tr><th>Pessoa</th><th>Dias</th>${METRICS.map(m => `<th>${U.esc(m.label)}</th>`).join('')}</tr></thead>
          <tbody>${techWithData.map(r => `<tr><td>${U.esc(r.name)}</td><td>${r.days}</td><td>${U.fmtNum(r.pontosCamera)}</td><td>${U.fmtNum(r.manutencoes)}</td><td>${U.fmtNum(r.retrabalhos)}</td></tr>`).join('')}</tbody></table></div>`
          : H.empty(D.techNames().length ? 'Nenhum lançamento por pessoa no período.' : 'Cadastre a equipe em Configurações e lance os dados por pessoa para ver a produtividade individual.')}
      </div>
      <div class="card">
        <div class="card-h"><h3>${U.icon('target')} Metas</h3><a class="link" href="#config">Configurar</a></div>
        ${goals.length ? goals.map(({ g, st }) => `<div class="goal"><div class="goal-h"><span>${U.esc(g.name || metricLabel(g.metric))}</span>${H.demo(g)}${st.achieved === null ? '<span class="badge">Sem dados</span>' : st.achieved ? '<span class="badge b-green">Alcançada</span>' : '<span class="badge b-yellow">Não alcançada</span>'}</div>${H.bar(st.pct, st.achieved ? 'var(--green)' : 'var(--yellow)')}<small class="muted">${st.val === null ? 'Sem dados' : U.fmtNum(st.val)} / ${g.direction === 'max' ? 'máx. ' : ''}${U.fmtNum(st.target)} · ${g.period} (${U.fmtShort(st.from)}–${U.fmtShort(st.to)})</small></div>`).join('') : H.empty('Nenhuma meta configurada.')}
      </div>
    </section>

    <div class="card">
      <div class="card-h"><h3>Lançamentos do período</h3><span class="muted small">Totais somam todos os lançamentos. Se lançar por pessoa, não repita os mesmos números como "Equipe (geral)".</span></div>
      ${recs.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Data</th><th>Pessoa</th>${METRICS.map(m => `<th title="${U.esc(m.label)}">${U.esc(m.label)}</th>`).join('')}<th></th></tr></thead>
        <tbody>${recs.map(r => `<tr><td>${U.fmtDate(r.date)}</td><td>${U.esc(r.technician || 'Equipe (geral)')}${H.demo(r)}</td>${METRICS.map(m => `<td>${r.values[m.key] === null || r.values[m.key] === undefined ? '<span class="muted">—</span>' : r.values[m.key]}</td>`).join('')}<td class="nowrap"><button class="icon-btn xs" data-act="indEdit" data-id="${r.id}">${U.icon('edit', 14)}</button><button class="icon-btn xs" data-act="indDel" data-id="${r.id}">${U.icon('trash', 14)}</button></td></tr>`).join('')}</tbody></table></div>`
        : H.empty('Nenhum dado lançado neste período.', '<button class="btn sm primary" data-act="indNew">Lançar dados</button>')}
    </div>`;
  },
};

Object.assign(Actions, {
  indPeriod({ v }) { App.ui.indF.period = v; if (v === 'custom' && !App.ui.indF.from) { App.ui.indF.from = U.addDays(U.today(), -30); App.ui.indF.to = U.today(); } App.render(); },
  indDate({ k }, el) { App.ui.indF[k] = el.value; App.render(); },
  indSet({ k }, el) { App.ui.indF[k] = el.value; App.render(); },
  indNew() { Ind.form(null); },
  indEdit({ id }) { Ind.form(S.indicators.find(r => r.id === id)); },
  indDel({ id }) { UI.confirm('Excluir este lançamento?', () => { S.indicators = S.indicators.filter(r => r.id !== id); commit(); }, { danger: true, okLabel: 'Excluir' }); },
  indXlsx() { const [from, to, label] = Ind.range(); Reports.xlsx(from, to, label); },
  indPdf() { const [from, to, label] = Ind.range(); Reports.pdf(from, to, label); },
});

</script>
  <script>/* js/views/config.js */
'use strict';
/* Configurações — jornada, rotina, categorias, prioridades, status, equipe, metas e dados */
Views.config = {

  render() {

    return `
    <nav class="cfg-nav">${[['aparencia', 'Aparência'], ...(Fire.supported() ? [['conta', 'Conta']] : []), ['drive', 'Google Drive'], ['lembretes', 'Lembretes'], ['ia', 'IA'], ['jornada', 'Jornada'], ['rotina', 'Rotina padrão'], ['categorias', 'Categorias'], ['prioridades', 'Prioridades e status'], ['tecnicos', 'Equipe'], ...(st.showIndicadores ? [['metas', 'Metas']] : []), ['dados', 'Dados']].map(([id, l]) => `<a href="#config" data-act="cfgJump" data-id="${id}">${l}</a>`).join('')}</nav>

    ${sec('aparencia', 'Aparência', 'Escolha o visual do app e quais telas aparecem no menu.', `
      <div class="theme-pick" role="radiogroup" aria-label="Tema">${[
        ['escuro', 'Escuro', 'Grafite e roxo'],
        ['claro', 'Claro', 'Fundo claro'],
        ['auto', 'Automático', 'Segue o aparelho'],
      ].map(([v, l, d]) => `<button class="theme-opt ${(st.theme || 'escuro') === v ? 'on' : ''}" role="radio" aria-checked="${(st.theme || 'escuro') === v}" data-act="themeSet" data-v="${v}">
          <span class="theme-prev tp-${v}"><i></i><i></i><i></i></span><strong>${l}</strong><small>${d}</small></button>`).join('')}</div>

      <label class="switch-row"><span><strong>Modo jogo (Jornada)</strong><small>XP, níveis, sequência de dias, missões e conquistas, calculados com o que você faz no app. Aparece no Início e no menu.</small></span>
        <input type="checkbox" class="switch" data-change="cfgJogo" ${st.jogo !== false ? 'checked' : ''}></label>
      <label class="switch-row"><span><strong>Mostrar a tela Indicadores</strong><small>Lançamento diário de números da equipe (serviços, manutenções, retrabalhos), metas e relatórios em Excel e PDF. Os dados ficam guardados mesmo com a tela oculta.</small></span>
        <input type="checkbox" class="switch" data-change="cfgIndicadores" ${st.showIndicadores ? 'checked' : ''}></label>
      <label class="switch-row"><span><strong>Mostrar a tela Projetos</strong><small>Obras e projetos com etapas, Kanban e linha do tempo. Os dados ficam guardados mesmo com a tela oculta.</small></span>
        <input type="checkbox" class="switch" data-change="cfgProjetos" ${st.showProjetos ? 'checked' : ''}></label>`)}

    ${Fire.section(sec)}

    ${Drive.section(sec)}

    ${Reminders.section(sec)}

    ${sec('ia', 'IA (Google Gemini)', IA.supported() ? 'Preenche o registro das reuniões a partir da gravação ou das suas anotações. Usa a sua própria chave do Google.' : '', !IA.supported() ? '<p class="muted small">A IA funciona no app Android e no site. No link do Claude ela não está disponível.</p>' : `
      ${IA.key() ? `<div class="lem-row ok">${U.icon('check', 16)}<span>Chave cadastrada (termina em <strong>${U.esc(IA.key().slice(-4))}</strong>)</span><button class="btn sm" data-act="iaTest">Testar</button><button class="btn sm ghost danger-text" data-act="iaRemove">Remover</button></div>` : ''}

        <label for="ia-key">${IA.key() ? 'Trocar a chave' : 'Chave da API'}</label>

      <form class="ia-agent" data-submit="iaAgentSave">
        <label for="ia-agent">Instruções do seu agente <span class="muted">(opcional)</span></label>
