:root {
  /* tema claro */
  --bg: #f5f3f9;
  --surface: #ffffff;
  --surface-2: #f2eff7;
  --surface-3: #e9e4f2;
  --border: #e4deed;
  --line: #eee9f4;
  --border-strong: #cfc6de;
  --input-border: #d8d0e6;
  --hover: #f1ecf8;
  --track: #e9e4f1;
  --text: #17131f;
  --text-2: #3d3749;
  --muted: #696279;
  --primary: #6b2fd9;
  --primary-2: #5a22c2;
  --accent: #7b3fe4;
  --lilac: #a985f2;
  --link: #6224cf;
  --green: #1d9a69;
  --blue: #7b3fe4;
  --yellow: #c27d10;
  --red: #d63a51;
  --gray: #8e87a3;
  --cy1: #6b2fd9; --cy2: #8b5cf0; --cy3: #a985f2; --cy4: #c6aff8;
  --t-evento: #a985f2; --t-tarefa: #6b2fd9; --t-projeto: #2f9f93; --t-imprevisto: #d63a51;
  --red-bg: #fdedf0; --red-bg-soft: #fff7f8; --red-border: #f5c7cf; --red-text: #a01f37;
  --yellow-bg: #fcf3e2; --yellow-border: #efd7a4; --yellow-text: #855409;
  --blue-bg: #f1eafd; --blue-bg-soft: #f8f5fe; --blue-border: #d8c8fa; --blue-text: #5a22c2;
  --green-bg: #e7f6ef; --green-bg-soft: #f4fbf8; --green-border: #bde5d2; --green-text: #12673f;
  --orange-bg: #fcf1e3; --orange-border: #efcfa2; --orange-text: #85480a;
  --overlay: rgba(46, 22, 92, .06);
  --mix-base: #ffffff; --mix-ink: #000000;
  --toast-bg: #1c1825; --toast-text: #f4f1f9;
  --shadow: 0 1px 2px rgba(31, 18, 61, .05);
  --shadow-pop: 0 18px 50px rgba(23, 12, 46, .18);
  /* barra lateral e barra inferior: sempre escuras (identidade) */
  --side-bg: #100d17; --side-text: #b8b0c8; --side-muted: #776f88; --side-line: rgba(255, 255, 255, .06);
  --side-active: rgba(148, 97, 245, .16); --side-hi: #d6c6ff;

  --font: "Geist", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-d: "Bricolage Grotesque", "Geist", "Segoe UI", system-ui, sans-serif;
  --r-lg: 18px; --r: 14px; --r-sm: 10px;
  --radius: 14px;
  --side-w: 256px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
/* Tema escuro (padrão do novo visual) */
:root[data-theme="dark"] {
  --bg: #0e0c13;
  --surface: #16131d;
  --surface-2: #1c1825;
  --surface-3: #251f30;
  --border: #272131;
  --line: #201b29;
  --border-strong: #3a3248;
  --input-border: #342c40;
  --hover: #1f1a29;
  --track: #261f31;
  --text: #f2eff8;
  --text-2: #d0c9dc;
  --muted: #9d96ae;
  --primary: #7b3fe4;
  --primary-2: #8a52f0;
  --accent: #9461f5;
  --lilac: #c4a8ff;
  --link: #bfa2ff;
  --green: #3dbe8b;
  --blue: #a47bff;
  --yellow: #e3a043;
  --red: #f0566a;
  --gray: #8e87a3;
  --cy1: #7b3fe4; --cy2: #9461f5; --cy3: #b28eff; --cy4: #d7c6ff;
  --t-evento: #c4a8ff; --t-tarefa: #9461f5; --t-projeto: #3fb5a8; --t-imprevisto: #f0566a;
  --red-bg: #2a141a; --red-bg-soft: #1c1218; --red-border: #5a2231; --red-text: #ff9fac;
  --yellow-bg: #2a2014; --yellow-border: #5a441a; --yellow-text: #f2c77d;
  --blue-bg: #231a37; --blue-bg-soft: #1a1527; --blue-border: #46317c; --blue-text: #cdb8ff;
  --green-bg: #11251d; --green-bg-soft: #131c19; --green-border: #1f4a37; --green-text: #8fe3bf;
  --orange-bg: #2a1d12; --orange-border: #5c3a17; --orange-text: #f6b877;
  --overlay: rgba(255, 255, 255, .06);
  --mix-base: #16131d; --mix-ink: #ffffff;
  --toast-bg: #2a2436; --toast-text: #f2eff8;
  --shadow: none;
  --shadow-pop: 0 24px 60px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body { margin: 0; font-family: var(--font); font-size: 14.5px; line-height: 1.5; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; font-feature-settings: "ss01"; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-family: var(--font-d); font-weight: 600; letter-spacing: -.01em; }
h3 { font-size: 16px; }
h4 { font-family: var(--font); font-size: 13px; font-weight: 600; letter-spacing: 0; color: var(--muted); margin: 20px 0 8px; }
p { margin: 0 0 6px; }
strong { font-weight: 620; }
button, input, select, textarea { font: inherit; color: inherit; }
::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }
:focus-visible { outline: 2px solid var(--lilac); outline-offset: 2px; border-radius: 6px; }
.ic { flex-shrink: 0; vertical-align: -3px; stroke-width: 1.75; }
.grow { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.mt { margin-top: 12px; }
.nowrap { white-space: nowrap; }
.pre { white-space: pre-wrap; }
.c-green { color: var(--green); } .c-blue { color: var(--blue); } .c-red { color: var(--red); } .c-yellow { color: var(--yellow); } .c-gray { color: var(--muted); }

/* ---------- Estrutura ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar { width: var(--side-w); background: var(--side-bg); color: var(--side-text); position: fixed; inset: 0 auto 0 0; display: flex; flex-direction: column; z-index: 40; transition: transform .28s var(--ease); border-right: 1px solid var(--side-line); padding-top: env(safe-area-inset-top); }
.brand { display: flex; gap: 12px; align-items: center; padding: 24px 22px 14px; color: #fff; }
.brand strong { font-family: "Quicksand", var(--font-d); font-size: 19px; font-weight: 700; letter-spacing: .01em; display: block; line-height: 1.15; }
.brand small { display: block; color: var(--side-muted); font-size: 11.5px; margin-top: 2px; }
.brand-logo { width: 38px; height: 38px; flex-shrink: 0; }
.nav { padding: 4px 12px 12px; display: flex; flex-direction: column; overflow-y: auto; flex: 1; }
.nav-group { display: flex; flex-direction: column; gap: 2px; margin-top: 18px; }
.nav-g { font-size: 11.5px; color: var(--side-muted); padding: 0 12px 6px; font-weight: 500; }
.nav a { position: relative; display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; font-size: 14px; color: var(--side-text); transition: background .18s, color .18s; }
.nav a .ic { color: var(--side-muted); transition: color .18s; }
.nav a:hover { background: rgba(255, 255, 255, .04); color: #fff; }
.nav a:hover .ic { color: var(--side-text); }
.nav a.active { background: var(--side-active); color: #fff; font-weight: 550; }
.nav a.active .ic { color: var(--side-hi); }
.nav a.active::before { content: ""; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: #b28eff; }
.nav-badge { margin-left: auto; background: #f0566a; color: #fff; font-size: 11px; font-weight: 650; border-radius: 99px; padding: 0 7px; line-height: 18px; font-variant-numeric: tabular-nums; }
.sidebar-foot { padding: 14px 22px calc(16px + env(safe-area-inset-bottom)); font-size: 11.5px; color: var(--side-muted); border-top: 1px solid var(--side-line); }
.dot-ok, .dot-err, .dot-wait { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #3dbe8b; margin-right: 6px; }
.dot-err { background: #f0566a; }
.dot-wait { background: #e3a043; }
.loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 60px 0; color: var(--muted); }
.spinner { width: 18px; height: 18px; border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.main { flex: 1; margin-left: var(--side-w); min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: calc(14px + env(safe-area-inset-top)) 36px 14px; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); border-bottom: 1px solid var(--line); }
.topbar h1 { font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
.top-clock { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.icon-btn.menu-btn { display: none; position: relative; }
.bottom-nav { display: none; }
/* Botão flutuante "+" (cria o item da tela atual) */
.fab { position: fixed; right: 32px; bottom: 32px; z-index: 31; width: 58px; height: 58px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; color: #fff; background: linear-gradient(145deg, var(--accent), var(--primary)); box-shadow: 0 10px 26px rgba(91, 40, 200, .45), inset 0 1px 0 rgba(255, 255, 255, .2); transition: transform .18s var(--ease), box-shadow .2s; }
.fab[hidden] { display: none; }
.fab:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(91, 40, 200, .5), inset 0 1px 0 rgba(255, 255, 255, .2); }
.fab:active { transform: scale(.92); }
.fab:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 3px; }
body.menu-open .fab { display: none; }
/* Canal de teste */
.teste-tag { order: 10; font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 3px 9px; border-radius: 99px; background: #e3a043; color: #2a1a04; }
body.canal-teste .topbar { box-shadow: inset 0 3px 0 #e3a043; }
.menu-btn.has-badge::after { content: ""; position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: #f0566a; box-shadow: 0 0 0 2px var(--bg); }
.view { padding: 28px 36px 110px; display: flex; flex-direction: column; gap: 20px; max-width: 1360px; width: 100%; }
.view.enter { animation: viewIn .26s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.backdrop { display: none; }

/* ---------- Componentes básicos ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { background: transparent; border: 0; border-top: 1px solid var(--border); border-radius: 0; box-shadow: none; padding: 18px 2px 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h3 { display: flex; align-items: center; gap: 9px; }
.card-h h3 .ic { color: var(--accent); width: 17px; height: 17px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid-2.tight { gap: 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; padding: 7px 15px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 560; font-size: 13.5px; white-space: nowrap; transition: background .15s, border-color .15s, transform .12s, box-shadow .15s; }
.btn:hover { background: var(--hover); border-color: var(--border-strong); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--primary); border-color: transparent; color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14); }
.btn.primary:hover { background: var(--primary-2); }
.btn.warn { background: var(--red-bg); border-color: var(--red-border); color: var(--red-text); }
.btn.warn:hover { background: var(--red-bg); border-color: var(--red); }
.btn.danger { background: var(--red); border-color: transparent; color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--overlay); }
.btn.sm { min-height: 32px; padding: 5px 11px; font-size: 12.5px; border-radius: 9px; }
.danger-text { color: var(--red) !important; }
.ok-text { color: var(--green) !important; }
.icon-btn { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--muted); transition: background .15s, color .15s, transform .12s; }
.icon-btn:hover { background: var(--overlay); color: var(--text); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.ok { color: var(--green); border-color: var(--green-border); background: var(--green-bg); }
.icon-btn.info { color: var(--blue-text); border-color: var(--blue-border); background: var(--blue-bg); }
.icon-btn.xs { width: 28px; height: 28px; border-radius: 8px; }
.link { color: var(--link); font-weight: 560; font-size: 13px; cursor: pointer; background: none; border: 0; padding: 0; text-underline-offset: 3px; }
.link:hover { text-decoration: underline; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 560; white-space: nowrap; line-height: 19px; background: color-mix(in srgb, var(--c) 14%, var(--mix-base)); color: color-mix(in srgb, var(--c) 72%, var(--mix-ink)); }
.chip.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 7px; font-size: 11px; font-weight: 600; background: var(--track); color: var(--text-2); white-space: nowrap; line-height: 18px; }
.b-blue { background: var(--blue-bg); color: var(--blue-text); } .b-red { background: var(--red-bg); color: var(--red-text); } .b-green { background: var(--green-bg); color: var(--green-text); } .b-yellow { background: var(--yellow-bg); color: var(--yellow-text); }
.demo-badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 5px; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; color: #3b2508; background: #f2c77d; vertical-align: 1px; line-height: 16px; }
.bar { height: 6px; background: var(--track); border-radius: 99px; overflow: hidden; flex: 1; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .5s var(--ease); }
.alert { display: flex; align-items: center; gap: 9px; padding: 11px 14px; border-radius: 12px; font-size: 13.5px; flex-wrap: wrap; }
.a-red { background: var(--red-bg); color: var(--red-text); border: 1px solid var(--red-border); }
.a-yellow { background: var(--yellow-bg); color: var(--yellow-text); border: 1px solid var(--yellow-border); }
.a-accent { background: var(--blue-bg); color: var(--text); border: 1px solid var(--blue-border); }
.a-accent > .ic { color: var(--accent); }
.update-banner > span { flex: 1 1 220px; }
.alert .link { color: inherit; text-decoration: underline; }
.empty { text-align: center; color: var(--muted); padding: 26px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty p { margin: 0; max-width: 380px; font-size: 13.5px; }
.empty .ic { opacity: .45; }
.dl { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; padding: 1px 8px; border-radius: 7px; }
.dl-late { color: var(--red-text); background: var(--red-bg); }
.dl-today, .dl-soon { color: var(--yellow-text); background: var(--yellow-bg); }
.dl-ok { color: var(--muted); }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.date-nav { display: flex; align-items: center; gap: 6px; }
.date-nav input[type=date] { min-height: 38px; padding: 6px 10px; border: 1px solid var(--input-border); border-radius: 11px; background: var(--surface); }
.range-lbl { font-family: var(--font-d); font-size: 16px; font-weight: 600; min-width: 150px; text-align: center; font-variant-numeric: tabular-nums; }
.tabs { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.tab { border: 0; background: transparent; padding: 6px 13px; border-radius: 9px; cursor: pointer; font-weight: 560; font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; transition: background .15s, color .15s; }
.tab span { background: var(--overlay); border-radius: 99px; padding: 0 7px; font-size: 11.5px; }
.tab.active { background: var(--surface-3); color: var(--text); }
label.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
label.inline input, .filters input, .filters select, .chart-ctrl select { min-height: 38px; padding: 7px 11px; border: 1px solid var(--input-border); border-radius: 11px; background: var(--surface-2); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* ---------- Régua do dia (linha do tempo da agenda) ---------- */
.rail { display: block; position: relative; padding-top: 8px; }
.rail-track { position: relative; display: block; height: 12px; }
.seg { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--track); transition: background .2s; }
.seg.s-done { background: var(--accent); }
.seg.s-run { background: repeating-linear-gradient(-45deg, var(--lilac) 0 4px, color-mix(in srgb, var(--lilac) 55%, transparent) 4px 8px); }
.seg.s-now { background: var(--lilac); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lilac) 22%, transparent); }
.seg.s-late { background: color-mix(in srgb, var(--red) 58%, var(--mix-base)); }
.seg.s-break { background: repeating-linear-gradient(-45deg, transparent 0 3px, var(--border-strong) 3px 4px); opacity: .7; }
.rail-now { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--text); }
.rail-now::before { content: ""; position: absolute; top: -3px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--text); }
.rail-ticks { position: relative; display: block; height: 18px; margin-top: 8px; }
.rail-ticks span { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rail-ticks span:first-child { transform: none; }
.rail-ticks span:last-child { transform: translateX(-100%); }
a.rail:hover .seg:not(.s-break) { filter: brightness(1.08); }

/* ---------- Dashboard ---------- */
.topbar.is-hero h1 { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.th-greet { font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.th-date { font-size: 23px; font-weight: 600; letter-spacing: -.025em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar.is-hero .top-clock { display: block; font-family: var(--font-d); font-size: 22px; color: var(--text-2); letter-spacing: -.01em; }
/* Cartão "Hoje" da tela inicial: Jornada (XP e meta) + expediente e barra do dia */
.day-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.day-card .jg-card { border: 0; border-radius: 0; background: transparent; }
.dc-day { padding: 12px 16px 12px; display: flex; flex-direction: column; gap: 2px; }
.jg-card + .dc-day { border-top: 1px solid var(--line); }
.dc-day-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); }
.dc-day-h strong { color: var(--text); font-weight: 600; }
.dc-prog { font-size: 12.5px; color: var(--muted); text-decoration: none; white-space: nowrap; } .dc-prog:hover { color: var(--text); }
.kpis { display: grid; grid-template-columns: 1.5fr repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow); }
.kpis-ind { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.kpi { background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; min-width: 0; transition: background .15s; }
a.kpi[href], a.kpi[data-act] { cursor: pointer; }
a.kpi[href]:hover, a.kpi[data-act]:hover { background: var(--hover); }
.kpi-l { font-size: 12.5px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 7px; }
.kpi:not(.kpi-ring) .kpi-l::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gray); flex-shrink: 0; }
.kpi.k-green .kpi-l::before { background: var(--green); } .kpi.k-red .kpi-l::before { background: var(--red); } .kpi.k-yellow .kpi-l::before { background: var(--yellow); } .kpi.k-blue .kpi-l::before { background: var(--accent); }
.kpi-v { font-family: var(--font-d); font-size: 32px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.kpi.k-red .kpi-v { color: var(--red); }
.kpi-s { font-size: 12px; color: var(--muted); }
.kpi.nodata .kpi-v { color: var(--muted); }
.kpi-ring { flex-direction: row; align-items: center; gap: 16px; }
.kpi-ring > div { display: flex; flex-direction: column; gap: 3px; }
.kpi-ring .kpi-l { font-size: 13.5px; color: var(--text); font-weight: 600; }
.ring-bg { stroke: var(--track); }
.ring-txt { font-family: var(--font-d); font-size: 17px; font-weight: 600; fill: var(--text); }
.ring-fg { transition: stroke-dasharray .6s var(--ease); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); min-width: 0; }
.li:last-child { border-bottom: 0; }
.li-now { background: var(--blue-bg); border-radius: 10px; padding-left: 10px; border-bottom-color: transparent; }
.li-time { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 86px; }
.li-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; }
.li-main > span:not(.chip):not(.demo-badge) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li-stack { flex-direction: column; align-items: stretch; gap: 3px; }
.li-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.li-top .li-time { min-width: 0; font-weight: 600; color: var(--text); }
.li-top .dl { margin-left: auto; }
.li-txt { font-size: 13.5px; color: var(--text-2); }
.li-click { cursor: pointer; border-radius: 10px; }
.li-click:hover { background: var(--hover); }
.pauta { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pauta li { display: flex; gap: 9px; align-items: flex-start; font-size: 14px; }
.pauta li > i { width: 6px; height: 6px; border-radius: 50%; background: var(--lilac); margin: 8px 4px 0 5px; flex-shrink: 0; }
.pauta li.ok .ic { color: var(--green); margin-top: 2px; }
.pauta li.no { color: var(--muted); }
.pauta li.no .ic { margin-top: 2px; }
.ata { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px; margin-top: 6px; }
.li-side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.cat-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; display: inline-block; }
.proj-mini { padding: 11px 0; border-bottom: 1px solid var(--line); }
.proj-mini:last-child { border-bottom: 0; }
.pm-h { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.pm-n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pm-b { display: flex; align-items: center; gap: 12px; margin: 8px 0 3px; }
.pm-b strong { font-family: var(--font-d); font-size: 14px; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
.pm-b.big .bar { height: 9px; }
.pm-f { display: flex; justify-content: space-between; gap: 8px; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.stat-row small { display: block; color: var(--muted); font-size: 12px; }
.stat-row strong { font-family: var(--font-d); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.goal { padding: 10px 0; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line); }
.goal:last-child { border-bottom: 0; }
.goal-h { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-weight: 560; }
.dash-foot { margin-top: 4px; }

/* ---------- Agenda ---------- */
.day-head { display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
.day-head h2 { font-size: 20px; margin-bottom: 4px; letter-spacing: -.02em; }
.day-prog { min-width: 320px; flex: 1; max-width: 560px; display: flex; flex-direction: column; gap: 6px; }
.day-prog .bar { height: 8px; flex: none; }
.day-counts { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; font-weight: 560; }
.timeline { display: flex; flex-direction: column; gap: 8px; }
.blk { position: relative; display: flex; align-items: stretch; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); min-height: 64px; transition: border-color .15s, background .15s; }
.blk::before { content: ""; position: absolute; left: -1px; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); }
.blk:hover { border-color: var(--border-strong); }
.blk-time { width: 86px; flex-shrink: 0; padding: 11px 14px; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.blk-time strong { font-family: var(--font-d); font-size: 16px; font-weight: 600; }
.blk-time span { color: var(--muted); font-size: 12.5px; }
.blk-time small { color: var(--muted); font-size: 11px; margin-top: auto; }
.blk-body { flex: 1; padding: 11px 14px 11px 4px; cursor: pointer; min-width: 0; }
.blk-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.blk-title { font-weight: 600; font-size: 14.5px; margin-right: 4px; }
.blk-meta { display: flex; gap: 5px; flex-wrap: wrap; }
.blk-notes { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); white-space: pre-wrap; }
.blk-actions { display: flex; align-items: center; gap: 4px; padding: 0 10px; }
.blk.st-concluida { background: transparent; }
.blk.st-concluida .blk-title { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
.blk.st-cancelada { opacity: .5; background: transparent; }
.blk.st-cancelada .blk-title { text-decoration: line-through; }
.blk.st-andamento { background: var(--blue-bg-soft); border-color: var(--blue-border); }
.blk.late { border-color: var(--red-border); background: var(--red-bg-soft); }
.blk.late::before { background: var(--red); }
.blk.now { border-color: var(--lilac); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lilac) 16%, transparent); }
.blk-break { min-height: 42px; background: repeating-linear-gradient(-45deg, transparent 0 7px, var(--line) 7px 8px); border-style: dashed; }
.blk-break::before { display: none; }
.blk-break .blk-time { flex-direction: row; gap: 6px; align-items: center; padding: 8px 14px; white-space: nowrap; }
.blk-break .blk-time strong { font-size: 13.5px; font-weight: 500; color: var(--muted); }
.blk-break .blk-time span::before { content: "– "; }
.blk-break .blk-body { display: flex; align-items: center; color: var(--muted); padding: 8px 14px 8px 4px; }
.blk-break .blk-title { font-weight: 500; font-size: 13.5px; }

/* ---------- Imprevistos ---------- */
.occ-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
.occ { position: relative; display: flex; flex-direction: column; gap: 10px; }
.occ::before { content: ""; position: absolute; left: -1px; top: 16px; width: 3px; height: 24px; border-radius: 0 3px 3px 0; background: var(--gray); }
.occ.prio-border-urgente::before { background: var(--red); } .occ.prio-border-alta::before { background: var(--yellow); } .occ.prio-border-media::before { background: var(--accent); }
.occ.late { background: var(--red-bg-soft); border-color: var(--red-border); }
.occ.closed { opacity: .7; }
.occ.closed::before { background: var(--green); }
.occ-h { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.occ-h h3 { font-size: 16px; }
.occ-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); align-items: center; }
.occ-meta span { display: inline-flex; align-items: center; gap: 5px; }
.occ-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; margin-top: auto; }
.sched { color: var(--blue-text); display: flex; align-items: center; gap: 5px; }

/* ---------- Planejamento semanal / mensal ---------- */
.plan-intro { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; color: var(--text-2); max-width: 820px; }
.plan-intro p { margin: 0; flex: 1 1 420px; font-size: 14px; }
.wk-summary { display: flex; align-items: center; gap: 20px; }
.wk-summary h3 { margin-bottom: 3px; }
.wk-summary .bar { margin-top: 10px; }
.wk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.wk-col { display: flex; flex-direction: column; gap: 8px; }
.wk-col.is-today { border-color: var(--blue-border); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
.wk-col.is-empty, .cycle.is-empty { background: transparent; border-style: dashed; box-shadow: none; }
.wk-col.is-today.is-empty { border-color: var(--blue-border); }
.wk-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
.wk-h small { color: var(--muted); font-size: 12px; font-weight: 500; }
.wk-h h3 { font-size: 17px; margin-top: 3px; }
.wk-h h3 .muted { font-family: var(--font); font-size: 14px; font-weight: 500; letter-spacing: 0; }
.wk-col .bar { flex: none; }
.wk-foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }
.checklist { list-style: none; padding: 0; margin: 2px 0; display: flex; flex-direction: column; gap: 1px; }
.checklist:empty { display: none; }
.checklist li { display: flex; align-items: flex-start; gap: 4px; justify-content: space-between; }
.checklist li .icon-btn { opacity: 0; }
.checklist li:hover .icon-btn, .checklist li .icon-btn:focus-visible { opacity: 1; }
label.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 5px 0; font-size: 13.5px; }
label.check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
label.check input:checked + span { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
label.check.radio input:checked + span, .cfg-form label.check input:checked + span, .form-grid label.check input:checked + span { text-decoration: none; color: inherit; }
.add-item { align-self: flex-start; margin-left: -8px; color: var(--link); }
.cycles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.cycle { position: relative; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
.cycle::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--cc); }
.cycle .bar { flex: none; }
.cycle.is-empty::after { opacity: .5; left: 14px; right: 14px; border-radius: 0 0 3px 3px; }
.cycle.is-current { border-color: color-mix(in srgb, var(--cc) 55%, var(--border)); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-wd { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 0 6px; }
.cal-cell { position: relative; min-height: 98px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); padding: 6px 7px 6px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; overflow: hidden; transition: border-color .15s, background .15s; }
.cal-cell::before { content: ""; position: absolute; left: 8px; right: 8px; top: 0; height: 2px; border-radius: 0 0 2px 2px; background: var(--cc, transparent); opacity: .85; }
.cal-cell:hover { border-color: var(--border-strong); }
.cal-cell.off { background: var(--surface-2); }
.cal-cell.out { opacity: .35; }
.cal-cell.out::before { display: none; }
.cal-cell.today { border-color: var(--lilac); }
.cal-cell.today .cal-n { background: var(--primary); color: #fff; }
.cal-n { font-family: var(--font-d); font-weight: 600; font-size: 13.5px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.cal-ag { position: absolute; top: 9px; right: 8px; font-size: 10.5px; color: var(--muted); font-weight: 600; }
.cal-items { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cal-it { font-size: 11px; padding: 1px 6px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid; background: var(--hover); }
.cal-it.done { opacity: .55; text-decoration: line-through; }
.cal-it.late { background: var(--red-bg); }
.cal-more { font-size: 11px; color: var(--muted); }
.cal-dots { display: none; gap: 3px; }
.cal-dots i { width: 6px; height: 6px; border-radius: 50%; }
.t-evento { border-color: var(--t-evento) !important; } i.t-evento, .legend i.t-evento, .cal-it-dot.t-evento { background: var(--t-evento); }
.t-tarefa { border-color: var(--t-tarefa) !important; } i.t-tarefa, .legend i.t-tarefa, .cal-it-dot.t-tarefa { background: var(--t-tarefa); }
.t-projeto { border-color: var(--t-projeto) !important; } i.t-projeto, .legend i.t-projeto, .cal-it-dot.t-projeto { background: var(--t-projeto); }
.t-imprevisto { border-color: var(--t-imprevisto) !important; } i.t-imprevisto, .legend i.t-imprevisto, .cal-it-dot.t-imprevisto { background: var(--t-imprevisto); }
.cal-dots i.late { box-shadow: 0 0 0 1.5px var(--red-border); }
.cal-it-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }

/* ---------- Tarefas ---------- */
.stat-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.stat-chip { display: flex; flex-direction: column; align-items: flex-start; padding: 7px 14px 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; min-width: 92px; transition: border-color .15s, background .15s, transform .12s; }
.stat-chip:hover { border-color: var(--border-strong); }
.stat-chip:active { transform: scale(.97); }
.stat-chip strong { font-family: var(--font-d); font-size: 20px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat-chip span { font-size: 11.5px; color: var(--muted); }
.stat-chip.active { border-color: var(--accent); background: var(--blue-bg); }
.stat-chip.active span { color: var(--blue-text); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px; }
.filters input[type=search] { flex: 1; min-width: 220px; }
.task-list { display: flex; flex-direction: column; gap: 8px; }
.task { position: relative; display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; transition: border-color .15s, background .15s; }
.task::before { content: ""; position: absolute; left: -1px; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); }
.task:hover { border-color: var(--border-strong); }
.task.dl-row-late { border-color: var(--red-border); background: var(--red-bg-soft); }
.task.dl-row-late::before { background: var(--red); }
.task.dl-row-today, .task.dl-row-soon { border-color: var(--yellow-border); }
.task.concluida { background: transparent; }
.task.concluida .tk-title { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
.task.cancelada { opacity: .55; }
.tk-check input { display: none; }
.tk-check span { display: block; width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--border-strong); cursor: pointer; position: relative; transition: background .15s, border-color .15s, transform .12s; }
.tk-check span:hover { border-color: var(--accent); }
.tk-check:active span { transform: scale(.88); }
.tk-check input:checked + span { background: var(--accent); border-color: var(--accent); }
.tk-check input:checked + span::after { content: ""; position: absolute; left: 6.5px; top: 2.5px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.tk-body { flex: 1; min-width: 0; cursor: pointer; }
.tk-title { font-weight: 600; }
.tk-desc { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tk-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 6px; font-size: 12.5px; }
.tk-side { display: flex; align-items: center; gap: 4px; }
.status-sel { min-height: 32px; padding: 4px 8px; border-radius: 9px; border: 1px solid color-mix(in srgb, var(--c) 30%, var(--mix-base)); background: color-mix(in srgb, var(--c) 12%, var(--mix-base)); font-size: 12.5px; font-weight: 600; color: color-mix(in srgb, var(--c) 72%, var(--mix-ink)); cursor: pointer; }

/* ---------- Projetos ---------- */
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.kb-col { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 200px; transition: background .15s, border-color .15s; }
.kb-col.over { background: var(--blue-bg); border-color: var(--blue-border); }
.kb-h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; padding: 4px 6px; }
.kb-n { margin-left: auto; background: var(--overlay); border-radius: 99px; padding: 0 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
.kb-items { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.kb-empty { border: 1.5px dashed var(--border-strong); border-radius: 12px; padding: 18px; text-align: center; font-size: 12px; color: var(--muted); }
.pj-card { background: var(--surface); border-radius: 12px; padding: 12px 14px; border: 1px solid var(--border); cursor: pointer; display: flex; flex-direction: column; gap: 5px; transition: border-color .15s, transform .15s; }
.pj-card:hover { border-color: var(--lilac); }

.pj-name { font-weight: 600; }

.pj-meta span { display: inline-flex; align-items: center; gap: 4px; }
.pj-info { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 14px; padding: 14px; background: var(--surface-2); border-radius: 12px; }
.pj-info small { display: block; color: var(--muted); font-size: 11.5px; }
.pj-info select { padding: 5px 8px; border: 1px solid var(--input-border); border-radius: 8px; margin-top: 3px; background: var(--surface); }
.inline-add { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.inline-add input:not([type=color]) { flex: 1; min-width: 0; min-height: 36px; padding: 7px 11px; border: 1px solid var(--input-border); border-radius: 10px; background: var(--surface-2); }
.inline-add input[type=color] { width: 40px; height: 36px; border: 1px solid var(--input-border); border-radius: 10px; padding: 3px; background: var(--surface-2); }
.gantt { overflow-x: auto; }
.g-row { display: grid; grid-template-columns: 220px minmax(500px, 1fr); align-items: center; min-height: 46px; border-bottom: 1px solid var(--line); }
.g-head { min-height: 28px; }
.g-name { font-weight: 600; font-size: 13px; padding-right: 10px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-name small { display: block; color: var(--muted); font-weight: 500; font-size: 11.5px; }
.g-track { position: relative; height: 100%; min-height: 28px; }
.g-month { position: absolute; top: 4px; font-size: 11px; color: var(--muted); border-left: 1px solid var(--border); padding-left: 5px; height: 20px; }
.g-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--lilac); opacity: .8; }
.g-bar { position: absolute; top: 50%; transform: translateY(-50%); height: 18px; border-radius: 6px; background: color-mix(in srgb, var(--c) 22%, var(--mix-base)); border: 1px solid color-mix(in srgb, var(--c) 45%, var(--mix-base)); overflow: hidden; cursor: pointer; }
.g-bar span { display: block; height: 100%; background: var(--c); }
.g-bar.late { border: 2px solid var(--red); }

/* ---------- Indicadores / gráficos / tabelas ---------- */
.chart-ctrl { display: flex; gap: 6px; flex-wrap: wrap; }
.chart-scroll { overflow-x: auto; }
.chart-scroll .chart { min-width: 420px; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); }
.chart .axis { font-size: 12px; fill: var(--muted); font-family: var(--font); }
.chart .val { font-size: 11px; fill: var(--text-2); font-weight: 600; font-family: var(--font); }
.chart .nodata { fill: var(--track); }
.chart-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 140px; color: var(--muted); border: 1px dashed var(--border-strong); border-radius: 12px; font-size: 13px; }
.hbars { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }

.hb-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-track { background: var(--track); height: 10px; border-radius: 99px; overflow: hidden; }

.hb-v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.table td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:hover td { background: var(--hover); }

/* ---------- Configurações ---------- */
.cfg-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.cfg-nav a { padding: 6px 13px; background: transparent; border: 1px solid var(--border); border-radius: 99px; font-size: 13px; font-weight: 550; color: var(--text-2); transition: border-color .15s, color .15s; }
.cfg-nav a:hover { border-color: var(--accent); color: var(--link); }
.cfg { scroll-margin-top: 80px; }
.cfg .card-h h3 { font-size: 17px; }
.cfg-list { display: flex; flex-direction: column; gap: 6px; max-width: 520px; }
.cfg-item { display: flex; gap: 8px; align-items: center; }
.cfg-item input[type=text] { flex: 1; min-width: 0; min-height: 36px; padding: 7px 11px; border: 1px solid var(--input-border); border-radius: 10px; background: var(--surface-2); }
.cfg-item input[type=color] { width: 40px; height: 36px; border: 1px solid var(--input-border); border-radius: 10px; padding: 3px; background: var(--surface-2); cursor: pointer; }
.row-actions { display: flex; gap: 8px; margin-top: 12px; }
.row-actions.wrap { flex-wrap: wrap; }
.cfg-form { max-width: 720px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); max-width: 560px; cursor: pointer; }
.switch-row span { display: flex; flex-direction: column; gap: 3px; }
.switch-row small { color: var(--muted); font-size: 12.5px; }
.switch { appearance: none; -webkit-appearance: none; flex-shrink: 0; width: 44px; height: 26px; border-radius: 99px; background: var(--border-strong); position: relative; cursor: pointer; transition: background .2s; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .22s var(--ease); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(18px); }
.switch-row.first { margin-top: 0; padding-top: 0; border-top: 0; }
.lem-antes { max-width: 260px; margin-top: 16px; }
.lem-status { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; max-width: 560px; }
.lem-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: 13.5px; background: var(--surface-2); border: 1px solid var(--line); flex-wrap: wrap; }
.lem-row > span { flex: 1 1 180px; }

.ia-key { margin-top: 14px; max-width: 560px; }

.ia-key + .ia-help, .ia-help { margin-top: 12px; max-width: 560px; font-size: 13.5px; }
.ia-help summary { cursor: pointer; color: var(--link); font-weight: 560; }
.ia-help .steps { margin-top: 8px; font-size: 13.5px; }
.lem-row + .ia-key { margin-top: 14px; }
.ia-box { margin-top: 10px; padding: 14px; border-radius: 14px; border: 1px solid var(--blue-border); background: var(--blue-bg-soft); display: flex; flex-direction: column; gap: 8px; }
.ia-h { display: flex; align-items: center; gap: 8px; font-family: var(--font-d); font-size: 15px; }
.ia-h .ic { color: var(--accent); }
.ia-box p { margin: 0; }
.ia-box textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--input-border); border-radius: 11px; background: var(--surface); resize: vertical; min-height: 64px; }
.ia-box textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); outline: none; }
.ia-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rec-on { background: var(--red-bg); border-color: var(--red-border); color: var(--red-text); }
.rec-on .ic { animation: recPulse 1.2s ease-in-out infinite; }
@keyframes recPulse { 50% { opacity: .35; } }
.rec-st { font-variant-numeric: tabular-nums; }
.ia-msg { padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.ia-msg.ok { color: var(--green-text); background: var(--green-bg); border-color: var(--green-border); }
.ia-msg.err { color: var(--red-text); background: var(--red-bg); border-color: var(--red-border); }
.ia-msg .spinner, .btn .spinner { width: 14px; height: 14px; border-width: 2px; border-top-color: #fff; }
.ia-keyrow { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px dashed var(--blue-border); }
.ia-keyrow label { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.ia-keyrow .inline-add { margin-top: 0; }
.rec-btn { min-height: 42px; }
.rec-btn.rec-on { background: var(--red); border-color: transparent; color: #fff; }

.rec-st { font-family: var(--font-d); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--red-text); }
.live { border-radius: 12px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; }
.live-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; flex-wrap: wrap; }
.live-h small { margin-left: auto; font-size: 11.5px; }
.rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }

.live-txt { max-height: 220px; min-height: 64px; overflow-y: auto; padding: 10px 12px; font-size: 13.5px; white-space: pre-wrap; line-height: 1.55; }
.tx { margin-top: 10px; }
.ia-agent { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); max-width: 640px; display: flex; flex-direction: column; gap: 6px; }

.pauta-ia { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 12px; border: 1px solid var(--blue-border); background: var(--blue-bg-soft); }

/* Reuniões */
.plan-intro-p { margin: 0; color: var(--text-2); font-size: 14px; flex: 1 1 260px; }
.mt-sec { display: flex; flex-direction: column; gap: 10px; }
.mt-h { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.mt-list { display: flex; flex-direction: column; gap: 8px; }
.mt-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--border); background: var(--surface); cursor: pointer; color: var(--text); transition: border-color .15s, transform .12s; }
.mt-card:hover { border-color: var(--lilac); }

    const map = { '#64748b': '#8e87a3', '#7c3aed': '#b08cf5', '#0284c7': '#7b3fe4', '#475569': '#6f6a82', '#d97706': '#e3a043', '#cbd5e1': '#4b4559', '#2563eb': '#6c8ef0',
      '#0d9488': '#3fb5a8', '#4f46e5': '#c77deb', '#dc2626': '#ee5a6f', '#65a30d': '#86bf6a', '#94a3b8': '#8e87a3', '#16a34a': '#3dbe8b', '#6b7280': '#615b70' };
    const st = s.settings || {};
    (st.categories || []).forEach(c => { if (map[c.color]) c.color = map[c.color]; });
    const dp = this.defaults().settings;
    for (const grp of ['priorities', 'statuses']) for (const [k, v] of Object.entries(st[grp] || {})) if (v && map[v.color] && dp[grp][k]) v.color = dp[grp][k].color;
    if (st.theme === 'claro') st.theme = 'escuro';   // o novo visual nasce escuro; o claro continua disponível
  },

  /* touch = alteração feita aqui (marca o horário e envia ao Google Drive). Dados vindos de fora usam touch: false. */
  save({ cloud = true, touch = true } = {}) {
    this.rev++;
    if (touch && this.state) { this.state.meta = this.state.meta || {}; this.state.meta.updatedAt = Date.now(); }
    if (this.persistent) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state)); this.lastSaved = new Date(); }
      catch (e) { this.persistent = false; }
    }
    if (cloud) Cloud.schedule();
    if (typeof Reminders !== 'undefined') Reminders.schedule();
    if (touch && typeof Drive !== 'undefined') Drive.schedule();
    if (touch && typeof Fire !== 'undefined') Fire.schedule();
    if (Native.available()) Native.persist();
    if (!this.persistent && Cloud.state !== 'on' && Cloud.state !== 'connecting' && !this.warned) {
      this.warned = true;
      UI.toast('Não foi possível salvar os dados neste navegador.', 'error');
    }
  },
  /* Há onde guardar os dados de forma duradoura? */
  isPersistent() { return Cloud.state === 'on' || (this.persistent && !Cloud.available()); },

  replace(newState, { fromCloud = false, fromDrive = false } = {}) {
    this.state = this.migrate(newState);
    S = this.state;
    if (typeof Jogo !== 'undefined') Jogo.last = null;   // dados vindos de fora não geram o aviso de "+XP"
    this.save({ cloud: !fromCloud, touch: !fromCloud && !fromDrive });
  },

  /* ---------- Dados de demonstração (sempre marcados com demo: true) ---------- */
  hasDemo() {
    return ['tasks', 'projects', 'occurrences', 'events', 'indicators'].some(k => S[k].some(x => x.demo)) || S.settings.technicians.some(t => t.demo);
  },
  loadDemo() {
    if (this.hasDemo()) return false;
    const t = U.today(), now = new Date().toISOString();
    const tk = (title, category, priority, status, due, extra = {}) => ({ id: U.uid(), demo: true, title: '[Exemplo] ' + title, description: 'Registro de demonstração — pode ser removido em Configurações.', category, priority, status, createdAt: now, startDate: t, dueDate: due, dueTime: '', notes: '', completedAt: status === 'concluida' ? now : null, ...extra });
    S.tasks.push(
      tk('Revisar pendências da semana', 'pendencias', 'alta', 'pendente', U.addDays(t, 1)),
      tk('Conferir estoque de materiais', 'administrativo', 'media', 'andamento', U.addDays(t, 4)),
      tk('Enviar relatório semanal', 'indicadores', 'urgente', 'pendente', U.addDays(t, -1)),
      tk('Agendar treinamento da equipe', 'equipe', 'baixa', 'concluida', U.addDays(t, -2)),
    );
    const t1 = { id: U.uid(), demo: true, name: 'Colaborador Exemplo A' }, t2 = { id: U.uid(), demo: true, name: 'Colaborador Exemplo B' };
    S.settings.technicians.push(t1, t2);
    const st = names => names.map((n, i) => ({ id: U.uid(), name: n, done: i < 2 }));
    S.projects.push(
      { id: U.uid(), demo: true, name: '[Exemplo] Implantação no cliente', client: 'Cliente Exemplo', description: 'Projeto de demonstração.', responsible: t1.name, startDate: U.addDays(t, -20), dueDate: U.addDays(t, 15), status: 'andamento', manualProgress: null, notes: '', stages: st(['Vistoria técnica', 'Projeto e orçamento', 'Instalação de câmeras', 'Configuração do NVR', 'Entrega e treinamento']), pendencias: [{ id: U.uid(), text: 'Aguardando liberação de acesso ao telhado', done: false }], createdAt: now, completedAt: null },
      { id: U.uid(), demo: true, name: '[Exemplo] Melhoria de processo interno', client: 'Empreendimento Exemplo', description: 'Projeto de demonstração.', responsible: t2.name, startDate: U.addDays(t, 3), dueDate: U.addDays(t, 40), status: 'planejamento', manualProgress: 0, notes: '', stages: [], pendencias: [], createdAt: now, completedAt: null },
    );
    S.occurrences.push({ id: U.uid(), demo: true, title: '[Exemplo] Sistema fora do ar no cliente', description: 'Ocorrência de demonstração.', priority: 'urgente', date: t, time: '09:40', dueDate: t, dueTime: '17:00', responsible: t1.name, status: 'pendente', notes: '', scheduled: null, createdAt: now });
    S.events.push({ id: U.uid(), demo: true, title: '[Exemplo] Reunião com cliente', date: U.addDays(t, 2), time: '10:00', notes: '' });
    // Lançamentos de indicadores de exemplo nos últimos 10 dias úteis
    let k = t, n = 0, seed = 7;
    const rnd = (a, b) => { seed = (seed * 9301 + 49297) % 233280; return a + Math.floor((seed / 233280) * (b - a + 1)); };
    while (n < 10) {
      k = U.addDays(k, -1);
      if (!D.isWorkday(k)) continue;
      n++;
      for (const tec of [t1, t2]) {
        S.indicators.push({ id: U.uid(), demo: true, date: k, technician: tec.name, notes: '', values: { pontosCamera: rnd(0, 8), manutencoes: rnd(0, 3), retrabalhos: rnd(0, 1) } });
      }
    }
    S.settings.goals.push({ id: U.uid(), demo: true, name: '[Exemplo] Serviços concluídos na semana', metric: 'pontosCamera', period: 'semanal', target: 30, direction: 'min' });
    return true;
  },
  removeDemo() {
    for (const k of ['tasks', 'projects', 'occurrences', 'events', 'indicators']) S[k] = S[k].filter(x => !x.demo);
    S.settings.technicians = S.settings.technicians.filter(x => !x.demo);
    S.settings.goals = S.settings.goals.filter(x => !x.demo);
    for (const k of Object.keys(S.days)) S.days[k] = S.days[k].filter(b => !b.demo);
  },
};
let S = null;

/* ---------- Regras de domínio ---------- */
const D = {
  cat(id) { return S.settings.categories.find(c => c.id === id) || { id: '', name: 'Sem categoria', color: '#8e87a3' }; },
  prio(p) { return S.settings.priorities[p] || { label: '—', color: '#8e87a3' }; },
  status(s) { return S.settings.statuses[s] || { label: '—', color: '#8e87a3' }; },
  techNames() { return S.settings.technicians.map(t => t.name); },

  isWorkday(k) { return S.settings.workDays.includes(U.weekday(k)); },
  nextWorkday(k) { let n = U.addDays(k, 1); for (let i = 0; i < 14 && !D.isWorkday(n); i++) n = U.addDays(n, 1); return n; },

  routineFor(k) {
    if (!D.isWorkday(k)) return [];
    const wd = U.weekday(k), dom = U.parse(k).getDate();
    const fixedBreak = (S.settings.breakMode || 'fixo') === 'fixo';
    return S.routine
      .filter(r => fixedBreak || r.category !== 'intervalo')   // intervalo flexível: marcado na hora pela Agenda
      .filter(r => r.freq === 'mensal' ? Number(r.monthDay) === dom : (r.days || []).includes(wd))
      .map(r => ({ id: r.id, routineId: r.id, start: r.start, end: r.end, title: r.title, category: r.category, priority: r.priority, notes: r.notes || '', fixed: !!r.fixed, status: 'pendente' }));
  },
  sortBlocks(arr) { return [...arr].sort((a, b) => U.toMin(a.start) - U.toMin(b.start) || U.toMin(a.end) - U.toMin(b.end)); },
  dayBlocks(k) { return D.sortBlocks(S.days[k] || D.routineFor(k)); },
  ensureDay(k) { if (!S.days[k]) S.days[k] = D.routineFor(k).map(b => ({ ...b })); return S.days[k]; },
  findBlock(k, id) { return D.ensureDay(k).find(b => b.id === id); },

  /* Intervalo: não conta no progresso nem como atraso. "Horário fixo" só impede o deslocamento automático. */
  isBreak(b) { return b.category === 'intervalo'; },
  blockDone(b) { return b.status === 'concluida' || b.status === 'cancelada'; },
  blockLate(b, k) {
    if (D.isBreak(b) || D.blockDone(b)) return false;
    const t = U.today();
    if (k < t) return true;
    return k === t && U.toMin(b.end) <= U.nowMin();
  },
  blockNow(b, k) { const n = U.nowMin(); return k === U.today() && U.toMin(b.start) <= n && U.toMin(b.end) > n; },
  conflicts(blocks) {
    const ids = new Set();
    for (let i = 0; i < blocks.length; i++) for (let j = i + 1; j < blocks.length; j++) {
      const a = blocks[i], b = blocks[j];
      if (a.status === 'cancelada' || b.status === 'cancelada') continue;
      if (U.toMin(a.start) < U.toMin(b.end) && U.toMin(b.start) < U.toMin(a.end)) { ids.add(a.id); ids.add(b.id); }
    }
    return ids;
  },
  progress(k) {
    const bl = D.dayBlocks(k).filter(b => !D.isBreak(b) && b.status !== 'cancelada');
    const done = bl.filter(b => b.status === 'concluida').length;
    return { done, total: bl.length, pct: bl.length ? Math.round(done / bl.length * 100) : null };
  },
  /* Desloca as atividades posteriores à âncora para que não fiquem sobrepostas.
     Atividades de horário fixo (ex.: intervalo) e concluídas não são movidas. */
  reflow(k, anchorId) {
    const blocks = D.sortBlocks(D.ensureDay(k));
    const anchor = blocks.find(b => b.id === anchorId);
    if (!anchor) return 0;
    const fixed = blocks.filter(b => b.fixed && b.id !== anchorId && b.status !== 'cancelada');
    let cursor = U.toMin(anchor.end);
    let moved = 0;
    for (const b of blocks) {
      if (b === anchor || b.fixed || D.blockDone(b)) continue;
      if (U.toMin(b.start) < U.toMin(anchor.start)) continue;
      const dur = U.toMin(b.end) - U.toMin(b.start);
      let s = Math.max(U.toMin(b.start), cursor);
      for (let guard = 0; guard < 20; guard++) {
        const hit = fixed.find(f => s < U.toMin(f.end) && s + dur > U.toMin(f.start));
        if (!hit) break;
        s = U.toMin(hit.end);
      }
      if (s !== U.toMin(b.start)) moved++;
      b.start = U.fromMin(s); b.end = U.fromMin(Math.min(1439, s + dur));
      cursor = s + dur;
    }
    return moved;
  },
  overflowCount(k) { const end = U.toMin(S.settings.workEnd); return D.dayBlocks(k).filter(b => !D.blockDone(b) && U.toMin(b.end) > end).length; },
  moveBlock(fromK, id, toK, start) {
    const src = D.ensureDay(fromK);
    const i = src.findIndex(b => b.id === id);
    if (i < 0) return null;
    const [b] = src.splice(i, 1);
    const dur = U.toMin(b.end) - U.toMin(b.start);
    const nb = { ...b, id: U.uid(), routineId: null, status: b.status === 'andamento' ? 'pendente' : b.status, notes: [b.notes, `Remanejada de ${U.fmtShort(fromK)} ${b.start}`].filter(Boolean).join(' · ') };
    if (start) { nb.start = start; nb.end = U.fromMin(U.toMin(start) + dur); }
    D.ensureDay(toK).push(nb);
    if (b.occurrenceId) { const o = S.occurrences.find(x => x.id === b.occurrenceId); if (o) o.scheduled = { date: toK, blockId: nb.id }; }
    return nb;
  },

  /* Prazos: retorna nível de alerta (late | today | soon | ok) */
  deadline(date, time, done) {
    if (!date || done) return null;
    const d = U.diffDays(U.today(), date);
    if (d < 0) return { level: 'late', label: `Atrasada há ${U.plural(-d, 'dia')}` };
    if (d === 0) return (time && U.toMin(time) <= U.nowMin()) ? { level: 'late', label: 'Atrasada (hoje)' } : { level: 'today', label: time ? `Vence hoje, ${time}` : 'Vence hoje' };
    if (d <= Number(S.settings.alertDays || 0)) return { level: 'soon', label: `Vence em ${U.plural(d, 'dia')}` };
    return { level: 'ok', label: `Prazo ${U.fmtShort(date)}` };
  },
  taskLate(t) { const i = D.deadline(t.dueDate, t.dueTime, !OPEN(t.status)); return !!i && i.level === 'late'; },
  occLate(o) { const i = D.deadline(o.dueDate, o.dueTime, !OPEN(o.status)); return !!i && i.level === 'late'; },

  projectProgress(p) {
    if (p.stages && p.stages.length) return Math.round(p.stages.filter(s => s.done).length / p.stages.length * 100);
    return U.clamp(Number(p.manualProgress) || 0, 0, 100);
  },
  projectLate(p) { return p.dueDate && p.dueDate < U.today() && !['concluido', 'cancelado'].includes(p.status); },

  /* ---------- Indicadores ---------- */
  records(from, to) { return S.indicators.filter(r => r.date >= from && r.date <= to); },
  metricValue(metric, from, to, filterFn) {
    const meta = METRICS.find(m => m.key === metric);
    if (metric === 'tarefasConcluidas') return S.tasks.filter(t => t.status === 'concluida' && t.completedAt && t.completedAt.slice(0, 10) >= from && t.completedAt.slice(0, 10) <= to).length;
    if (metric === 'projetosConcluidos') return S.projects.filter(p => p.status === 'concluido' && p.completedAt && p.completedAt.slice(0, 10) >= from && p.completedAt.slice(0, 10) <= to).length;
    let recs = D.records(from, to).filter(r => r.values && r.values[metric] !== null && r.values[metric] !== undefined && r.values[metric] !== '');
    if (filterFn) recs = recs.filter(filterFn);
    if (!recs.length) return null;
    if (meta && meta.snapshot) {
      const last = recs.reduce((m, r) => r.date > m ? r.date : m, '');
      return recs.filter(r => r.date === last).reduce((s, r) => s + Number(r.values[metric]), 0);
    }
    return recs.reduce((s, r) => s + Number(r.values[metric]), 0);
  },
  lastDateWith(metric, from, to) {
    const recs = D.records(from, to).filter(r => r.values && r.values[metric] !== null && r.values[metric] !== undefined);
    return recs.reduce((m, r) => r.date > m ? r.date : m, '') || null;
  },
  goalRange(goal, ref = U.today()) {
    if (goal.period === 'mensal') { const mk = U.monthKey(ref); return [U.monthStart(mk), U.monthEnd(mk)]; }
    if (goal.period === 'diaria') return [ref, ref];
    const ws = U.weekStart(ref); return [ws, U.addDays(ws, 6)];
  },
  goalStatus(goal, ref) {
    const [from, to] = D.goalRange(goal, ref);
    const val = D.metricValue(goal.metric, from, to);
    const target = Number(goal.target) || 0;
    if (val === null) return { val: null, target, pct: null, achieved: null, from, to };
    const achieved = goal.direction === 'max' ? val <= target : val >= target;
    const pct = goal.direction === 'max' ? (val <= target ? 100 : Math.round(target / val * 100)) : (target ? Math.min(100, Math.round(val / target * 100)) : 100);
    return { val, target, pct, achieved, from, to };
  },
};

</script>
  <script>/* js/ui.js */
'use strict';
/* Componentes de interface: modal, formulário, confirmação, toast, chips */
const UI = (() => {
  const root = () => document.getElementById('modal-root');
  const stack = [];

  function modal({ title, body = '', footer = '', wide = false, onMount, onClose, canClose }) {
    const el = document.createElement('div');
    el.className = 'modal-wrap';
    el.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${U.esc(title)}">
      <div class="modal-head"><h2>${U.esc(title)}</h2><button class="icon-btn" data-close aria-label="Fechar">${U.icon('x')}</button></div>
      <div class="modal-body"></div>
      <div class="modal-foot"></div></div>`;
    const api = {
      el,
      setBody(html) { el.querySelector('.modal-body').innerHTML = html; },
      setFooter(html) { const f = el.querySelector('.modal-foot'); f.innerHTML = html; f.style.display = html ? '' : 'none'; },
      /* Fechamento pedido pelo usuário (fora, X, Esc, voltar, Cancelar): pode ser barrado */
      tryClose() { if (canClose && !canClose()) return; api.close(); },
      close() {
        const i = stack.indexOf(api); if (i >= 0) stack.splice(i, 1);
        el.classList.remove('open'); setTimeout(() => el.remove(), 150);
        if (onClose) onClose();
      },
    };
    api.setBody(body); api.setFooter(footer);
    el.addEventListener('mousedown', e => { if (e.target === el) api.tryClose(); });
    el.querySelector('[data-close]').addEventListener('click', () => api.tryClose());
    root().appendChild(el);
    stack.push(api);
    requestAnimationFrame(() => el.classList.add('open'));
    if (onMount) onMount(api);
    const first = el.querySelector('input:not([type=hidden]):not([type=checkbox]):not([type=radio]), textarea, select');
    if (first && window.matchMedia('(min-width: 900px)').matches) setTimeout(() => first.focus(), 60);
    return api;
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length) stack[stack.length - 1].tryClose(); });

  function opts(options, value) {
    return options.map(o => {
      const [v, l] = Array.isArray(o) ? o : [o.value, o.label];
      return `<option value="${U.esc(v)}" ${String(v) === String(value ?? '') ? 'selected' : ''}>${U.esc(l)}</option>`;
    }).join('');
  }

  function fieldHtml(f) {
    const id = 'f_' + f.name;
    const req = f.required ? 'required' : '';
    const full = f.half ? '' : 'full';
    const hint = f.hint ? `<small class="hint">${f.hint}</small>` : '';
    const v = f.value ?? '';
    const si = f.showIf ? `data-showif="${f.showIf}"` : '';
    let input;
    switch (f.type) {
      case 'html': return `<div class="field ${full}">${f.html}</div>`;
      case 'textarea': input = `<textarea id="${id}" name="${f.name}" rows="${f.rows || 3}" ${req} placeholder="${U.esc(f.placeholder || '')}">${U.esc(v)}</textarea>`; break;
      case 'select': input = `<select id="${id}" name="${f.name}" ${req}>${opts(f.options, v)}</select>`; break;
      case 'checkbox': return `<div class="field ${full}" ${si}><label class="check"><input type="checkbox" name="${f.name}" ${v ? 'checked' : ''}> <span>${f.label}</span></label>${hint}</div>`;
      case 'radio': return `<div class="field ${full}" ${si}><span class="lbl">${f.label}</span>${f.options.map(([ov, ol]) => `<label class="check radio"><input type="radio" name="${f.name}" value="${U.esc(ov)}" ${ov === v ? 'checked' : ''}> <span>${ol}</span></label>`).join('')}${hint}</div>`;
      case 'weekdays': return `<div class="field ${full}" ${si}><span class="lbl">${f.label}</span><div class="wd-pick">${[1, 2, 3, 4, 5, 6, 0].map(d => `<label><input type="checkbox" name="${f.name}" value="${d}" ${(v || []).includes(d) ? 'checked' : ''}><span>${U.WD_SHORT[d]}</span></label>`).join('')}</div>${hint}</div>`;
      default: input = `<input id="${id}" type="${f.type || 'text'}" name="${f.name}" value="${U.esc(v)}" ${req} ${f.min !== undefined ? `min="${f.min}"` : ''} ${f.max !== undefined ? `max="${f.max}"` : ''} ${f.step ? `step="${f.step}"` : ''} placeholder="${U.esc(f.placeholder || '')}" ${f.list ? `list="dl_${f.name}" autocomplete="off"` : ''}>${f.list ? `<datalist id="dl_${f.name}">${f.list.map(x => `<option value="${U.esc(x)}">`).join('')}</datalist>` : ''}`;
    }
    return `<div class="field ${full}" ${si}><label for="${id}">${f.label}${f.required ? ' <em>*</em>' : ''}</label>${input}${hint}</div>`;
  }

  function readForm(form, fields) {
    const out = {};
    for (const f of fields) {
      if (!f.name || f.type === 'html') continue;
      if (f.type === 'checkbox') out[f.name] = form.elements[f.name].checked;
      else if (f.type === 'weekdays') out[f.name] = [...form.querySelectorAll(`input[name="${f.name}"]:checked`)].map(i => Number(i.value));
      else if (f.type === 'radio') { const c = form.querySelector(`input[name="${f.name}"]:checked`); out[f.name] = c ? c.value : null; }
      else if (f.type === 'number') { const raw = form.elements[f.name].value.trim(); out[f.name] = raw === '' ? null : Number(raw); }
      else out[f.name] = form.elements[f.name].value.trim();
    }
    return out;
  }

  /* Formulário genérico. onSubmit(values) pode retornar uma string de erro para manter o modal aberto. */
  function form({ title, fields, submitLabel = 'Salvar', onSubmit, validate, wide, extra = [], onChange, onClose, canClose }) {
    const m = modal({
      title, wide, onClose, canClose,
      body: `<form class="form-grid" novalidate>${fields.map(fieldHtml).join('')}<div class="form-error full" hidden></div><button type="submit" hidden></button></form>`,
      footer: `${extra.map((b, i) => `<button type="button" class="btn ${b.cls || 'ghost'}" data-extra="${i}">${b.label}</button>`).join('')}<span class="grow"></span><button type="button" class="btn ghost" data-cancel>Cancelar</button><button type="button" class="btn primary" data-submit>${submitLabel}</button>`,
    });
    const f = m.el.querySelector('form');
    const err = m.el.querySelector('.form-error');
    const applyShowIf = () => {
      m.el.querySelectorAll('[data-showif]').forEach(el => {
        const [name, val] = el.dataset.showif.split('=');
        const vals = readForm(f, fields);
        el.style.display = String(vals[name]) === val ? '' : 'none';
      });
    };
    applyShowIf();
    f.addEventListener('change', () => { applyShowIf(); if (onChange) onChange(readForm(f, fields), f); });
    const submit = () => {
      err.hidden = true;
      if (!f.checkValidity()) { f.reportValidity(); return; }
      const vals = readForm(f, fields);
      const msg = (validate && validate(vals)) || onSubmit(vals, m);
      if (typeof msg === 'string') { err.textContent = msg; err.hidden = false; return; }
      m.close();
    };
    f.addEventListener('submit', e => { e.preventDefault(); submit(); });
    m.el.querySelector('[data-submit]').addEventListener('click', submit);
    m.el.querySelector('[data-cancel]').addEventListener('click', () => m.tryClose());
    m.el.querySelectorAll('[data-extra]').forEach(b => b.addEventListener('click', () => extra[Number(b.dataset.extra)].onClick(readForm(f, fields), m)));
    return m;
  }

  function confirm(message, onYes, { okLabel = 'Confirmar', danger = false, title = 'Confirmação' } = {}) {
    const m = modal({
      title, body: `<p class="confirm-msg">${message}</p>`,

  <script>/* js/cloud.js */
'use strict';
/* Sincronização com a conta Claude quando o app é aberto como link (artifact).
   Os dados ficam em data/users/<id>/ — área privada de cada pessoa.
   Fora do claude.ai (arquivo local ou servidor próprio) este módulo fica inativo e vale o LocalStorage. */
const Cloud = {
  state: 'off',        // off | connecting | on | error
  db: null, uid: null, downloads: null,
  last: {},            // chave -> JSON salvo na nuvem
  timer: null, flushing: false, again: false, warned: false,

  available() { return !!(window.claude && typeof window.claude.use === 'function'); },

  /* Divide o estado em documentos (limite de 256 KiB por documento) */
  split(s) {
    const parts = {
      core: { version: s.version, meta: s.meta || {}, settings: s.settings, routine: s.routine, weekly: s.weekly, monthly: s.monthly, missoes: s.missoes || [] },
      tasks: { items: s.tasks }, projects: { items: s.projects }, occurrences: { items: s.occurrences }, events: { items: s.events }, feedbacks: { items: s.feedbacks || [] },
    };
    for (const [k, blocks] of Object.entries(s.days)) { const id = 'days-' + k.slice(0, 7); (parts[id] = parts[id] || { days: {} }).days[k] = blocks; }
    for (const r of s.indicators) { const id = 'ind-' + r.date.slice(0, 7); (parts[id] = parts[id] || { items: [] }).items.push(r); }
    return parts;
  },
  join(docs) {
    const core = docs.core || {};
    const s = { version: core.version || 1, meta: core.meta || {}, settings: core.settings, routine: core.routine, weekly: core.weekly, monthly: core.monthly, missoes: core.missoes || [], days: {}, indicators: [],
      tasks: docs.tasks?.items || [], projects: docs.projects?.items || [], occurrences: docs.occurrences?.items || [], events: docs.events?.items || [], feedbacks: docs.feedbacks?.items || [] };
    for (const [id, d] of Object.entries(docs)) {
      if (id.startsWith('days-')) Object.assign(s.days, d.days || {});
      if (id.startsWith('ind-')) s.indicators.push(...(d.items || []));
    }
    for (const k of Object.keys(s)) if (s[k] === undefined) delete s[k];
    return s;
  },

  async init() {
    if (!this.available()) return;
    this.state = 'connecting';
    const timeout = new Promise(res => setTimeout(() => res('timeout'), 12000));
    try {
      const [db, user, downloads] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]);
      this.downloads = downloads || null;
      const uid = user ? await user.id() : null;
      if (!db || !uid) { this.state = 'off'; return; }
      this.db = db; this.uid = uid;
      const snap = await Promise.race([db.collection('data/users/' + uid).get(), timeout]);
      if (snap === 'timeout') throw new Error('timeout');
      const docs = {};
      snap.docs.forEach(d => { if (d.exists) docs[d.id] = d.data(); });
      this.state = 'on';
      if (!docs.core) { await this.flush(); return; }          // primeira vez: envia o estado atual
      for (const [id, d] of Object.entries(docs)) this.last[id] = JSON.stringify(d);
      Store.replace(this.join(docs), { fromCloud: true });
    } catch (e) {
      console.warn('Sincronização indisponível', e);
      this.state = 'error';
    }
  },

  /* Ao voltar para a aba, busca a versão mais recente (ex.: editada no celular) */
  async pull() {
    if (this.state !== 'on' || this.timer || this.flushing) return;
    try {
      const snap = await this.db.collection('data/users/' + this.uid).get();
      const docs = {}; snap.docs.forEach(d => { if (d.exists) docs[d.id] = d.data(); });
      if (!docs.core) return;
      const changed = Object.keys(docs).some(id => JSON.stringify(docs[id]) !== this.last[id]) || Object.keys(this.last).some(id => !docs[id]);
      if (!changed) return;
      this.last = {}; for (const [id, d] of Object.entries(docs)) this.last[id] = JSON.stringify(d);
      Store.replace(this.join(docs), { fromCloud: true });
      if (!document.querySelector('.modal-wrap')) App.render();
    } catch (e) { /* mantém os dados atuais */ }
  },

  schedule() {
    if (this.state !== 'on') return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => { this.timer = null; this.flush(); }, 700);
  },

  async flush() {
    if (this.flushing) { this.again = true; return; }
    this.flushing = true;
    try {
      const parts = this.split(S);
      const col = this.db.collection('data/users/' + this.uid);
      for (const [id, body] of Object.entries(parts)) {
        const json = JSON.stringify(body);
        if (this.last[id] === json) continue;
        await this.write(() => col.doc(id).set(body));
        this.last[id] = json;
      }
      for (const id of Object.keys(this.last)) if (!parts[id]) { await this.write(() => col.doc(id).delete()); delete this.last[id]; }
      if (this.state !== 'on') { this.state = 'on'; App.renderNav(); }
    } catch (e) {
      console.warn('Falha ao salvar', e);
      if (!this.warned) { this.warned = true; UI.toast(e && e.code === 'quota_exceeded' ? 'Limite de armazenamento atingido. Exporte um backup e remova dados antigos.' : 'Não foi possível salvar na sua conta agora. Tentaremos de novo na próxima alteração.', 'error'); }
      setTimeout(() => { this.warned = false; }, 60000);
    } finally {
      this.flushing = false;
      if (this.again) { this.again = false; this.flush(); }
    }
  },
  async write(fn) {
    try { await fn(); } catch (e) {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); await fn(); } else throw e;
    }
  },

  /* Entrega de arquivos (Excel, backup, relatório) pela confirmação de download da plataforma */
  async save(filename, blob) {
    if (!this.downloads) return false;
    try { await this.downloads.save({ filename, data: blob }); }
    catch (e) { if (e && e.code !== 'declined') UI.toast('Não foi possível baixar o arquivo neste aplicativo.', 'error'); }
    return true;
  },
};

'use strict';
/* Transferência de dados entre versões (APK, web):
   - arquivo de backup (.json), aceito sem filtro de tipo (Android costuma não reconhecer .json);
   - "código de transferência": o backup comprimido (gzip) em texto, para copiar e colar
     por WhatsApp, e-mail, Keep etc., sem depender de arquivos. */
const Transfer = {
  PREFIX_GZ: 'GR1:',   // gzip + base64
  PREFIX_RAW: 'GR0:',  // base64 sem compressão (navegadores antigos)

  b64FromBytes(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  },
  bytesFromB64(b64) {
    const s = atob(b64); const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  },

  async encode(state) {
    const json = JSON.stringify(state);
    if (typeof CompressionStream === 'function') {
      const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
      const buf = new Uint8Array(await new Response(stream).arrayBuffer());
      return this.PREFIX_GZ + this.b64FromBytes(buf);
    }
    return this.PREFIX_RAW + this.b64FromBytes(new TextEncoder().encode(json));
  },

  /* Aceita: código GR1/GR0, ou o JSON do arquivo de backup. Retorna o estado ou lança erro com mensagem amigável. */
  async decode(text) {
    let t = String(text || '').trim();
    if (!t) throw new Error('Nada foi colado.');
    let json;
    const at = t.search(/GR[01]:/);
    if (at >= 0) {
      t = t.slice(at).replace(/\s+/g, '');
      const kind = t.slice(0, 4), b64 = t.slice(4);
      let bytes;
      try { bytes = this.bytesFromB64(b64); } catch (e) { throw new Error('O código está incompleto ou foi alterado. Copie-o inteiro de novo.'); }
      if (kind === this.PREFIX_GZ) {
        if (typeof DecompressionStream !== 'function') throw new Error('Este navegador é antigo demais para ler o código. Use o arquivo de backup.');
        try {
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
          json = await new Response(stream).text();
        } catch (e) { throw new Error('O código está incompleto ou foi alterado. Copie-o inteiro de novo.'); }
      } else json = new TextDecoder().decode(bytes);
    } else {
      json = t.replace(/^﻿/, '');
    }
    let data;
    try { data = JSON.parse(json); } catch (e) { throw new Error('Não é um backup deste aplicativo (conteúdo inválido).'); }
    if (!data || !data.settings || !Array.isArray(data.tasks)) throw new Error('Não é um backup deste aplicativo.');
    return data;
  },

  summary(d) {
    const n = (a) => Array.isArray(a) ? a.length : 0;
    return `${U.plural(n(d.tasks), 'tarefa')}, ${U.plural(n(d.projects), 'projeto')}, ${U.plural(n(d.occurrences), 'imprevisto')}, ${U.plural(n(d.indicators), 'lançamento')} de indicadores e ${U.plural(Object.keys(d.days || {}).length, 'dia')} de agenda`;
  },

  confirmImport(data) {
    UI.confirm(`Importar estes dados?<br><br><strong>${U.esc(this.summary(data))}</strong>.<br><br>Os dados atuais <strong>desta versão</strong> serão substituídos. Se quiser, exporte um backup antes.`, () => {
      Store.replace(data);
      App.render();
      UI.toast('Dados importados.');
    }, { okLabel: 'Importar' });
  },

  async copyText(text) {
    try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; } } catch (e) { /* tenta o método alternativo */ }
