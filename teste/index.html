      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  },

  /* Janela "Enviar meus dados": gera o código, copia e oferece compartilhar */
  async openExport() {
    let code;
    try { code = await this.encode(S); } catch (e) { UI.toast('Não foi possível gerar o código: ' + U.esc(e.message), 'error'); return; }
    const kb = Math.max(1, Math.round(code.length / 1024));
    const canShare = Native.available() || (typeof navigator.share === 'function' && !Cloud.available());
    const big = code.length > 60000;
    const m = UI.modal({
      title: 'Levar meus dados para outra versão',
      body: `
        <ol class="steps">
          <li>Toque em <strong>Copiar código</strong>${canShare ? ' ou <strong>Enviar código</strong>' : ''}.</li>
          <li>Mande o código para você mesmo, por exemplo pelo WhatsApp (conversa “Você”), e-mail ou Google Keep.</li>
          <li>Na outra versão (site ou outro celular), abra <strong>Configurações → Dados → Receber dados</strong>, cole o código e confirme.</li>
        </ol>
        <p class="muted small">Contém ${U.esc(this.summary(S))} · ${kb} KB.${big ? ' <strong>O código é grande:</strong> se o WhatsApp cortar a mensagem, use e-mail ou o arquivo de backup.' : ''}</p>

      footer: `${canShare ? `<button class="btn" data-share>${U.icon('arrow', 15)} Enviar código</button>` : ''}<span class="grow"></span><button class="btn primary" data-copy>${U.icon('check', 15)} Copiar código</button>`,
    });
    const box = m.el.querySelector('.code-box');
    box.addEventListener('focus', () => box.select());
    m.el.querySelector('[data-copy]').onclick = async () => {
      if (await this.copyText(code)) UI.toast('Código copiado. Cole na outra versão em Configurações → Dados → Receber dados.');
      else { box.focus(); box.select(); UI.toast('Não foi possível copiar sozinho: o texto está selecionado. Use “Copiar” do teclado.', 'warn'); }
    };
    const sh = m.el.querySelector('[data-share]');
    if (sh) sh.onclick = async () => {
      try {
        if (Native.available()) await Native.P().Share.share({ title: 'Dados do FlowFire', text: code, dialogTitle: 'Enviar código de transferência' });
        else await navigator.share({ title: 'Dados do FlowFire', text: code });
      } catch (e) { if (!/cancel|abort/i.test(String(e && (e.message || e.name)))) UI.toast('Não foi possível enviar: ' + U.esc(e.message || e), 'error'); }
    };
  },

  /* Janela "Receber dados": colar código (ou o conteúdo do backup) ou escolher o arquivo */
  openImport() {
    const m = UI.modal({
      title: 'Receber dados de outra versão',
      body: `
        <p>Cole aqui o <strong>código de transferência</strong> gerado na outra versão (começa com <code>GR1:</code>).</p>
        <textarea class="code-box" rows="5" placeholder="Cole o código aqui…" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
        <div class="form-error" hidden></div>
        <p class="muted small mt">Ou, se você tem o <strong>arquivo de backup</strong> (.json):</p>
        <label class="btn">${U.icon('upload', 15)} Escolher arquivo de backup<input type="file" data-file hidden></label>`,
      footer: `<span class="grow"></span><button class="btn ghost" data-cancel>Cancelar</button><button class="btn primary" data-go>Continuar</button>`,
    });
    const err = m.el.querySelector('.form-error');
    const fail = (msg) => { err.textContent = msg; err.hidden = false; };
    const go = async (text) => {
      err.hidden = true;
      try { const data = await this.decode(text); m.close(); this.confirmImport(data); }
      catch (e) { fail(e.message); }
    };
    m.el.querySelector('[data-cancel]').onclick = () => m.close();
    m.el.querySelector('[data-go]').onclick = () => go(m.el.querySelector('.code-box').value);
    m.el.querySelector('[data-file]').addEventListener('change', async (e) => {
      const f = e.target.files[0]; e.target.value = '';
      if (!f) return;
      try { await go(await f.text()); } catch (ex) { fail('Não foi possível ler o arquivo: ' + ex.message); }
    });
  },
};

'use strict';
/* Lembretes: avisos de prazos de tarefas e imprevistos, compromissos e resumo do dia.
   App Android: notificações locais (tocam com o app fechado), com botão "Feito"/"Ciente".
   Navegador: avisos enquanto o site estiver aberto (em qualquer aba).
   Os avisos são recalculados a cada alteração dos dados: nada fica "preso" no aparelho. */
const Reminders = {
  REPEAT_MIN: 30,     // repetição enquanto não marcar Feito
  REPEATS: 4,         // até 2 h depois do prazo
  MAX: 60,            // o Android limita alarmes: agenda os 60 mais próximos (o resto entra quando o app abrir)
  DAYS: 14,
  timer: null,
  webTimer: null,
  webLast: 0,

  cfg() { return S.settings.lembretes; },
  on() { return !!(this.cfg() && this.cfg().on); },
  LN() { return Native.available() ? Native.P().LocalNotifications : null; },
  webSupported() { return !Native.available() && !Cloud.available() && 'Notification' in window; },

  at(date, time) { const [y, m, d] = date.split('-').map(Number); const [h, mi] = (time || '00:00').split(':').map(Number); return new Date(y, m - 1, d, h, mi).getTime(); },
  key(kind, x, date, time) { return `${kind}:${x.id}:${date}:${time || ''}`; },
  ciente(k) { return !!(S.meta && S.meta.ciente && S.meta.ciente[k]); },

  /* Lista de avisos futuros (puro: fácil de testar) */
  list(now = Date.now()) {
    const c = this.cfg(); if (!c) return [];
    const antes = Number(c.antes) || 0, until = now + this.DAYS * 86400000, out = [];
    const push = a => { if (a.when > now && a.when <= until) out.push(a); };
    const fmtAntes = antes === 0 ? 'agora' : antes < 60 ? `em ${antes} min` : `em ${antes / 60} h`;
    const prazo = (kind, x, title, date, time) => {
      const base = this.at(date, time), k = this.key(kind, x, date, time);
      if (this.ciente(k)) return;
      const lbl = kind === 'tarefa' ? 'Tarefa' : 'Imprevisto';
      push({ k, kind, id: x.id, when: base - antes * 60000, title: `${lbl} vence ${fmtAntes}`, body: `${x.title} · prazo às ${time}`, type: kind === 'tarefa' ? 'TAREFA' : 'AVISO' });
      if (c.repetir) for (let i = 1; i <= this.REPEATS; i++) push({ k, kind, id: x.id, when: base + i * this.REPEAT_MIN * 60000, title: `${lbl} atrasada`, body: `${x.title} · venceu às ${time}`, type: kind === 'tarefa' ? 'TAREFA' : 'AVISO' });
    };
    S.tasks.filter(x => OPEN(x.status) && x.dueDate && x.dueTime).forEach(x => prazo('tarefa', x, x.title, x.dueDate, x.dueTime));
    S.occurrences.filter(o => OPEN(o.status) && o.dueDate && o.dueTime).forEach(o => prazo('imprevisto', o, o.title, o.dueDate, o.dueTime));
    S.events.filter(e => e.date && e.time).forEach(e => {
      const k = this.key('evento', e, e.date, e.time);
      if (this.ciente(k)) return;
      const n = (e.pautas || []).length;
      push({ k, kind: 'evento', id: e.id, when: this.at(e.date, e.time) - antes * 60000, title: antes ? `Compromisso ${fmtAntes}` : 'Compromisso agora', body: `${e.title} · ${e.time}${n ? ` · ${U.plural(n, 'assunto')} na pauta` : ''}`, type: 'AVISO' });
    });
    // Resumo no início do expediente, nos dias úteis em que há algo marcado
    if (c.resumo) for (let i = 0; i < 7; i++) {
      const k = U.addDays(U.today(), i);
      if (!D.isWorkday(k)) continue;
      const tasks = S.tasks.filter(x => OPEN(x.status) && x.dueDate === k).length;
      const evs = S.events.filter(e => e.date === k).length;
      const occ = S.occurrences.filter(o => OPEN(o.status) && o.dueDate === k).length;
      const late = S.tasks.filter(x => OPEN(x.status) && x.dueDate && x.dueDate < k).length;
      const parts = [tasks && U.plural(tasks, 'prazo de tarefa', 'prazos de tarefa'), evs && U.plural(evs, 'compromisso'), occ && U.plural(occ, 'imprevisto') + ' com prazo', late && U.plural(late, 'tarefa atrasada', 'tarefas atrasadas')].filter(Boolean);
      if (parts.length) push({ k: 'resumo:' + k, kind: 'resumo', id: k, when: this.at(k, S.settings.workStart), title: 'Seu dia', body: parts.join(', ') + '.', type: '' });
    }
    return out.sort((a, b) => a.when - b.when).slice(0, this.MAX);
  },

  /* Chamado a cada gravação dos dados (com espera curta para juntar várias mudanças) */
  schedule() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.apply().catch(e => console.warn('lembretes', e)), 1200);
  },

  async apply() {
    const LN = this.LN();
    if (!LN) { this.webLoop(); return; }
    const pend = await LN.getPending();
    if (pend && pend.notifications && pend.notifications.length) await LN.cancel({ notifications: pend.notifications.map(n => ({ id: n.id })) });
    if (!this.on()) return;
    // Esquece marcações "Ciente" antigas (mais de 30 dias)
    const old = U.addDays(U.today(), -30);
    for (const k of Object.keys(S.meta.ciente || {})) if ((k.split(':')[2] || '') < old) delete S.meta.ciente[k];
    const perm = await LN.checkPermissions();
    if (perm.display !== 'granted') return;
    const list = this.list();
    if (!list.length) return;
    await LN.schedule({ notifications: list.map((a, i) => ({
      id: i + 1, title: a.title, body: a.body, channelId: 'lembretes', actionTypeId: a.type || undefined,
      schedule: { at: new Date(a.when), allowWhileIdle: true }, extra: { k: a.k, kind: a.kind, id: a.id },
      smallIcon: 'ic_stat_notify', iconColor: '#9461F5',
    })) });
  },

  /* App Android: canal, botões das notificações e o que fazer quando o usuário toca */
  async initNative() {
    const LN = this.LN(); if (!LN) return;
    try {
      await LN.createChannel({ id: 'lembretes', name: 'Lembretes', description: 'Prazos, compromissos e resumo do dia', importance: 5, visibility: 1, vibration: true });
      await LN.registerActionTypes({ types: [
        { id: 'TAREFA', actions: [{ id: 'feito', title: 'Feito' }, { id: 'ciente', title: 'Parar de avisar' }] },
        { id: 'AVISO', actions: [{ id: 'ciente', title: 'Ciente' }] },
      ] });
      LN.addListener('localNotificationActionPerformed', ev => this.onAction(ev.actionId, (ev.notification && ev.notification.extra) || {}));
    } catch (e) { console.warn('lembretes', e); }
    this.schedule();
  },

  onAction(actionId, x) {
    if (actionId === 'feito' && x.kind === 'tarefa') {
      const t = S.tasks.find(t => t.id === x.id);
      if (t && OPEN(t.status)) { t.status = 'concluida'; t.completedAt = new Date().toISOString(); commit(); UI.toast('Tarefa concluída pelo aviso.'); }
      return;
    }
    if (actionId === 'ciente' || actionId === 'feito') {
      S.meta.ciente = S.meta.ciente || {};
      S.meta.ciente[x.k] = true;
      commit();
      return;
    }
    // Toque no aviso: abre a tela relacionada
    const go = { tarefa: 'tarefas', imprevisto: 'imprevistos', resumo: 'dashboard' }[x.kind];
    if (go) App.go(go);
    else if (x.kind === 'evento') { const e = S.events.find(e => e.id === x.id); if (e) { App.go('mensal'); setTimeout(() => Events.view(e), 200); } }
  },

  /* Ligar: pede a permissão de notificações (Android 13+ ou navegador) */
  async enable() {
    const LN = this.LN();
    if (LN) {
      let p = await LN.checkPermissions();
      if (p.display !== 'granted') p = await LN.requestPermissions();
      if (p.display !== 'granted') { UI.toast('Sem permissão para notificações. Libere em Configurações do celular → Apps → FlowFire → Notificações.', 'warn'); return false; }
      return true;
    }
    if (!this.webSupported()) { UI.toast('Este navegador não permite avisos.', 'warn'); return false; }
    const r = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
    if (r !== 'granted') { UI.toast('O navegador bloqueou os avisos. Libere nas configurações do site.', 'warn'); return false; }
    return true;
  },

  async test() {
    const LN = this.LN();
    const title = 'Aviso de teste', body = 'Se você está vendo isto, os lembretes estão funcionando.';
    if (LN) { await LN.schedule({ notifications: [{ id: 999, title, body, channelId: 'lembretes', schedule: { at: new Date(Date.now() + 5000), allowWhileIdle: true }, smallIcon: 'ic_stat_notify', iconColor: '#9461F5', extra: { kind: 'teste' } }] }); return; }
    setTimeout(() => this.webShow({ title, body, kind: 'teste' }), 5000);
  },

  /* Navegador: confere a cada 30 s se algum aviso chegou na hora */
  webLoop() {
    clearInterval(this.webTimer);
    if (!this.on() || !this.webSupported() || Notification.permission !== 'granted') return;
    if (!this.webLast) this.webLast = Date.now();
    this.webTimer = setInterval(() => {
      const now = Date.now(), from = this.webLast;
      this.webLast = now;
      // list() só devolve avisos futuros; olha a janela desde a última conferência
      this.list(from).filter(a => a.when <= now).forEach(a => this.webShow(a));
    }, 30000);
  },
  async webShow(a) {
    const opts = { body: a.body, icon: 'icon.svg', tag: a.k || 'teste', data: { k: a.k, kind: a.kind, id: a.id } };
    try {
      const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
      if (reg) { await reg.showNotification(a.title, opts); return; }
    } catch (e) { /* sem service worker: usa o aviso simples */ }
    const n = new Notification(a.title, opts);
    n.onclick = () => { window.focus(); this.onAction('tap', opts.data); n.close(); };
  },
};

    let xiaomi = false;
    try { const s = await Sis.status(); xiaomi = /xiaomi|redmi|poco/.test(s.fabricante); rows.push([s.bateriaLiberada, 'Bateria sem restrição', 'Economia de bateria pode bloquear os avisos', 'lemOpen', 'Liberar', 'bateria']); } catch (e) { /* sem plugin */ }
    box.innerHTML = rows.map(([ok, yes, no, act, lbl, tela]) => `<div class="lem-row ${ok ? 'ok' : 'warn'}">${U.icon(ok ? 'check' : 'alert', 16)}<span>${ok ? yes : no}</span>${ok ? '' : `<button class="btn sm" data-act="${act}" ${tela ? `data-tela="${tela}"` : ''}>${lbl}</button>`}</div>`).join('')
      + (xiaomi ? `<div class="lem-row info">${U.icon('info', 16)}<span>Celular Xiaomi: ative a <strong>Inicialização automática</strong> do FlowFire, senão o sistema impede os avisos com o app fechado.</span><button class="btn sm" data-act="lemOpen" data-tela="autostart">Abrir</button></div>` : '');
  },
});

  REPO: 'paulojunior2303-maker/gestao-rotina',

  newer(a, b) { const pa = a.split('.').map(Number), pb = b.split('.').map(Number); for (let i = 0; i < Math.max(pa.length, pb.length); i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d > 0; } return false; },
  async check() {

      <a class="btn sm primary" href="${this.info.url}" target="_blank" rel="noopener">Baixar</a><button class="btn sm ghost" data-act="updLater">Depois</button></div>`;
  },
};

  <script>/* js/ia.js */
'use strict';
/* IA (Google Gemini) com a chave do próprio usuário (Configurações → IA).
   O app chama o Gemini direto, sem servidor. Nada é enviado sem o usuário tocar em "Preencher com IA". */
const IA = {
  // Ordem de tentativa: se um modelo estiver sobrecarregado (503/429) ou indisponível, tenta o próximo.
  MODELS: ['gemini-3.5-flash', 'gemini-3.8-flash', 'gemini-3.7-flash', 'gemini-3.1-flash-lite', 'gemini-3.5-flash-lite'],
  RETRY_PAUSE: 3000,   // se todos estiverem sobrecarregados, espera e tenta mais uma rodada
  URL: 'https://generativelanguage.googleapis.com/v1beta/models/',

  key() { return (S.settings.ia && S.settings.ia.key) || ''; },
  ready() { return !!this.key() && this.supported(); },
  supported() { return !Cloud.available(); },   // o link do Claude bloqueia chamadas a outros sites

  /* Chamada genérica. schema = JSON Schema da resposta (devolve o objeto já lido). */
  async call({ system, parts, schema, timeout = 60000, models }) {
    if (!this.key()) throw new Error('Cadastre a chave da IA em Configurações → IA.');
    const body = { contents: [{ role: 'user', parts }], ...(system ? { systemInstruction: { parts: [{ text: system }] } } : {}),
      generationConfig: { temperature: 0.2, ...(schema ? { responseMimeType: 'application/json', responseSchema: schema } : {}) } };
    let last = null;
    const list = models || this.MODELS;
    for (const m of [...list, null, ...list]) {
      if (m === null) { await new Promise(r => setTimeout(r, this.RETRY_PAUSE)); continue; }   // 2ª rodada
      const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), timeout);
      try {
        const r = await fetch(this.URL + m + ':generateContent', { method: 'POST', signal: ctrl.signal, headers: { 'Content-Type': 'application/json', 'x-goog-api-key': this.key() }, body: JSON.stringify(body) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
          last = new Error(this.explain(r.status, d));
          if ([400, 401, 403].includes(r.status)) throw last;   // chave errada: não adianta tentar outro modelo
          continue;
        }
        const text = ((d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts) || []).filter(p => !p.thought && p.text).map(p => p.text).join('').trim();
        if (!text) { last = new Error('A IA não devolveu resposta. Tente de novo.'); continue; }
        return schema ? JSON.parse(text) : text;
      } catch (e) {
        if (e.name === 'AbortError') { last = new Error('A IA demorou demais para responder. Tente de novo.'); continue; }
        if (e instanceof TypeError) { last = new Error('Sem conexão com a IA. Confira a internet.'); continue; }
        throw e;
      } finally { clearTimeout(tm); }
    }
    throw last || new Error('Não foi possível falar com a IA.');
  },
  explain(status, d) {
    const msg = (d && d.error && d.error.message) || '';
    if (status === 400 && /api key/i.test(msg)) return 'Chave da IA inválida. Confira em Configurações → IA.';
    if (status === 401 || status === 403) return 'A chave da IA foi recusada. Confira em Configurações → IA ou crie outra no AI Studio.';
    if (status === 429) return 'Limite de uso da IA atingido por agora. Tente daqui a alguns minutos.';
    if (status >= 500) return 'A IA está sobrecarregada no momento. Tente de novo em instantes.';
    return 'Erro da IA: ' + (msg || status);
  },

  /* Transcrição de um trecho de áudio (rápida: usa primeiro o modelo leve) */
  async transcribe(audio) {
    const t = await this.call({ models: ['gemini-3.1-flash-lite', 'gemini-3.5-flash-lite', 'gemini-3.5-flash'], timeout: 45000,
      system: 'Transcreva fielmente, em português do Brasil, o que é falado neste trecho de uma reunião de equipe. Não resuma, não comente e não invente. Quando outra pessoa começar a falar, comece uma nova linha com "— ". Se não houver fala compreensível, responda apenas com: [silêncio]',
      parts: [{ inlineData: { mimeType: audio.mime, data: audio.b64 } }, { text: 'Transcreva este trecho.' }] });
    return /^\[sil[eê]ncio\]$/i.test(t.trim()) ? '' : t.trim();
  },

  async test() { const t = await this.call({ parts: [{ text: 'Responda apenas: ok' }], timeout: 30000 }); return /ok/i.test(t); },

  /* Instruções do agente do usuário (Configurações → IA). Sem elas, um estilo padrão enxuto. */
  agent() { return ((S.settings.ia && S.settings.ia.agente) || '').trim(); },
  level() { return (S.settings.ia && S.settings.ia.nivel) || 'detalhada'; },
  LEVELS: { detalhada: 'ATA detalhada: registre os assuntos com contexto, problemas identificados, propostas, decisões e encaminhamentos', compacta: 'ATA compacta: mantenha apenas os principais assuntos, decisões e orientações', resumida: 'ATA resumida: apresente uma síntese geral da reunião, sem perder informações essenciais' },
  DEFAULT_AGENT: `Você é o assistente de documentação de um líder de equipe.
Escreva em português do Brasil, de forma profissional, natural e objetiva, direto ao ponto, sem burocracia e sem repetir informações.
Não invente fatos, participantes, decisões ou responsabilidades. Não transforme sugestões em decisões; o que ficou sem definição é pendência.
Elimine conversas paralelas. Preserve nomes, números, datas e prazos. Considere que transcrições automáticas podem ter erros e não complete trechos incompreensíveis com suposições.`,
  system(task) {
    return `${this.agent() || this.DEFAULT_AGENT}

=== Instruções do aplicativo FlowFire (seguir sempre, junto com as de cima) ===
${task}
Entregue texto simples, pronto para copiar: sem markdown (não use #, ** ou _). Numere os assuntos ("1. ", "2. ") e use "• " para os tópicos.`;
  },

  /* Ata da reunião (no padrão do agente) + o que o app precisa: pauta tratada e combinados */
  async ata(e, { notes = '', audio = null, transcript = '', nivel } = {}) {
    const pautas = e.pautas || [];
    const lvl = this.LEVELS[nivel || this.level()] || this.LEVELS.detalhada;
    const system = this.system(`Tarefa: /ata. Transforme a reunião abaixo em uma ATA organizada. Nível: ${lvl}.
Use a data e o título informados. Se o agente definir um cabeçalho (ex.: "ATA DE REUNIÃO — Equipe ..."), use-o.
Responda em JSON com:
- "ata": o documento completo da ata, pronto para usar, com quebras de linha (\\n): uma linha para cada campo do cabeçalho, uma linha em branco antes de cada assunto numerado e uma linha para cada tópico.
- "tratados": números (1, 2, 3…) dos itens da pauta que foram de fato discutidos (item adiado ou só citado não conta).
- "combinados": decisões confirmadas e compromissos assumidos, um por item, começando pelo responsável quando citado e com o prazo quando houver. Não inclua sugestões nem pendências.`);
    const parts = [];
    if (audio) parts.push({ inlineData: { mimeType: audio.mime, data: audio.b64 } });
    parts.push({ text: `Reunião: ${e.title}
Data: ${U.fmtDate(e.date)}${e.time ? ', ' + e.time : ''}
Pauta numerada:
${pautas.length ? pautas.map((p, i) => `${i + 1}. ${p.text}`).join('\n') : '(sem pauta)'}
${audio ? 'O áudio anexado é a gravação da reunião.' : ''}
${transcript.trim() ? `Transcrição da reunião (automática, pode ter erros; [mm:ss] = tempo):\n"""\n${transcript.trim()}\n"""` : ''}
${notes.trim() ? `Anotações do líder:\n"""\n${notes.trim()}\n"""` : ''}` });
    const r = await this.call({ system, parts, timeout: audio ? 180000 : 90000, schema: {
      type: 'OBJECT', required: ['ata', 'tratados', 'combinados'],
      properties: { ata: { type: 'STRING' }, tratados: { type: 'ARRAY', items: { type: 'INTEGER' } }, combinados: { type: 'ARRAY', items: { type: 'STRING' } } },
    } });
    return {
      tratadas: (r.tratados || []).map(n => pautas[n - 1]).filter(Boolean).map(p => p.id),
      combinados: (r.combinados || []).map(s => String(s).trim()).filter(Boolean),
      ata: this.tidy(String(r.ata || '')),
    };
  },
  /* Garante quebras de linha se a IA devolver o documento "corrido" */
  tidy(t) {
    t = t.replace(/\r/g, '').trim()
      // Seções finais sempre em linha própria, com uma linha em branco antes
      .replace(/[ \t]*\n?[ \t]*(Acordos|Próximos passos|Pendências|Encaminhamentos|Considerações finais):[ \t]*\n?/g, '\n\n$1:\n')
      .replace(/\n{3,}/g, '\n\n').trim();
    if (t.split('\n').length > 3) return t;
    return t.replace(/\s+(Data:|Assunto:|Participantes:|Local:)/g, '\n$1')
      .replace(/\s+(\d{1,2}\.\s+[A-ZÁÉÍÓÚÂÊÔÃÕÇ])/g, '\n\n$1')
      .replace(/\s+([•*]\s)/g, '\n$1')
      .replace(/\s+(Pendências|Encaminhamentos|Considerações finais|Próximos passos)(:?)\s/g, '\n\n$1$2\n')
      .trim();
  },

  /* Feedback individual (comando /feedback do agente) */
  TIPOS: { feedback: 'Feedback', orientacao: 'Orientação verbal', advertencia: 'Advertência formal' },
  TONS: { positivo: 'Positivo', neutro: 'Neutro', melhorar: 'A melhorar' },
  async feedback({ nome, tipo = 'feedback', tom = 'neutro', date, notes = '', transcript = '' }) {
    const extra = tipo === 'feedback' ? '' : `Este registro é uma ${this.TIPOS[tipo].toUpperCase()}. Registre: motivo, ocorrência identificada, orientação transmitida, posicionamento do colaborador, comportamento esperado e medidas para evitar reincidência. Não confunda orientação verbal com advertência formal.`;
    const system = this.system(`Tarefa: /feedback. Resuma a conversa individual da liderança com o colaborador ${nome}.
Tom do registro: ${this.TONS[tom] || 'Neutro'} (muda a tonalidade do texto, nunca os fatos).
${extra}
Use só o que estiver na transcrição e nas anotações; identifique o colaborador pelo nome informado e não misture com outras pessoas.
Responda em JSON com:
- "resumo": o texto do registro, pronto para usar (normalmente 2 ou 3 parágrafos, separados por uma linha em branco: \\n\\n). Diferencie o que o colaborador relatou do que a liderança observou ou orientou. Se houver vários encaminhamentos, termine com uma seção "Acordos:" numa linha própria, com um tópico "• " por linha.
- "acordos": compromissos assumidos e próximos passos confirmados, um por item, começando pelo responsável quando citado. Não inclua sugestões nem assuntos pendentes.`);
    const r = await this.call({ system, timeout: 90000, parts: [{ text: `Colaborador: ${nome}
Data: ${U.fmtDate(date || U.today())}
Tipo: ${this.TIPOS[tipo]}
${transcript.trim() ? `Transcrição da conversa (automática, pode ter erros; [mm:ss] = tempo):\n"""\n${transcript.trim()}\n"""` : ''}
${notes.trim() ? `Anotações da liderança:\n"""\n${notes.trim()}\n"""` : ''}` }],
      schema: { type: 'OBJECT', required: ['resumo', 'acordos'], properties: { resumo: { type: 'STRING' }, acordos: { type: 'ARRAY', items: { type: 'STRING' } } } } });
    return { resumo: this.tidy(String(r.resumo || '')), acordos: (r.acordos || []).map(s => String(s).trim()).filter(Boolean) };
  },

  /* Comandos rápidos do agente sobre um texto pronto */
  REWRITE: { natural: '/natural — Deixe o texto mais natural, fluido e menos formal, mantendo o profissionalismo.', compact: '/compact — Reduza o conteúdo ao essencial, preservando as informações importantes.', detalhado: '/detalhado — Aprofunde o conteúdo, mantendo todos os pontos relevantes da fonte.' },
  async rewrite(text, mode, source = '') {
    return this.tidy(await this.call({ system: this.system(`Tarefa: ${this.REWRITE[mode]}
Mantenha a mesma estrutura de documento (cabeçalho, assuntos numerados). Não acrescente fatos que não estejam no texto${source ? ' ou na transcrição de referência' : ''}.
Responda apenas com o documento reescrito.`), parts: [{ text: `Documento:\n"""\n${text}\n"""${source ? `\n\nTranscrição de referência (fonte, pode ter erros):\n"""\n${source.slice(0, 60000)}\n"""` : ''}` }], timeout: 90000 }));
  },

  /* Pauta de uma reunião futura, a partir do tema e das pendências de reuniões anteriores */
  async pauta({ title, tema, pendencias = [] }) {
    const r = await this.call({ system: this.system(`Tarefa: monte a PAUTA de uma reunião que ainda vai acontecer.
Responda em JSON com "itens": a lista de assuntos, em sequência lógica, cada um curto (até ~10 palavras), sem numeração.
Use apenas o que estiver no tema descrito e nas pendências informadas; não invente assuntos. Inclua as pendências que tiverem relação com a reunião.`),
      parts: [{ text: `Reunião: ${title || '(sem título)'}
O que o líder quer tratar:
"""
${tema}
"""
${pendencias.length ? `Pendências de reuniões anteriores:\n${pendencias.map(x => '- ' + x).join('\n')}` : ''}` }],
      schema: { type: 'OBJECT', required: ['itens'], properties: { itens: { type: 'ARRAY', items: { type: 'STRING' } } } }, timeout: 60000 });
    return (r.itens || []).map(x => String(x).replace(/^\s*[\d.)•\-–]+\s*/, '').trim()).filter(Boolean);
  },
};

/* Gravação da reunião com transcrição ao vivo.
   O áudio é gravado em trechos independentes (~40 s). Cada trecho vai para a IA assim que termina e o texto aparece
   na tela; trechos que falharem (sem internet, IA sobrecarregada) são tentados de novo ao encerrar.
   O áudio não fica guardado: só o texto. */
const Recorder = {
  MAX_MIN: 90, SEG_MS: 40000,
  stream: null, rec: null, running: false, started: 0, timer: null, segTimer: null,
  parts: [], queue: Promise.resolve(), pending: 0, onUpdate: null, mime: '',
  supported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) && !Cloud.available(); },
  recording() { return this.running; },
  elapsed() { return Math.floor((Date.now() - this.started) / 1000); },
  fmt(s) { return `${Math.floor(s / 60)}:${U.pad(s % 60)}`; },
  keepScreen(on) {   // tela acesa durante a gravação (app Android); falha em silêncio em versões sem o recurso
    try { const r = Native.available() && Native.P().Sistema && Native.P().Sistema.manterTela({ ligada: on }); if (r && r.catch) r.catch(() => {}); } catch (e) { /* ignorado */ }
  },

  /* onUpdate({ elapsed, text, pending, failed }) é chamado a cada segundo e a cada trecho transcrito */
  async start(onUpdate) {
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    this.mime = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/ogg;codecs=opus'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    this.parts = []; this.pending = 0; this.queue = Promise.resolve(); this.onUpdate = onUpdate;
    this.running = true; this.started = Date.now();
    this.segment();
    this.timer = setInterval(() => { this.emit(); if (this.elapsed() >= this.MAX_MIN * 60) this.stop(); }, 1000);
    this.keepScreen(true);
  },
  segment() {
    const idx = this.parts.length, at = this.elapsed();
    this.parts.push({ at, text: null, blob: null, failed: false });
    const chunks = [];
    const rec = this.rec = new MediaRecorder(this.stream, { ...(this.mime ? { mimeType: this.mime } : {}), audioBitsPerSecond: 24000 });
    rec.ondataavailable = ev => { if (ev.data.size) chunks.push(ev.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
      if (this.running) this.segment();   // emenda o próximo trecho na hora
      this.parts[idx].blob = blob;
      this.transcribe(idx);
      if (this.stopResolve && !this.running) { const r = this.stopResolve; this.stopResolve = null; r(); }
    };
    rec.start();
    this.segTimer = setTimeout(() => { if (rec.state === 'recording') rec.stop(); }, this.SEG_MS);
  },
  transcribe(idx) {
    const part = this.parts[idx];
    if (!part.blob || part.blob.size < 2000) { part.text = ''; this.emit(); return; }   // trecho vazio/curtíssimo
    this.pending++; this.emit();
    this.queue = this.queue.then(async () => {
      try {
        const b64 = await Native.blobToBase64(part.blob);
        part.text = await IA.transcribe({ mime: part.blob.type.split(';')[0], b64 });
        part.failed = false; part.blob = null;
      } catch (e) { part.failed = true; part.error = e.message; }
      this.pending--; this.emit();
    });
  },
  stop() {
    if (!this.running) return Promise.resolve();
    this.running = false;
    clearInterval(this.timer); clearTimeout(this.segTimer);
    this.keepScreen(false);
    return new Promise(res => {
      this.stopResolve = () => { this.stream.getTracks().forEach(t => t.stop()); this.emit(); res(); };
      if (this.rec && this.rec.state === 'recording') this.rec.stop(); else this.stopResolve();
    });
  },
  /* Espera os trechos em andamento e tenta de novo os que falharam */
  async finish() {
    await this.queue;
    this.parts.forEach((p, i) => { if (p.failed && p.blob) this.transcribe(i); });
    await this.queue;
  },
  failed() { return this.parts.filter(p => p.failed).length; },
  text() { return this.parts.filter(p => p.text).map(p => `[${this.fmt(p.at)}] ${p.text}`).join('\n'); },
  reset() { this.parts = []; this.onUpdate = null; },
  emit() { if (this.onUpdate) this.onUpdate({ elapsed: this.running ? this.elapsed() : null, text: this.text(), pending: this.pending, failed: this.failed() }); },
};

/* Peças de tela reaproveitáveis: chave da IA no próprio formulário e gravação com transcrição ao vivo */
const IAUI = {
  keyRow() {
    return IA.key() ? '' : `<div class="ia-keyrow"><label>Primeiro, cole a sua chave da IA (só uma vez ${Native.available() ? 'neste celular' : 'neste navegador'})</label>
      <div class="inline-add"><input name="iaKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Chave do AI Studio"><button type="button" class="btn sm primary" data-ia-save>Salvar chave</button></div></div>`;
  },
  recHtml() {
    return Recorder.supported() ? `<div class="ia-actions"><button type="button" class="btn primary rec-btn" data-rec>${U.icon('mic', 16)} Iniciar gravação</button><span class="rec-st small"></span></div>
      <div class="live" hidden><div class="live-h"><span class="rec-dot"></span><strong>Transcrição</strong><small class="live-st muted"></small></div><div class="live-txt" aria-live="polite"></div></div>` : '';
  },
  /* Liga os botões. Devolve { say, needKey }. onStop é chamado depois de encerrar e terminar a transcrição. */
  wire(el, { onStop }) {
    const f = el.querySelector('form'), msg = el.querySelector('.ia-msg');
    const say = (t, cls = '') => { if (!msg) return; msg.hidden = !t; msg.className = 'ia-msg small ' + cls; msg.innerHTML = t; };
    const needKey = () => { if (IA.key()) return false; say('Cole e salve a sua chave da IA no campo acima primeiro.', 'err'); if (f.elements.iaKey) f.elements.iaKey.focus(); return true; };
    const keySave = el.querySelector('[data-ia-save]');
    if (keySave) keySave.onclick = async () => {
      const k = f.elements.iaKey.value.trim();
      if (!k) { say('Cole a chave no campo acima.', 'err'); return; }
      S.settings.ia = { ...(S.settings.ia || {}), key: k }; commit();
      keySave.disabled = true; say('Testando a chave…');
      try { await IA.test(); el.querySelector('.ia-keyrow').remove(); say('Chave salva e funcionando.', 'ok'); }
      catch (err) { S.settings.ia.key = ''; commit(); keySave.disabled = false; say(U.esc(err.message), 'err'); }
    };
    const btnRec = el.querySelector('[data-rec]'), st = el.querySelector('.rec-st');
    const liveBox = el.querySelector('.live'), liveTxt = el.querySelector('.live-txt'), liveSt = el.querySelector('.live-st');
    const update = ({ elapsed, text, pending, failed }) => {
      if (elapsed !== null) st.textContent = Recorder.fmt(elapsed);
      liveBox.hidden = false;
      const atEnd = liveTxt.scrollTop + liveTxt.clientHeight >= liveTxt.scrollHeight - 30;
      liveTxt.textContent = text || (Recorder.recording() ? 'A transcrição aparece aqui a cada ~40 segundos.' : '');
      liveTxt.classList.toggle('muted', !text);
      if (atEnd) liveTxt.scrollTop = liveTxt.scrollHeight;
      liveSt.textContent = [pending ? `transcrevendo ${U.plural(pending, 'trecho')}…` : '', failed ? `${U.plural(failed, 'trecho')} sem transcrição (tenta de novo ao encerrar)` : ''].filter(Boolean).join(' · ');
    };
    if (btnRec) btnRec.onclick = async () => {
      if (Recorder.recording()) {
        btnRec.disabled = true;
        await Recorder.stop();
        btnRec.classList.remove('rec-on'); btnRec.innerHTML = `${U.icon('mic', 16)} Gravar mais`;
        say('Gravação encerrada. Terminando a transcrição…');
        await Recorder.finish();
        btnRec.disabled = false;
        if (Recorder.failed()) say(`${U.plural(Recorder.failed(), 'trecho não pôde', 'trechos não puderam')} ser transcritos. O restante será usado.`, 'err');
        if (onStop) await onStop();
        return;
      }
      if (needKey()) return;
      try {
        await Recorder.start(update);
        btnRec.classList.add('rec-on'); btnRec.innerHTML = `${U.icon('stop', 16)} Encerrar gravação`;
        say(`Gravando. Deixe o celular perto da conversa e ${Native.available() ? 'o app aberto (a tela fica acesa)' : 'esta aba aberta'}. Limite: ${Recorder.MAX_MIN} min.`);
      } catch (err) { say('Não foi possível usar o microfone. Permita o acesso ao microfone e tente de novo.', 'err'); }
    };
    return { say, needKey };
  },
  /* Botões Natural / Compactar / Detalhar / Copiar / Compartilhar sobre um campo de texto */
  toolsHtml() { return `<div class="ata-tools"><span class="muted small">Ajustar:</span><button type="button" class="btn sm" data-rw="natural">Natural</button><button type="button" class="btn sm" data-rw="compact">Compactar</button><button type="button" class="btn sm" data-rw="detalhado">Detalhar</button><button type="button" class="btn sm ghost" data-rw-copy>${U.icon('check', 14)} Copiar</button><button type="button" class="btn sm ghost" data-rw-share>${U.icon('upload', 14)} Compartilhar</button></div>`; },
  wireTools(el, field, title, { say, needKey, onChange = () => {}, source = () => '' }) {
    const f = el.querySelector('form');
    el.querySelectorAll('[data-rw]').forEach(b => b.onclick = async () => {
      const text = f.elements[field].value.trim();
      if (!text) { say('Gere ou escreva o texto primeiro.', 'err'); return; }
      if (needKey()) return;
      const lbl = b.innerHTML; el.querySelectorAll('[data-rw]').forEach(x => { x.disabled = true; });
      b.innerHTML = '<span class="spinner"></span>';
      try { f.elements[field].value = (await IA.rewrite(text, b.dataset.rw, source())).trim(); onChange(); UI.toast('Texto ajustado.'); }
      catch (err) { UI.toast(U.esc(err.message), 'error'); }
      b.innerHTML = lbl; el.querySelectorAll('[data-rw]').forEach(x => { x.disabled = false; });
    });
    const rc = el.querySelector('[data-rw-copy]'); if (rc) rc.onclick = () => { const t = f.elements[field].value.trim(); if (t) Events.copy(t); };
    const rs = el.querySelector('[data-rw-share]'); if (rs) rs.onclick = () => { const t = f.elements[field].value.trim(); if (t) Events.share(t, title()); };
  },
};

</script>
  <script>/* js/drive.js */
'use strict';
/* Sincronização com o Google Drive do usuário (app Android e site).
   Os dados ficam num arquivo na pasta "Gestão de Rotina" do Drive dele (permissão drive.file: o app só enxerga
   o que ele mesmo criou). Regra: vale a versão alterada por último (meta.updatedAt). Sincroniza ao abrir,
   ao voltar para o app e alguns segundos depois de cada alteração.
   Android: GooglePlugin.java (token sem perguntar nada depois da 1ª autorização).
   Site: Google Identity Services (o token dura ~1 h; depois o usuário toca em "Sincronizar"). */
const Drive = {
  WEB_CLIENT_ID: '108519751846-arnrsangld9cs837vk4u7vvp58c2gsdv.apps.googleusercontent.com',
  SCOPE: 'https://www.googleapis.com/auth/drive.file',
  FOLDER: 'Gestão de Rotina',
  FILE: 'gestao-rotina-dados.json',
  API: 'https://www.googleapis.com/drive/v3',
  UP: 'https://www.googleapis.com/upload/drive/v3',
  KEY: 'gr-drive',            // dados da conexão NESTE aparelho (não vão no arquivo)
  TOKEN_KEY: 'gr-drive-token',
  state: 'off',               // off | ok | syncing | needs-auth | error
  error: '',
  token: null, tokenExp: 0, busy: false, again: false, timer: null, lastAuto: 0,

  supported() { return !CANAL_TESTE && !Cloud.available() && (Native.available() || /^https?:/.test(location.protocol)); },
  info() { try { return JSON.parse(localStorage.getItem(this.KEY)) || {}; } catch (e) { return {}; } },
  setInfo(o) { try { localStorage.setItem(this.KEY, JSON.stringify({ ...this.info(), ...o })); } catch (e) { /* sem armazenamento */ } },
  connected() { return !!this.info().email; },
  device() { return Native.available() ? 'app Android' : 'navegador'; },
  hasData(st) { return !!st && ['tasks', 'projects', 'occurrences', 'events', 'indicators', 'feedbacks'].some(k => (st[k] || []).length) || !!(st && st.days && Object.keys(st.days).length) || !!(st && st.weekly && st.weekly.focus && st.weekly.focus.length); },

  /* ---------- Token ---------- */
  needsAuth() { const e = new Error('Toque em Sincronizar para reconectar o Google Drive.'); e.needsAuth = true; return e; },
  async getToken(interactive) {
    if (this.token && Date.now() < this.tokenExp - 60000) return this.token;
    if (Native.available()) {
      const G = Native.P().Google;
      if (!G) throw new Error('Atualize o app para usar o Google Drive.');
      try {
        const r = await G.autorizar({ escopos: [this.SCOPE], interativo: !!interactive });
        this.token = r.accessToken; this.tokenExp = Date.now() + 50 * 60000;
        return this.token;
      } catch (e) {
        if (/PRECISA_AUTORIZAR/.test(e.code || e.message)) throw this.needsAuth();
        if (/CANCELADO/.test(e.code || e.message)) throw new Error('Autorização cancelada.');
        throw new Error(e.message || 'Falha na autorização do Google.');
      }
    }
    // Site: token guardado na sessão do navegador (vale ~1 h)
    try { const t = JSON.parse(sessionStorage.getItem(this.TOKEN_KEY)); if (t && Date.now() < t.exp - 60000) { this.token = t.token; this.tokenExp = t.exp; return this.token; } } catch (e) { /* nada guardado */ }
    if (!interactive) throw this.needsAuth();
    await this.loadGIS();
    return new Promise((resolve, reject) => {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: this.WEB_CLIENT_ID, scope: this.SCOPE,
        callback: resp => {
          if (resp.error) { reject(new Error(resp.error === 'access_denied' ? 'Autorização negada.' : 'Google: ' + resp.error)); return; }
          this.token = resp.access_token; this.tokenExp = Date.now() + (Number(resp.expires_in) || 3600) * 1000;
          try { sessionStorage.setItem(this.TOKEN_KEY, JSON.stringify({ token: this.token, exp: this.tokenExp })); } catch (e) { /* ok */ }
          resolve(this.token);
        },
        error_callback: err => reject(new Error(err && err.type === 'popup_closed' ? 'A janela do Google foi fechada.' : 'Não foi possível abrir o login do Google (pop-up bloqueado?).')),
      });
      client.requestAccessToken({ prompt: this.connected() ? '' : 'consent', ...(this.info().email ? { login_hint: this.info().email } : {}) });
    });
  },
  loadGIS() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = () => res(); s.onerror = () => rej(new Error('Sem conexão com o Google.'));
      document.head.appendChild(s);
    });
  },

  /* ---------- API do Drive ---------- */
  async api(url, opts = {}, retry = true) {
    const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + this.token } });
    if (r.status === 401 && retry) {
      this.token = null; try { sessionStorage.removeItem(this.TOKEN_KEY); } catch (e) { /* ok */ }
      await this.getToken(false);
      return this.api(url, opts, false);
    }
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      const msg = (d.error && d.error.message) || r.status;
      if (r.status === 403 && /has not been used|disabled/i.test(msg)) throw new Error('A Google Drive API não está ativada no projeto do Google Cloud.');
      const e = new Error('Google Drive: ' + msg); e.status = r.status; throw e;
    }
    return r;
  },
  q(s) { return encodeURIComponent(s); },
  async findFolder() {
    const r = await this.api(`${this.API}/files?fields=files(id)&spaces=drive&q=${this.q(`name='${this.FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`)}`);
    const f = (await r.json()).files[0];
    if (f) return f.id;
    const c = await this.api(`${this.API}/files?fields=id`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: this.FOLDER, mimeType: 'application/vnd.google-apps.folder' }) });
    return (await c.json()).id;
  },
  async findFile(folderId) {
    const r = await this.api(`${this.API}/files?fields=files(id,appProperties)&spaces=drive&q=${this.q(`name='${this.FILE}' and '${folderId}' in parents and trashed=false`)}`);
    return (await r.json()).files[0] || null;
  },
  async ensureIds() {
    let { folderId, fileId } = this.info();
    if (!folderId) { folderId = await this.findFolder(); this.setInfo({ folderId }); }
    if (!fileId) { const f = await this.findFile(folderId); fileId = f ? f.id : null; this.setInfo({ fileId }); }

  },
  async meta(fileId) {
    const r = await this.api(`${this.API}/files/${fileId}?fields=id,trashed,appProperties`);
    return r.json();
  },
  async download(fileId) {
    const r = await this.api(`${this.API}/files/${fileId}?alt=media`);

        title: 'Já existem dados no Drive',
        body: `<p>Encontrei dados do app no seu Google Drive, salvos em <strong>${U.fmtDateTime(new Date(d.updatedAt).toISOString())}</strong> (${U.esc(d.device || 'outro aparelho')}). Este ${this.device()} também tem dados.</p>

        footer: `<button class="btn" data-local>Usar os deste ${this.device()}</button><span class="grow"></span><button class="btn primary" data-remote>Usar os do Drive</button>`,

  },

  /* Configurações → Google Drive */

      <p class="small">Conecte a sua conta Google para:</p>
      <ul class="steps small"><li>ter os mesmos dados no app e no site, sem precisar enviar códigos;</li><li>ter uma cópia de segurança automática no seu Drive.</li></ul>
      <div class="row-actions"><button class="btn primary" data-act="driveConnect">${U.icon('user', 15)} Conectar com o Google</button></div>

  },

Object.assign(Actions, {

  <script>/* js/fire.js */
'use strict';
/* Conta FlowFire na nuvem (Firebase): login com Google e sincronização ao vivo entre aparelhos.
   - Os dados são divididos em documentos (como no Cloud): core, tarefas, … e meses (agenda, reuniões, feedbacks, indicadores).
     Cada documento guarda o JSON como texto (evita limitações de tipo do Firestore; limite de 1 MiB por documento).
   - Caminho: canais/{oficial|teste}/usuarios/{uid}/docs/{id}. As regras do Firestore só deixam cada pessoa ler e gravar os próprios.
   - Local primeiro: o app continua salvando no aparelho; as mudanças sobem em seguida e as dos outros aparelhos chegam ao vivo.
   - A biblioteca do Firebase só é baixada quando a pessoa usa a conta (o app continua leve e funcionando sem internet). */
const Fire = {
  CONFIG: {
    apiKey: 'AIzaSyCr7IwC5WiNDaWVNm1CQGViNUAZh7jVcnM',
    authDomain: 'gestao-de-rotina-514301.firebaseapp.com',
    projectId: 'gestao-de-rotina-514301',
    storageBucket: 'gestao-de-rotina-514301.firebasestorage.app',
    messagingSenderId: '108519751846',
    appId: '1:108519751846:web:3258158c1fdf04254fb467',
  },

  SCOPES: ['openid', 'email', 'profile'],
  KEY: 'flowfire-conta' + (typeof CANAL_TESTE !== 'undefined' && CANAL_TESTE ? ':teste' : ''),   // lembra que a pessoa usa a conta neste aparelho
  state: 'off',      // off | loading | on | syncing | error
  user: null, api: null, last: {}, timer: null, unsub: null, msg: '',
  dev: (() => { try { let d = localStorage.getItem('ff-dev'); if (!d) { d = Math.random().toString(36).slice(2, 10); localStorage.setItem('ff-dev', d); } return d; } catch (e) { return 'x'; } })(),

  supported() { return typeof Cloud === 'undefined' || !Cloud.available(); },
  canal() { return typeof CANAL_TESTE !== 'undefined' && CANAL_TESTE ? 'teste' : 'oficial'; },
  wanted() { try { return localStorage.getItem(this.KEY) === '1'; } catch (e) { return false; } },
  setWanted(v) { try { v ? localStorage.setItem(this.KEY, '1') : localStorage.removeItem(this.KEY); } catch (e) { /* sem armazenamento */ } },
  connected() { return !!this.user; },

  /* ---------- Documentos ---------- */
  split(s) {
    const parts = {
      core: { version: s.version, meta: s.meta || {}, settings: s.settings, routine: s.routine, weekly: s.weekly, monthly: s.monthly, missoes: s.missoes || [] },
      tasks: { items: s.tasks || [] }, projects: { items: s.projects || [] }, occurrences: { items: s.occurrences || [] },
    };
    const mes = (pre, k, put) => { const id = pre + '-' + String(k || '0000-00').slice(0, 7); put(parts[id] = parts[id] || (pre === 'days' ? { days: {} } : { items: [] })); };
    for (const [k, blocks] of Object.entries(s.days || {})) mes('days', k, p => { p.days[k] = blocks; });
    (s.indicators || []).forEach(r => mes('ind', r.date, p => p.items.push(r)));
    (s.events || []).forEach(e => mes('ev', e.date, p => p.items.push(e)));
    (s.feedbacks || []).forEach(f => mes('fb', f.date, p => p.items.push(f)));

  },
  join(docs) {

      tasks: (docs.tasks || {}).items || [], projects: (docs.projects || {}).items || [], occurrences: (docs.occurrences || {}).items || [],
      days: {}, indicators: [], events: [], feedbacks: [] };
    for (const [id, d] of Object.entries(docs)) {
      if (id.startsWith('days-')) Object.assign(s.days, d.days || {});
      else if (id.startsWith('ind-')) s.indicators.push(...(d.items || []));
      else if (id.startsWith('ev-')) s.events.push(...(d.items || []));
      else if (id.startsWith('fb-')) s.feedbacks.push(...(d.items || []));

  },
  parse(raw) { const o = {}; for (const [id, txt] of Object.entries(raw)) { try { o[id] = JSON.parse(txt); } catch (e) { /* documento inválido */ } } return o; },

  /* ---------- Entrar / sair ---------- */
  async init() {
    if (!this.supported() || !this.wanted()) return;

  },
  async start() {
    const api = await this.load();
    if (this._authUnsub) return;
    await new Promise(res => {
      let first = true;
      this._authUnsub = api.onAuth(async u => {

  },
  async connect() {
    if (!this.supported()) return UI.toast('A conta FlowFire não funciona dentro do link do Claude. Use o app ou o site.', 'warn');
    this.setWanted(true); this.setState('loading');
    try {
      await this.start();
      if (this.user) return this.attach();
      if (typeof Native !== 'undefined' && Native.available()) {
        const r = await Native.P().Google.autorizar({ escopos: this.SCOPES, interativo: true });

  /* Primeira conexão neste aparelho: junta o que há aqui com o que há na nuvem */

  ask(remoteAt) {

    return new Promise(res => {
      const m = UI.modal({
        title: 'Juntar os dados',
        body: `<p>Sua conta já tem dados salvos na nuvem, e este aparelho também tem dados diferentes. Qual versão você quer manter?</p>
          <ul class="ms-prev"><li><strong>Nuvem</strong>: alterada em ${fmt(remoteAt)}${remoteAt >= localAt ? ' (mais recente)' : ''}</li><li><strong>Este aparelho</strong>: alterado em ${fmt(localAt)}${localAt > remoteAt ? ' (mais recente)' : ''}</li></ul>
          <p class="muted small">A versão escolhida passa a valer em todos os aparelhos. Se estiver em dúvida, faça antes um backup em Configurações → Dados.</p>`,
        footer: `<button class="btn ghost" data-local>Usar a deste aparelho</button><span class="grow"></span><button class="btn primary" data-nuvem>Usar a da nuvem</button>`,
        canClose: () => false,
      });
      m.el.querySelector('[data-local]').onclick = () => { m.close(); res('local'); };
      m.el.querySelector('[data-nuvem]').onclick = () => { m.close(); res('nuvem'); };
    });
  },
  detach() { if (this.unsub) { try { this.unsub(); } catch (e) { /* ok */ } } this.unsub = null; clearTimeout(this.timer); this.last = {}; },

  schedule() {

    for (const id of Object.keys(this.last)) if (!(id in parts)) { delete this.last[id]; jobs.push(this.api.del(uid, id)); }

  },
  listen() {
    this.unsub = this.api.listen(this.user.uid, all => {
      const remote = Object.fromEntries(Object.entries(all).map(([id, d]) => [id, d.v]));

        const mudouAqui = local[id] !== this.last[id];          // alterado neste aparelho e ainda não enviado
        if (id in remote && remote[id] !== this.last[id] && !mudouAqui) { next[id] = remote[id]; this.last[id] = remote[id]; changed = true; }
        else if (!(id in remote) && id in this.last && !mudouAqui) { delete this.last[id]; changed = true; continue; }   // apagado em outro aparelho

      if (busy) this.pendingRender = true; else App.render();

  },

  /* ---------- Estado e interface ---------- */
  setState(s) { this.state = s; if (typeof App !== 'undefined' && App.renderNav && S) App.renderNav(); const el = document.getElementById('fire-status'); if (el) el.innerHTML = this.statusText(); },
  fail(e) { console.warn('Conta FlowFire', e); this.msg = this.erro(e); this.setState('error'); },
  erro(e) {
    const c = String((e && (e.code || e.message)) || e);
    if (/permission|insufficient/i.test(c)) return 'sem permissão no banco de dados (confira as regras do Firestore).';

    if (/unauthorized-domain/i.test(c)) return 'este endereço não está autorizado no Firebase.';
    if (/popup-blocked/i.test(c)) return 'o navegador bloqueou a janela de login. Libere pop-ups para este site.';
    return c.replace(/^Firebase: /, '');
  },
  statusText() {
    if (this.state === 'syncing') return `<span class="dot-wait"></span> Sincronizando…`;
    if (this.state === 'loading') return `<span class="dot-wait"></span> Conectando…`;
    if (this.state === 'error') return `<span class="dot-err"></span> Erro: ${U.esc(this.msg)}`;
    if (this.user) return `<span class="dot-ok"></span> Conectado como <strong>${U.esc(this.user.email || this.user.name || '')}</strong>. Seus dados ficam iguais em todos os aparelhos.`;

'use strict';
/* Gráficos em SVG puro (sem bibliotecas externas). Valores null = "sem dados" (não desenha barra). */
const Charts = (() => {
  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / p;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
  }

  /* series: [{name, color, values:[number|null]}] */
  function bars({ labels, series, height = 220, unit = '', maxValue }) {
    const all = series.flatMap(s => s.values).filter(v => v !== null && v !== undefined);
    if (!all.length) return `<div class="chart-empty">${U.icon('chart', 22)}<span>Sem dados no período</span></div>`;
    const W = 640, Hh = height;
    const padL = 36, padB = 26, padT = 12, padR = 8;
    const max = maxValue || niceMax(Math.max(...all));
    const cw = (W - padL - padR) / labels.length;
    const bw = Math.min(28, (cw - 6) / series.length);
    const y = v => padT + (Hh - padT - padB) * (1 - v / max);
    let g = '';
    for (let i = 0; i <= 4; i++) {
      const v = max * i / 4, yy = y(v);
      g += `<line x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}" class="grid"/><text x="${padL - 6}" y="${yy + 4}" class="axis" text-anchor="end">${U.fmtNum(v)}</text>`;
    }
    const step = Math.ceil(labels.length / 10);
    labels.forEach((l, i) => {
      const cx = padL + cw * i + cw / 2;
      if (i % step === 0) g += `<text x="${cx}" y="${Hh - 8}" class="axis" text-anchor="middle">${U.esc(l)}</text>`;
      series.forEach((s, j) => {
        const v = s.values[i];
        const x = cx - (bw * series.length) / 2 + j * bw;
        if (v === null || v === undefined) { g += `<rect x="${x + 1}" y="${y(0) - 2}" width="${bw - 2}" height="2" class="nodata"><title>${U.esc(l)} — ${U.esc(s.name)}: sem dados</title></rect>`; return; }
        const h = Math.max(1, y(0) - y(v));
        g += `<rect x="${x + 1}" y="${y(0) - h}" width="${bw - 2}" height="${h}" rx="3" style="fill:${s.color}"><title>${U.esc(l)} — ${U.esc(s.name)}: ${U.fmtNum(v)}${unit}</title></rect>`;
        if (labels.length <= 12) g += `<text x="${x + bw / 2}" y="${y(0) - h - 4}" class="val" text-anchor="middle">${U.fmtNum(v)}</text>`;
      });
    });
    const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${U.esc(s.name)}</span>`).join('')}</div>` : '';
    return `<div class="chart-scroll"><svg class="chart" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="xMinYMid meet">${g}</svg></div>${legend}`;
  }

  function ring(pct, { size = 92, stroke = 8, color = 'var(--accent)', label } = {}) {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r;
    const val = pct === null || pct === undefined ? 0 : pct;
    return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}" class="ring-bg" fill="none"/>
      ${val > 0 ? `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}" fill="none" style="stroke:${color}" class="ring-fg" stroke-linecap="round"
        stroke-dasharray="${c * val / 100} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>` : ''}
      <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="ring-txt">${label ?? (pct === null || pct === undefined ? '—' : pct + '%')}</text></svg>`;
  }

  /* Barras horizontais: rows [{label, value, color}] */
  function hbars(rows, unit = '') {
    const vals = rows.map(r => r.value).filter(v => v !== null);
    if (!vals.length) return `<div class="chart-empty">${U.icon('chart', 22)}<span>Sem dados no período</span></div>`;
    const max = Math.max(...vals, 1);
    return `<div class="hbars">${rows.map(r => `<div class="hb-row"><span class="hb-l" title="${U.esc(r.label)}">${U.esc(r.label)}</span><div class="hb-track"><span style="width:${r.value === null ? 0 : r.value / max * 100}%;background:${r.color || 'var(--accent)'}"></span></div><span class="hb-v">${r.value === null ? 'sem dados' : U.fmtNum(r.value) + unit}</span></div>`).join('')}</div>`;
  }

  return { bars, ring, hbars };
})();

  <script>/* js/calendar.js */
'use strict';
/* Calendário — recurso principal do app (Início e Agenda).
   Padrão mobile: mês compacto em cima (bolinhas coloridas por tipo; no computador, títulos dentro dos dias)
   e a lista do dia escolhido embaixo. Encolhe para uma semana, arrasta para trocar de mês/semana e tem "Hoje".
   Na Agenda começa na semana; "Ver mês" abre o mês inteiro. O dia escolhido é o dia da agenda. */
const Cal = {
  TYPES: { reuniao: 'Reunião', evento: 'Compromisso', tarefa: 'Prazo de tarefa', projeto: 'Prazo de projeto', imprevisto: 'Imprevisto', missao: 'Missão' },
  WD: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'],

  /* Tudo o que acontece num dia (sem as atividades da rotina, que ficam na Agenda) */
  itemsOn(k) {
    const out = [];
    S.events.filter(e => e.date === k).forEach(e => out.push({ type: Meetings.isMeeting(e) ? 'reuniao' : 'evento', label: e.title, time: e.time, id: e.id, demo: e.demo, done: !!e.registro, act: 'evView' }));
    S.tasks.filter(x => x.dueDate === k && x.status !== 'cancelada').forEach(x => out.push({ type: 'tarefa', label: x.title, time: x.dueTime, done: x.status === 'concluida', late: D.taskLate(x), id: x.id, demo: x.demo, act: 'tkEdit' }));
    if (S.settings.showProjetos) S.projects.filter(p => p.dueDate === k && p.status !== 'cancelado').forEach(p => out.push({ type: 'projeto', label: p.name, done: p.status === 'concluido', late: D.projectLate(p), id: p.id, demo: p.demo, act: 'pjOpen' }));
    S.occurrences.filter(o => o.dueDate === k && o.status !== 'cancelada').forEach(o => out.push({ type: 'imprevisto', label: o.title, time: o.dueTime, done: o.status === 'concluida', late: D.occLate(o), id: o.id, demo: o.demo, act: 'occEdit' }));
    // Missões com data que não criam item próprio (feedback com alguém, missão livre)
    if (typeof Missoes !== 'undefined') Missoes.list().filter(m => m.data === k && (m.tipo === 'feedbackItem' || m.tipo === 'manual') && !(m.tipo === 'manual' ? m.feitaEm : Missoes.itemFeito(m)))
      .forEach(m => out.push({ type: 'missao', label: m.titulo, time: '', id: m.id, act: 'msAbrir' }));
    return out.sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
  },

  st(id) {
    App.ui.cal = App.ui.cal || {};
    return App.ui.cal[id] = App.ui.cal[id] || { mode: id === 'agenda' ? 'week' : 'month', sel: U.today(), anchor: U.today() };
  },
  /* Mantém o calendário mostrando o dia escolhido (Agenda) */
  sync(id, k) {
    const s = this.st(id); s.sel = k;
    const r = this.range(s);
    if (k < r.cells[0] || k > r.cells[r.cells.length - 1] || (s.mode === 'month' && U.monthKey(k) !== r.mk)) s.anchor = k;
  },
  mondayOf(k) { return U.weekStart(k); },
  range(s) {
    if (s.mode === 'week') { const a = this.mondayOf(s.anchor); return { from: a, to: U.addDays(a, 6), cells: [0, 1, 2, 3, 4, 5, 6].map(i => U.addDays(a, i)) }; }
    const mk = U.monthKey(s.anchor), first = U.monthStart(mk), last = U.monthEnd(mk);
    const cells = []; for (let k = this.mondayOf(first); cells.length < 42; k = U.addDays(k, 1)) { cells.push(k); if (cells.length % 7 === 0 && k >= last) break; }

  },
  title(s) {

  },

    const cell = k => {
      const items = this.itemsOn(k), inMonth = s.mode === 'week' || U.monthKey(k) === r.mk;
      const ag = S.days[k] || (D.isWorkday(k) && k >= t) ? D.progress(k) : null;
      const cls = ['calx-d', inMonth ? '' : 'out', k === t ? 'today' : '', k === s.sel ? 'sel' : '', D.isWorkday(k) ? '' : 'off', items.some(i => i.late) ? 'has-late' : ''].join(' ');
      const max = s.mode === 'week' ? 5 : 3;
      return `<button class="${cls}" data-act="calSel" data-cal="${id}" data-k="${k}" aria-label="${U.fmtLong(k)}${items.length ? `, ${U.plural(items.length, 'item', 'itens')}` : ''}" ${k === s.sel ? 'aria-pressed="true"' : ''}>
        <span class="calx-n">${U.parse(k).getDate()}</span>
        ${inMonth && items.length ? `<span class="calx-chips">${items.slice(0, max).map(i => `<span class="calx-chip t-${i.type} ${i.done ? 'done' : ''} ${i.late ? 'late' : ''}">${i.time ? `<b>${i.time}</b> ` : ''}${U.esc(i.label)}</span>`).join('')}${items.length > max ? `<span class="calx-more">+${items.length - max}</span>` : ''}</span>
        <span class="calx-dots">${items.slice(0, 4).map(i => `<i class="t-${i.type} ${i.late ? 'late' : ''}"></i>`).join('')}${items.length > 4 ? '<i class="more"></i>' : ''}</span>` : ''}
        ${inMonth && ag && ag.total && s.mode === 'week' ? `<span class="calx-ag" title="Agenda do dia">${ag.pct}%</span>` : ''}
      </button>`;
    };
    return `<div class="calx calx-${s.mode}" data-cal-root="${id}">
      <div class="calx-h">
        <div class="calx-nav">
          <button class="icon-btn" data-act="calNav" data-cal="${id}" data-n="-1" aria-label="${s.mode === 'week' ? 'Semana anterior' : 'Mês anterior'}">${U.icon('left')}</button>
          <strong class="calx-t">${this.title(s)}</strong>
          <button class="icon-btn" data-act="calNav" data-cal="${id}" data-n="1" aria-label="${s.mode === 'week' ? 'Próxima semana' : 'Próximo mês'}">${U.icon('right')}</button>
        </div>
        <span class="grow"></span>
        ${showsToday && s.sel === t ? '' : `<button class="btn sm ghost" data-act="calToday" data-cal="${id}">Hoje</button>`}
        ${id === 'agenda' ? '' : `<div class="tabs calx-mode" role="tablist"><button class="tab ${s.mode === 'week' ? 'active' : ''}" data-act="calMode" data-cal="${id}" data-v="week">Semana</button><button class="tab ${s.mode === 'month' ? 'active' : ''}" data-act="calMode" data-cal="${id}" data-v="month">Mês</button></div>`}
      </div>
      <div class="calx-wd">${this.WD.map(d => `<span>${d}</span>`).join('')}</div>
      <div class="calx-grid" data-swipe="${id}">${r.cells.map(cell).join('')}</div>
      ${id === 'agenda' && s.mode === 'week' ? '' : `<div class="legend calx-legend">${Object.entries({ reuniao: 'Reunião', evento: 'Compromisso', tarefa: 'Tarefa', ...(S.settings.showProjetos ? { projeto: 'Projeto' } : {}), imprevisto: 'Imprevisto', ...((S.missoes || []).length ? { missao: 'Missão' } : {}) }).map(([k, l]) => `<span><i class="t-${k}"></i>${l}</span>`).join('')}</div>`}
      ${id === 'agenda' ? `<button class="calx-exp" data-act="calMode" data-cal="${id}" data-v="${s.mode === 'week' ? 'month' : 'week'}" aria-expanded="${s.mode === 'month'}">${s.mode === 'week' ? `${U.icon('down', 16)} Ver o mês inteiro` : `${U.icon('up', 16)} Mostrar só a semana`}</button>` : ''}
    </div>`;
  },

  /* Lista do dia escolhido */
  day(id) {
    const s = this.st(id), k = s.sel, t = U.today();

    const d = U.parse(k), wd = U.WD[d.getDay()].replace('-feira', '');
    const when = k === t ? 'Hoje' : k === U.addDays(t, 1) ? 'Amanhã' : k === U.addDays(t, -1) ? 'Ontem' : wd;
    return `<div class="calx-day">
      <div class="calx-day-h">
        <div><small class="muted">${when}</small><h3>${d.getDate()} de ${U.MONTHS[d.getMonth()].toLowerCase()}</h3></div>
      </div>
      ${items.length ? `<div class="calx-list">${items.map(i => `<div class="calx-it t-${i.type} ${i.done ? 'done' : ''} ${i.late ? 'late' : ''}" role="button" tabindex="0" data-act="${i.act}" data-id="${i.id}">
          <span class="calx-it-time">${i.time || '—'}</span>
          <span class="calx-it-main"><span class="calx-it-title">${U.esc(i.label)}${H.demo(i)}</span><small>${this.TYPES[i.type]}${i.done ? (i.type === 'reuniao' ? ' · registrada' : ' · concluído') : i.late ? ' · <span class="c-red">atrasado</span>' : ''}</small></span>

        : `<p class="calx-empty muted small">Nada marcado para este dia.</p>`}
      <button class="calx-agenda" data-act="goAgenda" data-d="${k}">
        ${U.icon('clock', 16)}<span><strong>Agenda do dia</strong><small class="muted">${ag.length ? `${U.plural(prog.total, 'atividade')}${prog.pct !== null ? ` · ${prog.pct}% concluído` : ''}` : D.isWorkday(k) ? 'Sem atividades' : 'Dia de folga'}</small></span>
        ${ag.length && prog.pct !== null ? H.bar(prog.pct) : ''}${U.icon('right', 15)}
      </button>
    </div>`;
  },

};

Object.assign(Actions, {
  calSel({ cal, k }) {
    const s = Cal.st(cal);
    s.sel = k;
    if (s.mode === 'month' && U.monthKey(k) !== U.monthKey(s.anchor)) s.anchor = k;
    if (cal === 'agenda') App.ui.agendaDate = k;
    App.render();
  },
  calNav({ cal, n }) {
    const s = Cal.st(cal), t = U.today();
    if (s.mode === 'week') {
      s.anchor = U.addDays(Cal.mondayOf(s.anchor), Number(n) * 7);

      const r = Cal.range(s);
      s.sel = t >= r.from && t <= r.to ? t : cal === 'agenda' ? U.addDays(s.sel, Number(n) * 7) : r.from;

      s.anchor = U.addMonths(U.monthKey(s.anchor), Number(n)) + '-01';
      const r = Cal.range(s);
      s.sel = t >= r.from && t <= r.to ? t : U.monthStart(r.mk);

    App.render();
  },
  calToday({ cal }) { const s = Cal.st(cal); s.anchor = s.sel = U.today(); if (cal === 'agenda') App.ui.agendaDate = s.sel; App.render(); },
  calMode({ cal, v }) { const s = Cal.st(cal); s.mode = v; s.anchor = s.sel; App.render(); },
  /* Botão flutuante "+" no Início e na Agenda: escolhe o que criar (no dia escolhido) */
  quickAdd({ k, from }) {
    const t = U.today(); k = k || t;
    const onAgenda = from === 'agenda';
    const dated = onAgenda || k !== t;   // prazo da tarefa: só se o dia foi escolhido
    const breakOk = onAgenda && (S.settings.breakMode || 'fixo') === 'flexivel' && !D.dayBlocks(k).some(b => D.isBreak(b) && b.status !== 'cancelada');
    const activity = { label: 'Atividade na agenda', hint: 'Um horário no cronograma do dia', icon: 'clock', onClick: () => { App.ui.agendaDate = k; if (onAgenda) Actions.agNew(); else { App.go('agenda'); setTimeout(() => Actions.agNew(), 150); } } };
    const items = [
      { label: dated ? 'Tarefa com prazo neste dia' : 'Tarefa', icon: 'tasks', onClick: () => Tasks.form(null, dated ? { dueDate: k } : {}) },
      { label: 'Reunião', hint: 'Com pauta, gravação e ata', icon: 'users', onClick: () => Events.form(null, k, { reuniao: true }) },
      { label: 'Feedback', hint: 'Conversa individual com o colaborador', icon: 'chat', onClick: () => FB.form(null) },
      { label: 'Imprevisto', hint: onAgenda ? 'E já encaixa na agenda' : 'Demanda urgente', icon: 'alert', onClick: () => onAgenda ? Actions.agImprevisto() : Occ.form(null) },
      { label: 'Compromisso', hint: 'Visita, consulta, entrega…', icon: 'calendar', onClick: () => Events.form(null, k) },
    ];
    if (onAgenda) items.unshift(activity); else items.push(activity);
    if (breakOk) items.splice(1, 0, { label: k === t ? 'Intervalo agora' : 'Intervalo', hint: 'Marca o almoço e empurra o que vem depois', icon: 'pause', onClick: () => Actions.agBreak() });
    UI.sheet(k === t ? 'Adicionar' : `Adicionar em ${U.fmtShort(k)}`, items);
  },
});

/* Arrastar o dedo no calendário troca de mês/semana */
(() => {
  let sx = null, sy = 0, el = null;
  document.addEventListener('touchstart', e => {
    el = e.target && e.target.closest ? e.target.closest('[data-swipe]') : null; const t = e.touches[0];

  }, { passive: true });
})();
