'use strict';
/* Gerador mínimo de planilhas .xlsx (Office Open XML) em ZIP sem compressão — sem dependências. */
const XLSX = (() => {
  const enc = new TextEncoder();
  const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = buf => { let c = 0xFFFFFFFF; for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const xml = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');

  function zip(files) {
    const parts = [], central = [];
    let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
      ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + data.length;
    }
    const cdSize = central.reduce((s, p) => s + p.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
    return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  const colName = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };

  function sheetXml(rows) {
    const widths = [];
    rows.forEach(r => r.forEach((v, i) => { widths[i] = Math.min(60, Math.max(widths[i] || 8, String(v ?? '').length + 2)); }));
    const cols = widths.length ? `<cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
    const body = rows.map((r, ri) => `<row r="${ri + 1}">${r.map((v, ci) => {
      const ref = colName(ci) + (ri + 1), st = ri === 0 ? ' s="1"' : '';
      if (v === null || v === undefined || v === '') return `<c r="${ref}"${st}/>`;
      if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${st}><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xml(v)}</t></is></c>`;
    }).join('')}</row>`).join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${body}</sheetData></worksheet>`;
  }

  /* sheets: [{name, rows: [[...], ...]}] — a primeira linha é o cabeçalho */
  function build(sheets) {
    const safe = sheets.map((s, i) => ({ ...s, name: (s.name || `Planilha${i + 1}`).replace(/[\\/?*[\]:]/g, ' ').slice(0, 31) }));
    const files = [
      { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${safe.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>` },
      { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
      { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${safe.map((s, i) => `<sheet name="${xml(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` },
      { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${safe.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${safe.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
      { name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1E3A5F"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
      ...safe.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXml(s.rows) })),
    ];
    return zip(files);
  }

  return { build };
})();

</script>
  <script>/* js/views/dashboard.js */
'use strict';
/* Dashboard — centro de controle */
Views.dashboard = {
  title: 'Início', icon: 'dashboard', nav: 'Início',
  fab: () => ({ act: 'quickAdd', label: 'Adicionar', data: { k: Cal.st('home').sel, from: 'home' } }),
  /* Topo da tela inicial: saudação e data no lugar do título (o relógio fica à direita) */
  hero() {
    const h = new Date().getHours(), t = U.today(), d = U.parse(t);
    const greet = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
    return `<span class="th-greet">${greet}</span><span class="th-date">${U.WD[U.weekday(t)].replace('-feira', '')}, ${d.getDate()} de ${U.MONTHS[d.getMonth()].toLowerCase()}</span>`;
  },
  render() {
    const t = U.today(), nowM = U.nowMin();
    const hour = new Date().getHours();
    const greet = hour < 12 ? 'Bom dia' : hour < 18 ? 'Boa tarde' : 'Boa noite';
    const workday = D.isWorkday(t);
    const blocks = D.dayBlocks(t);
    const prog = D.progress(t);
    const focus = S.weekly.focus.find(f => f.day === U.weekday(t));

    const open = S.tasks.filter(x => OPEN(x.status));
    const lateTasks = open.filter(D.taskLate);
    const lateBlocks = blocks.filter(b => D.blockLate(b, t));
    const ws = U.weekStart(t), we = U.addDays(ws, 6);
    const doneWeek = S.tasks.filter(x => x.status === 'concluida' && x.completedAt && x.completedAt.slice(0, 10) >= ws && x.completedAt.slice(0, 10) <= we);
    const doneTotal = S.tasks.filter(x => x.status === 'concluida').length;
    const openOcc = S.occurrences.filter(o => OPEN(o.status));

    // Próximas atividades da agenda
    const next = blocks.filter(b => !D.blockDone(b) && U.toMin(b.end) > nowM).slice(0, 5);

    // Pendências prioritárias (o que resolver)
    const prioItems = [
      ...openOcc.map(o => ({ kind: 'Imprevisto', title: o.title, prio: o.priority, info: D.deadline(o.dueDate, o.dueTime, false), link: '#imprevistos', demo: o.demo })),
      ...open.filter(x => ['urgente', 'alta'].includes(x.priority) || D.taskLate(x)).map(x => ({ kind: 'Tarefa', title: x.title, prio: x.priority, info: D.deadline(x.dueDate, x.dueTime, false), link: '#tarefas', demo: x.demo })),
      // Reuniões com pauta que já aconteceram (últimos 7 dias) e ainda não foram registradas
      ...Meetings.toRegister().filter(e => e.date >= U.addDays(t, -7))
        .map(e => ({ kind: 'Registrar reunião', title: e.title, prio: 'media', info: null, link: '#reunioes', demo: e.demo, ev: e.id })),
    ].sort((a, b) => ((b.info?.level === 'late') - (a.info?.level === 'late')) || PRIORITY_RANK[a.prio] - PRIORITY_RANK[b.prio]).slice(0, 7);

    // O que cobrar da equipe
    const charge = [
      ...open.filter(x => x.responsible).map(x => ({ who: x.responsible, what: x.title, kind: 'Tarefa', info: D.deadline(x.dueDate, x.dueTime, false), demo: x.demo })),
      ...openOcc.filter(o => o.responsible).map(o => ({ who: o.responsible, what: o.title, kind: 'Imprevisto', info: D.deadline(o.dueDate, o.dueTime, false), demo: o.demo })),
      ...(S.settings.showProjetos ? S.projects : []).filter(p => ['andamento', 'planejamento', 'pausado'].includes(p.status)).flatMap(p => (p.pendencias || []).filter(x => !x.done).map(x => ({ who: p.responsible || '—', what: x.text, kind: 'Pendência · ' + p.name, info: null, demo: p.demo }))),
    ].sort((a, b) => ((b.info?.level === 'late') - (a.info?.level === 'late'))).slice(0, 7);

    // Projetos
    const projects = S.projects.filter(p => ['andamento', 'planejamento', 'pausado'].includes(p.status))
      .sort((a, b) => (D.projectLate(b) - D.projectLate(a)) || (a.dueDate || '9').localeCompare(b.dueDate || '9')).slice(0, 5);

    // Próximos 7 dias
    const upcoming = [];
    for (let i = 0; i <= 7; i++) {
      const k = U.addDays(t, i);
      S.tasks.filter(x => OPEN(x.status) && x.dueDate === k).forEach(x => upcoming.push({ k, label: x.title, type: 'Prazo de tarefa', demo: x.demo }));
      (S.settings.showProjetos ? S.projects : []).filter(p => !['concluido', 'cancelado'].includes(p.status) && p.dueDate === k).forEach(p => upcoming.push({ k, label: p.name, type: 'Prazo de projeto', demo: p.demo }));
      S.events.filter(e => e.date === k).forEach(e => upcoming.push({ k, label: e.title, type: 'Compromisso' + (e.time ? ' ' + e.time : '') + ((e.pautas || []).length ? `, ${U.plural(e.pautas.length, 'assunto')} na pauta` : ''), demo: e.demo, ev: e.id }));
      S.occurrences.filter(o => OPEN(o.status) && o.dueDate === k).forEach(o => upcoming.push({ k, label: o.title, type: 'Prazo de imprevisto', demo: o.demo }));
    }

    // Resumo semanal
    const wdays = S.settings.workDays.filter(d => d >= 1 && d <= 6).concat(S.settings.workDays.includes(0) ? [0] : []);
    const weekKeys = wdays.map(d => U.addDays(ws, (d + 6) % 7));
    const chk = S.weekly.checks[ws] || {};
    const wItems = S.weekly.focus.filter(f => S.settings.workDays.includes(f.day)).flatMap(f => f.items);
    const wDone = wItems.filter(i => chk[i.id]).length;
    const wPct = wItems.length ? Math.round(wDone / wItems.length * 100) : null;
    const dayVals = weekKeys.map(k => k > t ? null : (D.progress(k).pct ?? null));

    const goals = S.settings.goals.map(g => ({ g, st: D.goalStatus(g) }));

    const kpi = (label, value, sub, cls = '', href = '', status = '') => `<a class="kpi ${cls}" ${href ? `href="${href}"` : ''} ${status ? `data-act="goTasks" data-status="${status}"` : ''}><span class="kpi-l">${label}</span><strong class="kpi-v">${value}</strong><span class="kpi-s">${sub}</span></a>`;

    const dWd = U.WD[U.weekday(t)].replace('-feira', '');
    const dDate = `${dWd}, ${U.parse(t).getDate()} de ${U.MONTHS[U.parse(t).getMonth()].toLowerCase()}`;
    const showGoals = !!S.settings.showIndicadores, showProj = !!S.settings.showProjetos;

    return `
    ${Updater.banner()}
    <section class="day-card">
      ${Jogo.card()}
      <div class="dc-day">
        <div class="dc-day-h"><span>${workday ? (focus && focus.title ? `Foco: <strong>${U.esc(focus.title)}</strong> · ` : '') + `Expediente <strong>${S.settings.workStart}–${S.settings.workEnd}</strong>` : 'Hoje não é dia útil. Bom descanso.'}</span>
          ${prog.total ? `<a class="dc-prog" href="#agenda">${prog.done} de ${U.plural(prog.total, 'atividade')} · ${prog.pct}%</a>` : ''}</div>
        ${blocks.length ? H.dayRail(t) : ''}
      </div>
    </section>

    <section class="card cal-card cal-home">${Cal.render('home')}${Cal.day('home')}</section>

    <section class="kpis">
      <div class="kpi kpi-ring">${Charts.ring(prog.pct, { size: 76, stroke: 7 })}<div><span class="kpi-l">Progresso do dia</span><span class="kpi-s">${prog.total ? `${prog.done} de ${U.plural(prog.total, 'atividade')}` : 'Sem atividades hoje'}</span><a class="link" href="#agenda">Abrir agenda</a></div></div>
      ${kpi('Tarefas concluídas', doneTotal, `${doneWeek.length} nesta semana`, 'k-green', '#tarefas', 'concluida')}
      ${kpi('Tarefas pendentes', open.length, `${open.filter(x => x.status === 'andamento').length} em andamento`, 'k-gray', '#tarefas', 'abertas')}
      ${kpi('Atrasadas', lateTasks.length + lateBlocks.length, `${U.plural(lateTasks.length, 'tarefa')} · ${lateBlocks.length} na agenda`, (lateTasks.length + lateBlocks.length) ? 'k-red' : 'k-gray', '#tarefas', 'atrasadas')}
      ${kpi('Imprevistos abertos', openOcc.length, openOcc.filter(D.occLate).length ? `${openOcc.filter(D.occLate).length} com prazo vencido` : 'Nenhum vencido', openOcc.length ? 'k-yellow' : 'k-gray', '#imprevistos')}
    </section>

    <section class="grid-2">
      <div class="card">
        <div class="card-h"><h3>${U.icon('clock')} O que fazer hoje</h3><a class="link" href="#agenda">Agenda</a></div>
        ${next.length ? `<ul class="list">${next.map(b => `<li class="li ${D.blockNow(b, t) ? 'li-now' : ''}"><span class="li-time">${b.start}–${b.end}</span><span class="li-main" style="--c:${D.cat(b.category).color}"><span class="cat-dot"></span>${U.esc(b.title)}</span>${D.blockNow(b, t) ? '<span class="badge b-blue">Agora</span>' : b.status === 'andamento' ? H.status('andamento') : ''}</li>`).join('')}</ul>`
          : H.empty(workday ? (prog.total ? 'Todas as atividades de hoje foram encerradas.' : 'Nenhuma atividade na agenda de hoje.') : 'Sem agenda para hoje.')}
        ${lateBlocks.length ? `<div class="alert a-red">${U.icon('alert')} ${U.plural(lateBlocks.length, 'atividade')} da agenda ${lateBlocks.length > 1 ? 'passaram' : 'passou'} do horário sem conclusão. <a class="link" href="#agenda">Reorganizar</a></div>` : ''}
      </div>
      <div class="card">
        <div class="card-h"><h3>${U.icon('alert')} O que resolver</h3><a class="link" href="#tarefas">Tarefas</a></div>
        ${prioItems.length ? `<ul class="list">${prioItems.map(i => `<li class="li"><a href="${i.link}" class="li-main" ${i.ev ? `data-act="evView" data-id="${i.ev}"` : ''}>${i.ev ? H.chip('Reunião', '#9461f5') : H.prio(i.prio)} <span>${U.esc(i.title)}</span>${H.demo(i)}</a><span class="li-side"><small class="muted">${i.kind}</small>${H.deadline(i.info)}</span></li>`).join('')}</ul>`
          : H.empty('Nenhuma pendência urgente, de alta prioridade ou atrasada.')}
      </div>
    </section>

    <section class="${showProj ? 'grid-2' : 'grid-1'}">
      <div class="card">
        <div class="card-h"><h3>${U.icon('user')} O que cobrar da equipe</h3></div>
        ${charge.length ? `<ul class="list">${charge.map(c => `<li class="li li-stack"><div class="li-top"><strong>${U.esc(c.who)}</strong><small class="muted">${U.esc(c.kind)}</small>${H.deadline(c.info)}</div><div class="li-txt">${U.esc(c.what)}${H.demo(c)}</div></li>`).join('')}</ul>`
          : H.empty('Nada delegado em aberto. Defina um responsável em tarefas, imprevistos ou projetos para acompanhar aqui.')}
      </div>
      ${showProj ? `<div class="card">
        <div class="card-h"><h3>${U.icon('kanban')} Projetos em andamento</h3><a class="link" href="#projetos">Projetos</a></div>
        ${projects.length ? projects.map(p => { const pct = D.projectProgress(p); const dl = D.deadline(p.dueDate, null, false); return `<div class="proj-mini"><div class="pm-h"><a href="#projetos" class="pm-n">${U.esc(p.name)}</a>${H.demo(p)}${H.pstatus(p.status)}</div><div class="pm-b">${H.bar(pct, D.projectLate(p) ? 'var(--red)' : 'var(--accent)')}<strong>${pct}%</strong></div><div class="pm-f"><small class="muted">${U.esc(p.client || '')}</small>${H.deadline(dl)}</div></div>`; }).join('')
          : H.empty('Nenhum projeto ativo cadastrado.', '<a class="btn sm" href="#projetos">Cadastrar projeto</a>')}
      </div>` : ''}
    </section>

    <section class="${showGoals ? 'grid-2' : 'grid-1'} dash-foot">
      <div class="card flat">
        <div class="card-h"><h3>${U.icon('week')} Resumo da semana</h3><a class="link" href="#agenda">Agenda</a></div>
        <div class="stat-row">
          ${wItems.length ? `<div><small>Checklist semanal</small><strong>${wPct}%</strong></div>` : ''}
          <div><small>Tarefas concluídas</small><strong>${doneWeek.length}</strong></div>
          <div><small>Imprevistos na semana</small><strong>${S.occurrences.filter(o => o.date >= ws && o.date <= we).length}</strong></div>
        </div>
        ${wItems.length ? H.bar(wPct) : ''}
        <p class="muted small mt">Conclusão da agenda por dia</p>
        ${dayVals.some(v => v !== null) ? Charts.bars({ labels: weekKeys.map(k => U.WD_SHORT[U.weekday(k)]), series: [{ name: 'Agenda concluída', color: 'var(--accent)', values: dayVals }], height: 150, unit: '%', maxValue: 100 }) : '<div class="chart-empty"><span>Sem dados ainda nesta semana</span></div>'}
      </div>
      ${showGoals ? `<div class="card flat">
        <div class="card-h"><h3>${U.icon('target')} Resultados e metas</h3><a class="link" href="#indicadores">Indicadores</a></div>
        ${goals.length ? goals.map(({ g, st }) => `<div class="goal"><div class="goal-h"><span>${U.esc(g.name || metricLabel(g.metric))}</span>${H.demo(g)}${st.achieved === null ? '<span class="badge">Sem dados</span>' : st.achieved ? '<span class="badge b-green">Alcançada</span>' : '<span class="badge b-yellow">Em curso</span>'}</div>${H.bar(st.pct, st.achieved ? 'var(--green)' : 'var(--accent)')}<small class="muted">${st.val === null ? 'Nenhum dado lançado' : `${U.fmtNum(st.val)} ${g.direction === 'max' ? '(máx.' : '(meta'} ${U.fmtNum(st.target)}) · ${g.period}`}</small></div>`).join('')
          : H.empty('Nenhuma meta configurada.', '<a class="btn sm" href="#config">Configurar metas</a>')}
      </div>` : ''}
    </section>`;
  },
};

</script>
  <script>/* js/views/agenda.js */
'use strict';
/* Agenda — uma tela só: calendário compacto em cima (semana; "Ver mês" abre o mês inteiro) e, embaixo,
   o dia escolhido numa lista única por horário: atividades da rotina + reuniões, compromissos e prazos. */
Views.agenda = {
  title: 'Agenda', icon: 'clock', nav: 'Agenda',
  fab: () => ({ act: 'quickAdd', label: 'Adicionar neste dia', data: { k: Agenda.day(), from: 'agenda' } }),
  render() {
    const k = Agenda.day(), t = U.today();
    Cal.sync('agenda', k);
    const blocks = D.dayBlocks(k);
    const conflicts = D.conflicts(blocks);
    const prog = D.progress(k);
    const late = blocks.filter(b => D.blockLate(b, k));
    const items = Cal.itemsOn(k);
    const d = U.parse(k), wd = U.WD[d.getDay()];
    const when = k === t ? 'Hoje' : k === U.addDays(t, 1) ? 'Amanhã' : k === U.addDays(t, -1) ? 'Ontem' : '';

    const row = b => {
      const c = D.cat(b.category);
      const isLate = D.blockLate(b, k), isNow = D.blockNow(b, k);
      if (D.isBreak(b)) {
        return `<div class="blk blk-break" style="--c:${c.color}"><div class="blk-time"><strong>${b.start}</strong><span>${b.end}</span></div><div class="blk-body" data-act="agEdit" data-id="${b.id}"><span class="blk-title">${U.esc(b.title)}</span></div></div>`;
      }
      const badges = [
        isNow ? '<span class="badge b-blue">Agora</span>' : '',
        isLate ? '<span class="badge b-red">Atrasada</span>' : '',
        conflicts.has(b.id) ? '<span class="badge b-yellow">Conflito</span>' : '',
        b.status === 'andamento' && !isNow ? H.status('andamento') : '',
      ].join('');
      return `<div class="blk st-${b.status} ${isLate ? 'late' : ''} ${isNow ? 'now' : ''}" style="--c:${c.color}">
        <div class="blk-time"><strong>${b.start}</strong><span>${b.end}</span></div>
        <div class="blk-body" data-act="agEdit" data-id="${b.id}">
          <div class="blk-head"><span class="blk-title">${U.esc(b.title)}</span>${badges}</div>
          ${b.notes ? `<p class="blk-notes">${U.esc(b.notes)}</p>` : ''}
        </div>
        <div class="blk-actions">
          ${b.status === 'concluida'
            ? `<button class="icon-btn" data-act="agStatus" data-id="${b.id}" data-s="pendente" title="Reabrir" aria-label="Reabrir">${U.icon('undo', 16)}</button>`
            : `<button class="icon-btn ok" data-act="agStatus" data-id="${b.id}" data-s="concluida" title="Concluir" aria-label="Concluir">${U.icon('check', 16)}</button>`}
          <button class="icon-btn" data-act="agMore" data-id="${b.id}" title="Mais opções" aria-label="Mais opções">${U.icon('more', 16)}</button>
        </div>
      </div>`;
    };
    // Reuniões, compromissos e prazos entram na mesma lista, pela hora
    const item = i => `<div class="blk blk-it ${i.done ? 'st-concluida' : ''} ${i.late ? 'late' : ''}" style="--c:var(--t-${i.type})" role="button" tabindex="0" data-act="${i.act}" data-id="${i.id}">
        <div class="blk-time"><strong>${i.time || (i.type === 'reuniao' || i.type === 'evento' ? 'Dia' : 'Prazo')}</strong>${i.time ? '' : `<span>${i.type === 'reuniao' || i.type === 'evento' ? 'todo' : 'do dia'}</span>`}</div>
        <div class="blk-body"><div class="blk-head"><span class="blk-title">${U.esc(i.label)}${H.demo(i)}</span></div>
          <small class="blk-kind">${Cal.TYPES[i.type]}${i.done ? (i.type === 'reuniao' ? ' · registrada' : ' · concluído') : i.late ? ' · <span class="c-red">atrasado</span>' : ''}</small></div>
        <div class="blk-actions">${U.icon('right', 16)}</div></div>`;
    const list = [
      ...items.filter(i => !i.time).map(i => ({ t: '', h: item(i) })),
      ...blocks.map(b => ({ t: b.start, h: row(b) })),
      ...items.filter(i => i.time).map(i => ({ t: i.time, h: item(i) })),
    ].map((x, n) => ({ ...x, n })).sort((a, b) => a.t.localeCompare(b.t) || a.n - b.n);

    const summary = !blocks.length ? (D.isWorkday(k) ? 'Nenhuma atividade na rotina deste dia' : 'Dia de folga')
      : `${prog.done} de ${U.plural(prog.total, 'atividade')} concluída${prog.done === 1 ? '' : 's'}${late.length ? ` · <span class="c-red">${late.length} atrasada${late.length > 1 ? 's' : ''}</span>` : ''}`;

    return `
    <section class="card cal-card ag-cal">${Cal.render('agenda')}</section>

    <section class="ag-day">
      <div class="ag-head">
        <div class="ag-head-t">
          <small class="muted">${when ? `${when} · ` : ''}${wd}</small>
          <h2>${d.getDate()} de ${U.MONTHS[d.getMonth()].toLowerCase()}</h2>
          <p class="muted small">${summary}</p>
        </div>
        <span class="grow"></span>
        ${blocks.length ? `<button class="btn sm ghost" data-act="agMenu" aria-label="Reorganizar o dia">${U.icon('more', 16)} Reorganizar</button>` : ''}
      </div>
      ${blocks.length ? H.dayRail(k, { link: false }) : ''}
      ${late.length && k <= t ? `<div class="alert a-red">${U.icon('alert')} <span>${U.plural(late.length, 'atividade passou', 'atividades passaram')} do horário. Use <strong>Reorganizar</strong> para remanejar.</span></div>` : ''}
      <div class="timeline">
        ${list.length ? list.map(x => x.h).join('') : H.empty(D.isWorkday(k) ? 'Nada marcado para este dia.' : 'Dia de folga. Nada marcado.', `<small class="muted">Toque em <strong>+</strong> para adicionar.${S.routine.length ? '' : ' Para a agenda se montar sozinha todo dia, cadastre sua rotina em <a class="link" href="#config" data-act="cfgJump" data-id="rotina">Configurações → Rotina padrão</a>.'}</small>`)}
      </div>
    </section>`;
  },
};

const Agenda = {
  day() { return App.ui.agendaDate || U.today(); },
  blockFields(b = {}, isNew) {
    const fields = [
      { name: 'title', label: 'Atividade', required: true, value: b.title },
      { name: 'start', label: 'Início', type: 'time', required: true, value: b.start, half: true },
      { name: 'end', label: 'Fim', type: 'time', required: true, value: b.end, half: true },
      { name: 'category', label: 'Categoria', type: 'select', options: H.catOptions(), value: b.category, half: true },
      { name: 'priority', label: 'Prioridade', type: 'select', options: H.prioOptions(), value: b.priority || 'media', half: true },
      { name: 'status', label: 'Status', type: 'select', options: H.statusOptions(), value: b.status || 'pendente', half: true },
      { name: 'fixed', label: 'Horário fixo (não é deslocado na reorganização)', type: 'checkbox', value: b.fixed, half: true },
      { name: 'notes', label: 'Observações', type: 'textarea', value: b.notes },
      { name: 'reflow', label: 'Se houver sobreposição, deslocar as atividades seguintes (mantém o intervalo e a ordem)', type: 'checkbox', value: true },
    ];
    if (!isNew && b.routineId) fields.push({ name: 'applyRoutine', label: 'Aplicar também à rotina padrão (dias futuros ainda não alterados)', type: 'checkbox', value: false });
    return fields;
  },
  validateTimes(v) { if (U.toMin(v.end) <= U.toMin(v.start)) return 'O horário de fim deve ser depois do início.'; },
  afterReflow(k, moved) {
    const over = D.overflowCount(k);
    if (over) UI.toast(`${U.plural(over, 'atividade')} ${over > 1 ? 'passaram' : 'passou'} do horário de saída. Considere movê-las para o próximo dia útil.`, 'warn');
    else if (moved) UI.toast(`${U.plural(moved, 'atividade deslocada', 'atividades deslocadas')}.`);
  },
  scheduleDialog(occ) {
    const t = U.today();
    let date = Agenda.day() >= t ? Agenda.day() : t;
    let start = U.fromMin(Math.ceil(U.nowMin() / 5) * 5);
    if (date !== t || U.toMin(start) < U.toMin(S.settings.workStart)) start = S.settings.workStart;
    if (date === t && U.toMin(start) >= U.toMin(S.settings.workEnd)) { date = D.nextWorkday(t); start = S.settings.workStart; }
    UI.form({
      title: 'Encaixar imprevisto na agenda',
      submitLabel: 'Encaixar',
      fields: [
        { type: 'html', html: `<div class="alert a-red">${U.icon('alert')} <strong>${U.esc(occ.title)}</strong></div>` },
        { name: 'date', label: 'Data', type: 'date', value: date, required: true, half: true },
        { name: 'start', label: 'Início', type: 'time', value: start, required: true, half: true },
        { name: 'duration', label: 'Duração (minutos)', type: 'number', value: 30, min: 5, step: 5, required: true, half: true },
        { name: 'mode', label: 'Como reorganizar o dia', type: 'radio', value: 'deslocar', options: [['deslocar', 'Deslocar as atividades seguintes (mantém a ordem e o intervalo)'], ['encaixar', 'Apenas encaixar (as demais ficam como estão; pode gerar conflito)']] },
      ],
      validate: v => (!v.duration || v.duration < 5) ? 'Informe uma duração de pelo menos 5 minutos.' : null,
      onSubmit(v) {
        if (occ.scheduled) { const old = S.days[occ.scheduled.date]; if (old) S.days[occ.scheduled.date] = old.filter(b => b.id !== occ.scheduled.blockId); }
        const day = D.ensureDay(v.date);
        const b = { id: U.uid(), start: v.start, end: U.fromMin(U.toMin(v.start) + v.duration), title: 'Imprevisto: ' + occ.title, category: 'imprevistos', priority: occ.priority, status: 'pendente', notes: occ.description || '', fixed: false, occurrenceId: occ.id, demo: occ.demo || undefined };
        day.push(b);
        occ.scheduled = { date: v.date, blockId: b.id };
        let moved = 0;
        if (v.mode === 'deslocar') moved = D.reflow(v.date, b.id);
        commit();
        Agenda.afterReflow(v.date, moved);
        UI.toast(`Encaixado em ${U.fmtShort(v.date)} às ${v.start}.`, 'ok', { label: 'Ver agenda', onClick: () => { App.ui.agendaDate = v.date; location.hash = '#agenda'; App.render(); } });
      },
    });
  },
  moveDialog(k, b) {
    UI.form({
      title: 'Mover atividade para outra data',
      submitLabel: 'Mover',
      fields: [
        { type: 'html', html: `<p><strong>${U.esc(b.title)}</strong> · ${b.start}–${b.end}</p>` },
        { name: 'date', label: 'Nova data', type: 'date', value: D.nextWorkday(k), required: true, half: true },
        { name: 'start', label: 'Novo início', type: 'time', value: b.start, required: true, half: true },
        { name: 'reflow', label: 'Deslocar as atividades seguintes no dia de destino, se houver sobreposição', type: 'checkbox', value: false },
      ],
      validate: v => v.date === k ? 'Escolha uma data diferente (para mudar só o horário, use Editar).' : null,
      onSubmit(v) {
        const nb = D.moveBlock(k, b.id, v.date, v.start);
        let moved = 0;
        if (nb && v.reflow) moved = D.reflow(v.date, nb.id);
        commit();
        Agenda.afterReflow(v.date, moved);
        UI.toast(`Atividade movida para ${U.fmtShort(v.date)}.`);
      },
    });
  },
};

Object.assign(Actions, {
  agShift({ n }) { n = Number(n); App.ui.agendaDate = n === 0 ? U.today() : U.addDays(Agenda.day(), n); App.render(); },
  agStatus({ id, s }) {
    const k = Agenda.day(); const b = D.findBlock(k, id); if (!b) return;
    b.status = s;
    if (s === 'andamento') D.ensureDay(k).forEach(x => { if (x !== b && x.status === 'andamento' && !D.isBreak(x)) x.status = 'pendente'; });
    commit();
  },
  agNew() {
    const k = Agenda.day();
    const bl = D.dayBlocks(k);
    const start = k === U.today() ? U.fromMin(Math.ceil(U.nowMin() / 15) * 15) : S.settings.workStart;
    UI.form({
      title: `Nova atividade — ${U.fmtDate(k)}`,
      fields: Agenda.blockFields({ start, end: U.fromMin(U.toMin(start) + 30), category: 'administrativo' }, true),
      validate: Agenda.validateTimes,
      onSubmit(v) {
        const b = { id: U.uid(), title: v.title, start: v.start, end: v.end, category: v.category, priority: v.priority, status: v.status, fixed: v.fixed, notes: v.notes };
        D.ensureDay(k).push(b);
        const moved = v.reflow && bl.length ? D.reflow(k, b.id) : 0;
        commit(); Agenda.afterReflow(k, moved);
        UI.toast('Atividade adicionada.');
      },
    });
  },
  agEdit({ id }) {
    const k = Agenda.day();
    const cur = D.dayBlocks(k).find(b => b.id === id); if (!cur) return;
    UI.form({
      title: 'Editar atividade',
      fields: Agenda.blockFields(cur, false),
      validate: Agenda.validateTimes,
      extra: [{ label: `${U.icon('trash', 15)} Excluir`, cls: 'ghost danger-text', onClick: (_, m) => { m.close(); Actions.agDelete({ id }); } }],
      onSubmit(v) {
        const b = D.findBlock(k, id);
        const timeChanged = v.start !== b.start || v.end !== b.end;
        Object.assign(b, { title: v.title, start: v.start, end: v.end, category: v.category, priority: v.priority, status: v.status, fixed: v.fixed, notes: v.notes });
        if (v.applyRoutine && b.routineId) {
          const r = S.routine.find(x => x.id === b.routineId);
          if (r) Object.assign(r, { title: v.title, start: v.start, end: v.end, category: v.category, priority: v.priority, fixed: v.fixed, notes: v.notes });
        }
        const moved = timeChanged && v.reflow ? D.reflow(k, b.id) : 0;
        if (b.occurrenceId && v.status === 'concluida') { const o = S.occurrences.find(x => x.id === b.occurrenceId); if (o && OPEN(o.status)) UI.toast('Lembre-se de atualizar o status do imprevisto, se ele foi resolvido.', 'warn'); }
        commit(); Agenda.afterReflow(k, moved);
      },
    });
  },
  agDelete({ id }) {
    const k = Agenda.day();
    const b = D.dayBlocks(k).find(x => x.id === id); if (!b) return;
    UI.confirm(`Excluir a atividade <strong>${U.esc(b.title)}</strong> deste dia?${b.routineId ? '<br><small class="muted">Ela continua na rotina padrão dos outros dias.</small>' : ''}`, () => {
      const arr = D.ensureDay(k); const i = arr.findIndex(x => x.id === id);
      const [removed] = arr.splice(i, 1);
      if (removed.occurrenceId) { const o = S.occurrences.find(x => x.id === removed.occurrenceId); if (o) o.scheduled = null; }
      commit();
      UI.toast('Atividade excluída.', 'ok', { label: 'Desfazer', onClick: () => { D.ensureDay(k).push(removed); if (removed.occurrenceId) { const o = S.occurrences.find(x => x.id === removed.occurrenceId); if (o) o.scheduled = { date: k, blockId: removed.id }; } commit(); } });
    }, { danger: true, okLabel: 'Excluir' });
  },
  agMore({ id }) {
    const k = Agenda.day();
    const b = D.dayBlocks(k).find(x => x.id === id); if (!b) return;
    const delay = min => () => {
      const x = D.findBlock(k, id);
      const s = U.toMin(x.start) + min, e = U.toMin(x.end) + min;
      if (e > 1439) { UI.toast('Não é possível adiar além do fim do dia.', 'error'); return; }
      x.start = U.fromMin(s); x.end = U.fromMin(e);
      const moved = D.reflow(k, id); commit(); Agenda.afterReflow(k, moved);
    };
    UI.sheet(b.title, [
      { label: 'Editar', icon: 'edit', onClick: () => Actions.agEdit({ id }) },
      b.status === 'andamento' ? { label: 'Marcar como pendente', icon: 'undo', onClick: () => Actions.agStatus({ id, s: 'pendente' }) }
        : { label: 'Começar agora', hint: 'Marca como em andamento', icon: 'play', onClick: () => Actions.agStatus({ id, s: 'andamento' }) },
      { label: 'Cancelar atividade', icon: 'x', onClick: () => Actions.agStatus({ id, s: 'cancelada' }) },
      { sep: true },
      { label: 'Adiar 15 minutos', hint: 'Desloca as seguintes, preservando o intervalo', icon: 'clock', onClick: delay(15) },
      { label: 'Adiar 30 minutos', hint: 'Desloca as seguintes, preservando o intervalo', icon: 'clock', onClick: delay(30) },
      { label: 'Mover para o próximo dia útil', hint: U.fmtLong(D.nextWorkday(k)), icon: 'arrow', onClick: () => { D.moveBlock(k, id, D.nextWorkday(k)); commit(); UI.toast('Atividade movida para o próximo dia útil.'); } },
      { label: 'Mover para outra data…', icon: 'calendar', onClick: () => Agenda.moveDialog(k, b) },
      { label: 'Duplicar', icon: 'plus', onClick: () => { const arr = D.ensureDay(k); const x = arr.find(y => y.id === id); arr.push({ ...x, id: U.uid(), routineId: null, occurrenceId: null, status: 'pendente' }); commit(); } },
      { sep: true },
      { label: 'Excluir', icon: 'trash', danger: true, onClick: () => Actions.agDelete({ id }) },
    ]);
  },
  agMenu() {
    const k = Agenda.day();
    const late = D.dayBlocks(k).filter(b => D.blockLate(b, k));
    UI.sheet('Reorganizar o dia', [
      { label: `Mover atrasadas para o próximo dia útil (${late.length})`, hint: 'Mantém o horário original no novo dia', icon: 'arrow', onClick: () => { if (!late.length) return UI.toast('Não há atividades atrasadas.', 'warn'); const to = D.nextWorkday(k); late.forEach(b => D.moveBlock(k, b.id, to)); commit(); UI.toast(`${U.plural(late.length, 'atividade movida', 'atividades movidas')} para ${U.fmtShort(to)}.`); } },
      { label: 'Encaixar um imprevisto', icon: 'alert', onClick: () => Actions.agImprevisto() },
      { sep: true },
      { label: 'Restaurar rotina padrão neste dia', hint: 'Descarta as alterações feitas neste dia', icon: 'undo', danger: true, onClick: () => UI.confirm('Restaurar a rotina padrão? As alterações e status deste dia serão perdidos.', () => { delete S.days[k]; S.occurrences.forEach(o => { if (o.scheduled && o.scheduled.date === k) o.scheduled = null; }); commit(); }, { danger: true, okLabel: 'Restaurar' }) },
      { label: 'Limpar todas as atividades do dia', icon: 'trash', danger: true, onClick: () => UI.confirm('Remover todas as atividades deste dia?', () => { S.days[k] = []; S.occurrences.forEach(o => { if (o.scheduled && o.scheduled.date === k) o.scheduled = null; }); commit(); }, { danger: true, okLabel: 'Limpar' }) },
    ]);
  },
  agImprevisto() { Occ.form(null, { scheduleAfter: true }); },
  /* Intervalo flexível: marca o almoço agora (ou no horário escolhido) e empurra o que vem depois */
  agBreak() {
    const k = Agenda.day(), t = U.today();
    const start = k === t ? U.fromMin(Math.round(U.nowMin() / 5) * 5) : S.settings.breakStart || '12:00';
    UI.form({
      title: 'Intervalo',
      submitLabel: 'Marcar intervalo',
      fields: [
        { name: 'start', label: 'Início', type: 'time', value: start, required: true, half: true },
        { name: 'dur', label: 'Duração', type: 'select', options: [[30, '30 min'], [45, '45 min'], [60, '1 hora'], [90, '1h30'], [120, '2 horas']], value: S.settings.breakDur || 60, half: true },
        { name: 'reflow', label: 'Empurrar as atividades seguintes para depois do intervalo', type: 'checkbox', value: true },
      ],
      onSubmit(v) {
        const s = U.toMin(v.start), end = U.fromMin(s + Number(v.dur));
        const day = D.ensureDay(k);
        const b = { id: U.uid(), title: 'Intervalo', start: v.start, end, category: 'intervalo', priority: 'baixa', status: 'pendente', notes: '', fixed: true };
        day.push(b);
        // Atividade em andamento que atravessa o intervalo é encurtada até o início dele
        const moved = v.reflow ? D.reflow(k, b.id) : 0;
        commit();
        UI.toast(`Intervalo das ${v.start} às ${end}.${moved ? ` ${U.plural(moved, 'atividade deslocada', 'atividades deslocadas')}.` : ''}`);
        if (moved) Agenda.afterReflow(k, 0);
      },
    });
  },
});

</script>
  <script>/* js/views/imprevistos.js */
'use strict';
/* Gestão de imprevistos — ocorrências que exigem atenção imediata */
Views.imprevistos = {
  title: 'Imprevistos', icon: 'alert', nav: 'Imprevistos',
  fab: { act: 'occNew', label: 'Registrar imprevisto' },
  render() {
    const f = App.ui.occFilter || 'abertas';
    const all = S.occurrences;
    const list = all.filter(o => f === 'todas' ? true : f === 'abertas' ? OPEN(o.status) : !OPEN(o.status))
      .sort((a, b) => (OPEN(b.status) - OPEN(a.status)) || (D.occLate(b) - D.occLate(a)) || PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority] || (b.date + b.time).localeCompare(a.date + a.time));
    const nOpen = all.filter(o => OPEN(o.status)).length;
    const tab = (v, l, n) => `<button class="tab ${f === v ? 'active' : ''}" data-act="occFilter" data-v="${v}">${l} <span>${n}</span></button>`;

    const card = o => {
      const dl = D.deadline(o.dueDate, o.dueTime, !OPEN(o.status));
      const sch = o.scheduled && o.scheduled.date ? (S.days[o.scheduled.date] || []).find(b => b.id === o.scheduled.blockId) : null;
      return `<div class="occ card prio-border-${o.priority} ${D.occLate(o) ? 'late' : ''} ${OPEN(o.status) ? '' : 'closed'}">
        <div class="occ-h"><h3>${U.esc(o.title)}</h3>${H.demo(o)}<span class="grow"></span>${H.prio(o.priority)} ${H.status(o.status)}</div>
        <div class="occ-meta">
          <span>${U.icon('clock', 14)} Registrado ${U.fmtDate(o.date)} ${o.time || ''}</span>
          ${o.responsible ? `<span>${U.icon('user', 14)} ${U.esc(o.responsible)}</span>` : ''}
          ${o.dueDate ? `<span>${U.icon('flag', 14)} Prazo ${U.fmtDate(o.dueDate)} ${o.dueTime || ''}</span>` : ''}
          ${H.deadline(dl)}
        </div>
        ${o.description ? `<p>${U.esc(o.description)}</p>` : ''}
        ${o.notes ? `<p class="muted small"><strong>Obs.:</strong> ${U.esc(o.notes)}</p>` : ''}
        ${sch ? `<p class="small sched">${U.icon('calendar', 14)} Na agenda: ${U.fmtDate(o.scheduled.date)}, ${sch.start}–${sch.end} · <a class="link" href="#agenda" data-act="goAgenda" data-d="${o.scheduled.date}">abrir</a></p>` : ''}
        <div class="occ-actions">
          ${OPEN(o.status) ? `<button class="btn sm" data-act="occSchedule" data-id="${o.id}">${U.icon('calendar', 15)} ${sch ? 'Reagendar' : 'Encaixar na agenda'}</button>
          ${o.status === 'pendente' ? `<button class="btn sm ghost" data-act="occStatus" data-id="${o.id}" data-s="andamento">${U.icon('play', 13)} Iniciar</button>` : ''}
          <button class="btn sm ghost ok-text" data-act="occStatus" data-id="${o.id}" data-s="concluida">${U.icon('check', 15)} Resolver</button>`
          : `<button class="btn sm ghost" data-act="occStatus" data-id="${o.id}" data-s="pendente">${U.icon('undo', 15)} Reabrir</button>`}
          <span class="grow"></span>
          <button class="icon-btn" data-act="occEdit" data-id="${o.id}" title="Editar">${U.icon('edit', 16)}</button>
          <button class="icon-btn" data-act="occDelete" data-id="${o.id}" title="Excluir">${U.icon('trash', 16)}</button>
        </div>
      </div>`;
    };

    return `
    <div class="toolbar">
      <div class="tabs">${tab('abertas', 'Abertos', nOpen)}${tab('encerradas', 'Encerrados', all.length - nOpen)}${tab('todas', 'Todos', all.length)}</div>
    </div>
    <p class="muted small">Registre aqui demandas urgentes que exigem sua atenção imediata. Use <strong>Encaixar na agenda</strong> para reservar um horário e reorganizar o dia automaticamente.</p>
    <div class="occ-list">${list.length ? list.map(card).join('') : H.empty(f === 'abertas' ? 'Nenhum imprevisto em aberto.' : 'Nenhum registro.')}</div>`;
  },
};

const Occ = {
  form(o, { scheduleAfter = false } = {}) {
    const isNew = !o;
    o = o || { priority: 'urgente', status: 'pendente', date: U.today(), time: U.nowTime() };
    const fields = [
      { name: 'title', label: 'Título', required: true, value: o.title },
      { name: 'description', label: 'Descrição', type: 'textarea', value: o.description },
      { name: 'priority', label: 'Prioridade', type: 'select', options: H.prioOptions(), value: o.priority, half: true },
      { name: 'status', label: 'Status', type: 'select', options: H.statusOptions(), value: o.status, half: true },
      { name: 'date', label: 'Data da ocorrência', type: 'date', required: true, value: o.date, half: true },
      { name: 'time', label: 'Horário', type: 'time', value: o.time, half: true },
      { name: 'dueDate', label: 'Prazo', type: 'date', value: o.dueDate, half: true },
      { name: 'dueTime', label: 'Horário limite', type: 'time', value: o.dueTime, half: true },
      { name: 'responsible', label: 'Responsável', value: o.responsible, list: D.techNames(), placeholder: 'Você ou alguém da equipe' },
      { name: 'notes', label: 'Observações', type: 'textarea', rows: 2, value: o.notes },
    ];
    if (isNew) fields.push({ name: 'schedule', label: 'Encaixar na agenda após salvar', type: 'checkbox', value: scheduleAfter });
    UI.form({
      title: isNew ? 'Registrar imprevisto' : 'Editar imprevisto',
      fields,
      onSubmit(v) {
        const { schedule, ...data } = v;
        let target = o;
        if (isNew) { target = { id: U.uid(), createdAt: new Date().toISOString(), scheduled: null, ...data }; S.occurrences.push(target); }
        else Object.assign(target, data);
        Occ.syncBlock(target);
        commit();
        UI.toast(isNew ? 'Imprevisto registrado.' : 'Imprevisto atualizado.');
        if (schedule) setTimeout(() => Agenda.scheduleDialog(target), 200);
      },
    });
  },
  syncBlock(o) {
    if (!o.scheduled) return;
    const b = (S.days[o.scheduled.date] || []).find(x => x.id === o.scheduled.blockId);
    if (!b) return;
    b.title = 'Imprevisto: ' + o.title; b.priority = o.priority;
    if (o.status === 'concluida' && b.status !== 'concluida') b.status = 'concluida';
    if (o.status === 'cancelada') b.status = 'cancelada';
  },
};

Object.assign(Actions, {
  occFilter({ v }) { App.ui.occFilter = v; App.render(); },
  occNew() { Occ.form(null); },
  occEdit({ id }) { Occ.form(S.occurrences.find(o => o.id === id)); },
  occSchedule({ id }) { Agenda.scheduleDialog(S.occurrences.find(o => o.id === id)); },
  occStatus({ id, s }) {
    const o = S.occurrences.find(x => x.id === id); if (!o) return;
    o.status = s; if (s === 'concluida') o.resolvedAt = new Date().toISOString();
    Occ.syncBlock(o); commit();
    if (s === 'concluida') UI.toast('Imprevisto resolvido.');
  },
  occDelete({ id }) {
    const o = S.occurrences.find(x => x.id === id);
    UI.confirm(`Excluir o imprevisto <strong>${U.esc(o.title)}</strong>?${o.scheduled ? '<br><small class="muted">O horário reservado na agenda também será removido.</small>' : ''}`, () => {
      if (o.scheduled && S.days[o.scheduled.date]) S.days[o.scheduled.date] = S.days[o.scheduled.date].filter(b => b.id !== o.scheduled.blockId);
      S.occurrences = S.occurrences.filter(x => x.id !== id); commit(); UI.toast('Imprevisto excluído.');
    }, { danger: true, okLabel: 'Excluir' });
  },
});

  <script>/* js/views/mensal.js */
'use strict';
/* Compromissos e reuniões (S.events): formulário, visualização, registro com IA */
const Events = {
  /* Pauta guardada como lista; no formulário, um assunto por linha (mantém os ids dos que já existiam) */
  pautaFromText(txt, old = []) {
    return txt.split('\n').map(l => l.trim()).filter(Boolean).map(text => { const o = old.find(x => x.text === text); return { id: o ? o.id : U.uid(), text }; });
  },
  form(e, date, opts = {}) {
    const isNew = !e;
    e = e || { date: date || U.today(), reuniao: !!opts.reuniao };
    const meet = Meetings.isMeeting(e);
    const noun = meet ? 'reunião' : 'compromisso';
    const pend = Events.pendencias(e.id);
    const pautaIA = IA.supported() ? `<div class="pauta-ia"><span class="lbl">${U.icon('spark', 15)} Gerar pauta com IA</span>
      <div class="inline-add"><input name="pautaTema" placeholder="Sobre o que é a reunião? Ex.: escala de fim de ano, metas do mês, novo colaborador"><button type="button" class="btn sm primary" data-pauta-ia>Gerar</button></div>
      ${pend.length ? `<label class="check small"><input type="checkbox" name="pautaPend" checked> <span>Incluir ${U.plural(pend.length, 'assunto pendente', 'assuntos pendentes')} das últimas reuniões</span></label>` : ''}</div>` : '';
    const m = UI.form({
      title: isNew ? (meet ? 'Nova reunião' : 'Novo compromisso') : `Editar ${noun}`,
      fields: [
        { name: 'title', label: meet ? 'Reunião' : 'Compromisso', required: true, value: e.title, placeholder: meet ? 'Ex.: Alinhamento semanal da equipe' : 'Ex.: Visita ao cliente' },
        { name: 'date', label: 'Data', type: 'date', required: true, value: e.date, half: true },
        { name: 'time', label: 'Horário', type: 'time', value: e.time, half: true },
        ...(meet && pautaIA ? [{ type: 'html', html: pautaIA }] : []),
        { name: 'pauta', label: meet ? 'Pauta' : 'Pauta (se for reunião)', type: 'textarea', rows: meet ? 4 : 2, value: (e.pautas || []).map(x => x.text).join('\n'), placeholder: 'Um assunto por linha', hint: 'Depois da reunião, abra-a e toque em “Registrar reunião” para marcar o que foi tratado e anotar os combinados.' },
        { name: 'notes', label: 'Observações', type: 'textarea', rows: 2, value: e.notes },
        ...(isNew ? [{ name: 'toAgenda', label: 'Adicionar também na agenda do dia (30 min)', type: 'checkbox', value: false }] : []),
      ],
      extra: isNew ? [] : [{ label: `${U.icon('trash', 15)} Excluir`, cls: 'ghost danger-text', onClick: (_, m) => { m.close(); S.events = S.events.filter(x => x.id !== e.id); commit(); UI.toast(meet ? 'Reunião excluída.' : 'Compromisso excluído.'); } }],
      validate: v => v.toAgenda && !v.time ? 'Informe o horário para adicionar à agenda.' : null,
      onSubmit(v) {
        const { toAgenda, pauta, ...data } = v;
        data.pautas = Events.pautaFromText(pauta, e.pautas || []);
        if (e.reuniao || data.pautas.length) data.reuniao = true;
        if (isNew) S.events.push({ id: U.uid(), ...data }); else Object.assign(e, data);
        if (toAgenda) D.ensureDay(v.date).push({ id: U.uid(), title: v.title, start: v.time, end: U.fromMin(U.toMin(v.time) + 30), category: data.reuniao ? 'equipe' : 'administrativo', priority: 'media', status: 'pendente', notes: v.notes, fixed: true });
        commit(); UI.toast(data.reuniao ? 'Reunião salva.' : 'Compromisso salvo.');
      },
    });
    const gen = m.el.querySelector('[data-pauta-ia]');
    if (gen) gen.onclick = async () => {
      const f = m.el.querySelector('form'), tema = f.elements.pautaTema.value.trim();
      const usePend = f.elements.pautaPend ? f.elements.pautaPend.checked : false;
      if (!tema && !usePend) { UI.toast('Escreva o tema da reunião.', 'warn'); f.elements.pautaTema.focus(); return; }
      if (!IA.key()) { UI.toast('Cole a sua chave da IA em Configurações → IA.', 'warn'); return; }
      gen.disabled = true; gen.innerHTML = '<span class="spinner"></span>';
      try {
        const itens = await IA.pauta({ title: f.elements.title.value, tema: tema || 'Retomar os assuntos pendentes.', pendencias: usePend ? pend : [] });
        const cur = f.elements.pauta.value.split('\n').map(x => x.trim()).filter(Boolean);
        f.elements.pauta.value = [...cur, ...itens.filter(i => !cur.includes(i))].join('\n');
        UI.toast(`Pauta com ${U.plural(itens.length, 'assunto')}. Ajuste à vontade.`);
      } catch (err) { UI.toast(U.esc(err.message), 'error'); }
      gen.disabled = false; gen.textContent = 'Gerar';
    };
  },

  /* Detalhes: pauta, registro da reunião e ações */
  view(e) {
    const r = e.registro, pautas = e.pautas || [];
    const done = id => r && r.tratadas.includes(id);
    const meet = Meetings.isMeeting(e);
    const m = UI.modal({
      title: e.title,
      body: `
        <p class="muted">${U.fmtLong(e.date)}${e.time ? `, às ${e.time}` : ''}${H.demo(e)}</p>
        ${e.notes ? `<p class="pre">${U.esc(e.notes)}</p>` : ''}
        ${pautas.length ? `<h4>Pauta</h4><ul class="pauta">${pautas.map(x => `<li class="${r ? (done(x.id) ? 'ok' : 'no') : ''}">${r ? U.icon(done(x.id) ? 'check' : 'x', 15) : '<i></i>'}<span>${U.esc(x.text)}</span></li>`).join('')}</ul>` : ''}
        ${r ? `<h4>Registro da reunião</h4><p class="muted small">Registrada em ${U.fmtDateTime(r.at)}${pautas.length ? `. ${r.tratadas.length} de ${U.plural(pautas.length, 'assunto')} tratados.` : '.'}</p>
          ${r.ata || r.resumo ? `<div class="ata-doc"><p class="ata pre">${U.esc(r.ata || r.resumo)}</p><div class="row-actions wrap"><button class="btn sm" data-copy>${U.icon('check', 14)} Copiar ata</button><button class="btn sm" data-share>${U.icon('upload', 14)} Compartilhar</button></div></div>` : ''}
          <h4>Combinados</h4>${r.combinados ? `<p class="ata pre">${U.esc(r.combinados)}</p>` : '<p class="muted">Nada anotado como combinado.</p>'}
          ${r.transcricao ? `<details class="tx"><summary>Ver transcrição</summary><p class="ata pre small">${U.esc(r.transcricao)}</p></details>` : ''}`
          : `<p class="muted small mt">${Meetings.passed(e) ? 'Toque em <strong>Registrar reunião</strong> para marcar o que foi tratado e anotar os combinados.' : 'Na hora da reunião, toque em <strong>Iniciar reunião</strong>: grave e acompanhe a transcrição ao vivo, marque a pauta e, no fim, a IA preenche os combinados.'}</p>`}`,
      footer: `<button class="btn ghost" data-ed>${U.icon('edit', 15)} Editar</button><span class="grow"></span><button class="btn ${meet || r ? 'primary' : ''}" data-reg>${r ? `${U.icon('edit', 15)} Editar registro` : Meetings.passed(e) ? `${U.icon('check', 15)} Registrar reunião` : `${U.icon('mic', 15)} Iniciar reunião`}</button>`,
    });
    m.el.querySelector('[data-ed]').onclick = () => { m.close(); Events.form(e); };
    const reg = m.el.querySelector('[data-reg]'); if (reg) reg.onclick = () => { m.close(); Events.register(e); };
    const txt = r && (r.ata || r.resumo);
    const cp = m.el.querySelector('[data-copy]'); if (cp) cp.onclick = () => Events.copy(txt);
    const sh = m.el.querySelector('[data-share]'); if (sh) sh.onclick = () => Events.share(txt, `Ata: ${e.title}`);
  },

  async copy(text) {
    try { await navigator.clipboard.writeText(text); }
    catch (err) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    UI.toast('Ata copiada.');
  },
  async share(text, title) {
    try {
      if (Native.available()) { await Native.P().Share.share({ title, text, dialogTitle: 'Compartilhar ata' }); return; }
      if (navigator.share) { await navigator.share({ title, text }); return; }
    } catch (err) { if (/cancel|abort/i.test(String(err && (err.message || err.name)))) return; }
    Events.copy(text);
  },

  /* Assuntos pendentes: itens de pauta não tratados nas últimas reuniões registradas */
  pendencias(exceptId) {
    return S.events.filter(x => x.registro && x.id !== exceptId && x.date >= U.addDays(U.today(), -60))
      .sort((a, b) => b.date.localeCompare(a.date)).slice(0, 2)
      .flatMap(x => (x.pautas || []).filter(p => !x.registro.tratadas.includes(p.id)).map(p => p.text));
  },

  /* Reunião: antes/durante (gravar e transcrever ao vivo, marcar a pauta) e depois (registro).
     A IA preenche combinados e resumo a partir da transcrição e das anotações. */
  register(e) {
    const r = e.registro || { tratadas: [], combinados: '', resumo: '' };
    const pautas = e.pautas || [];
    const live = !e.registro;
    let dirty = false, warned = false;
    Recorder.reset();
    const iaBox = !IA.supported() ? '' : `<div class="ia-box">
        <div class="ia-h">${U.icon('spark', 17)}<strong>${live ? 'Gravar e transcrever ao vivo' : 'Preencher com IA'}</strong></div>
        ${IA.key() ? '' : `<div class="ia-keyrow"><label for="ia-inline">Primeiro, cole a sua chave da IA (só uma vez ${Native.available() ? 'neste celular' : 'neste navegador'})</label>
          <div class="inline-add"><input id="ia-inline" name="iaKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Chave do AI Studio"><button type="button" class="btn sm primary" data-ia-save>Salvar chave</button></div></div>`}
        ${Recorder.supported() ? `<div class="ia-actions"><button type="button" class="btn primary rec-btn" data-rec>${U.icon('mic', 16)} Iniciar gravação</button><span class="rec-st small"></span></div>
        <div class="live" hidden><div class="live-h"><span class="rec-dot"></span><strong>Transcrição</strong><small class="live-st muted"></small></div><div class="live-txt" aria-live="polite"></div></div>` : ''}
        <textarea name="iaNotas" rows="2" placeholder="Anotações suas (opcional). Dá para ditar pelo microfone do teclado."></textarea>
        <div class="ia-actions"><span class="muted small grow">${Recorder.supported() ? 'Ao encerrar a gravação, a IA preenche tudo sozinha.' : ''}</span><button type="button" class="btn sm" data-ia>${U.icon('spark', 15)} Preencher com IA</button></div>
        <p class="ia-msg small" hidden></p>
      </div>`;
    const m = UI.form({
      title: e.title,
      submitLabel: 'Salvar registro',
      canClose: () => {
        if (Recorder.recording()) { UI.toast('A gravação está em andamento. Toque em “Encerrar gravação” antes de sair.', 'warn'); return false; }
        if ((Recorder.text() || dirty) && !warned) { warned = true; UI.toast('O registro ainda não foi salvo. Toque de novo para sair sem salvar.', 'warn'); return false; }
        return true;
      },
      onClose: () => { if (Recorder.recording()) Recorder.stop(); Recorder.reset(); },
      fields: [
        { type: 'html', html: `<p class="muted small">${U.fmtLong(e.date)}${e.time ? `, às ${e.time}` : ''}${live && pautas.length ? '. Marque os assuntos conforme forem tratados.' : ''}</p>${iaBox}` },
        ...(pautas.length ? [{ type: 'html', html: '<span class="lbl">Pauta: assuntos tratados</span>' }, ...pautas.map(x => ({ name: 'p_' + x.id, label: U.esc(x.text), type: 'checkbox', value: r.tratadas.includes(x.id) }))] : []),
        { name: 'ata', label: 'Ata da reunião', type: 'textarea', rows: 10, value: r.ata || r.resumo || '', placeholder: 'A IA escreve a ata no padrão do seu agente ao encerrar a gravação. Você também pode escrever aqui.' },
        ...(IA.supported() ? [{ type: 'html', html: `<div class="ata-tools"><span class="muted small">Ajustar a ata:</span><button type="button" class="btn sm" data-rw="natural">Natural</button><button type="button" class="btn sm" data-rw="compact">Compactar</button><button type="button" class="btn sm" data-rw="detalhado">Detalhar</button><button type="button" class="btn sm ghost" data-rw-copy>${U.icon('check', 14)} Copiar</button><button type="button" class="btn sm ghost" data-rw-share>${U.icon('upload', 14)} Compartilhar</button></div>` }] : []),
        { name: 'combinados', label: 'Combinados (viram tarefas, se quiser)', type: 'textarea', rows: 4, value: r.combinados, placeholder: 'Um combinado por linha. Ex.: Carlos envia o relatório até sexta' },
        { name: 'mkTasks', label: 'Criar uma tarefa para cada combinado', type: 'checkbox', value: false, hint: 'As tarefas entram em Tarefas, com o nome da reunião na descrição. Ajuste prazo e responsável depois.' },
      ],
      onSubmit(v) {
        if (Recorder.recording()) return 'Encerre a gravação antes de salvar.';
        const tx = Recorder.text() || r.transcricao || '';
        e.registro = { at: new Date().toISOString(), tratadas: pautas.filter(x => v['p_' + x.id]).map(x => x.id), combinados: v.combinados, ata: v.ata, ...(tx ? { transcricao: tx.slice(0, 30000) } : {}) };
        e.reuniao = true;
        warned = true;
        let n = 0;
        if (v.mkTasks) v.combinados.split('\n').map(l => l.replace(/^[-•*\d.)\s]+/, '').trim()).filter(Boolean).forEach(title => {
          n++;
          S.tasks.push({ id: U.uid(), title, description: `Combinado na reunião “${e.title}” (${U.fmtShort(e.date)}).`, category: 'equipe', priority: 'media', status: 'pendente', createdAt: new Date().toISOString(), startDate: U.today(), dueDate: '', dueTime: '', notes: '', completedAt: null });
        });
        commit();
        UI.toast(n ? `Reunião registrada e ${U.plural(n, 'tarefa criada', 'tarefas criadas')}.` : 'Reunião registrada.');
      },
    });
    m.el.querySelector('form').addEventListener('input', () => { dirty = true; });
    m.el.querySelector('form').addEventListener('change', () => { dirty = true; });
    Events.wireIA(m, e, () => { dirty = true; });
  },

  wireIA(m, e, markDirty = () => {}) {
    const el = m.el, f = el.querySelector('form');
    const btnIA = el.querySelector('[data-ia]'); if (!btnIA) return;
    const msg = el.querySelector('.ia-msg'), st = el.querySelector('.rec-st'), btnRec = el.querySelector('[data-rec]');
    const liveBox = el.querySelector('.live'), liveTxt = el.querySelector('.live-txt'), liveSt = el.querySelector('.live-st');
    const say = (t, cls = '') => { msg.hidden = !t; msg.className = 'ia-msg small ' + cls; msg.innerHTML = t; };
    const keySave = el.querySelector('[data-ia-save]');
    if (keySave) keySave.onclick = async () => {
      const k = f.elements.iaKey.value.trim();
      if (!k) { say('Cole a chave no campo acima.', 'err'); return; }
      S.settings.ia = { ...(S.settings.ia || {}), key: k }; commit();
      keySave.disabled = true; say('Testando a chave…');
      try { await IA.test(); el.querySelector('.ia-keyrow').remove(); say('Chave salva e funcionando.', 'ok'); }
      catch (err) { S.settings.ia.key = ''; commit(); keySave.disabled = false; say(U.esc(err.message), 'err'); }
    };
    const needKey = () => { if (IA.key()) return false; say('Cole e salve a sua chave da IA no campo acima primeiro.', 'err'); if (f.elements.iaKey) f.elements.iaKey.focus(); return true; };

    // Atualização ao vivo: tempo, transcrição e trechos na fila
    const update = ({ elapsed, text, pending, failed }) => {
      if (elapsed !== null) st.textContent = Recorder.fmt(elapsed);
      liveBox.hidden = false;
      const atEnd = liveTxt.scrollTop + liveTxt.clientHeight >= liveTxt.scrollHeight - 30;
      liveTxt.textContent = text || (Recorder.recording() ? 'A transcrição aparece aqui a cada ~40 segundos.' : '');
      liveTxt.classList.toggle('muted', !text);
      if (atEnd) liveTxt.scrollTop = liveTxt.scrollHeight;
      liveSt.textContent = [pending ? `transcrevendo ${U.plural(pending, 'trecho')}…` : '', failed ? `${U.plural(failed, 'trecho')} sem transcrição (tenta de novo ao encerrar)` : ''].filter(Boolean).join(' · ');
    };

    const fill = async () => {
      const notes = f.elements.iaNotas.value, transcript = Recorder.text();
      if (needKey()) return;
      if (!notes.trim() && !transcript.trim()) { say('Grave a reunião ou escreva algumas anotações primeiro.', 'err'); return; }
      btnIA.disabled = true; btnIA.innerHTML = `<span class="spinner"></span> Preenchendo…`;
      say('A IA está organizando o registro…');
      try {
        const res = await IA.ata(e, { notes, transcript }); markDirty();
        (e.pautas || []).forEach(x => { const c = f.elements['p_' + x.id]; if (c && res.tratadas.includes(x.id)) c.checked = true; });
        const cur = f.elements.combinados.value.trim();
        f.elements.combinados.value = [cur, ...res.combinados.filter(c => !cur.includes(c))].filter(Boolean).join('\n');
        if (res.ata) f.elements.ata.value = res.ata;
        say(`Pronto: ${(e.pautas || []).length ? `${res.tratadas.length} de ${U.plural(e.pautas.length, 'assunto')} da pauta, ` : ''}${U.plural(res.combinados.length, 'combinado')}. Confira e toque em <strong>Salvar registro</strong>.`, 'ok');
        f.elements.ata.scrollIntoView({ block: 'start', behavior: 'smooth' });
      } catch (err) { say(U.esc(err.message), 'err'); }
      btnIA.disabled = false; btnIA.innerHTML = `${U.icon('spark', 15)} Preencher com IA`;
    };
    btnIA.onclick = fill;

    // Comandos rápidos do agente sobre a ata (/natural, /compact, /detalhado)
    el.querySelectorAll('[data-rw]').forEach(b => b.onclick = async () => {
      const text = f.elements.ata.value.trim();
      if (!text) { say('Gere ou escreva a ata primeiro.', 'err'); return; }
      if (needKey()) return;
      const lbl = b.innerHTML; el.querySelectorAll('[data-rw]').forEach(x => { x.disabled = true; });
      b.innerHTML = '<span class="spinner"></span>';
      try { f.elements.ata.value = (await IA.rewrite(text, b.dataset.rw, Recorder.text() || (e.registro && e.registro.transcricao) || '')).trim(); markDirty(); UI.toast('Ata ajustada.'); }
      catch (err) { UI.toast(U.esc(err.message), 'error'); }
      b.innerHTML = lbl; el.querySelectorAll('[data-rw]').forEach(x => { x.disabled = false; });
    });
    const rc = el.querySelector('[data-rw-copy]'); if (rc) rc.onclick = () => { const t = f.elements.ata.value.trim(); if (t) Events.copy(t); };
    const rs = el.querySelector('[data-rw-share]'); if (rs) rs.onclick = () => { const t = f.elements.ata.value.trim(); if (t) Events.share(t, `Ata: ${e.title}`); };

    if (btnRec) btnRec.onclick = async () => {
      if (Recorder.recording()) {
        btnRec.disabled = true;
        await Recorder.stop();
        btnRec.classList.remove('rec-on'); btnRec.innerHTML = `${U.icon('mic', 16)} Gravar mais`;
        say('Gravação encerrada. Terminando a transcrição…');
        await Recorder.finish();
        btnRec.disabled = false;
        if (Recorder.failed()) say(`${U.plural(Recorder.failed(), 'trecho não pôde', 'trechos não puderam')} ser transcritos (sem internet ou IA sobrecarregada). O restante será usado.`, 'err');
        await fill();
        return;
      }
      if (needKey()) return;
      try {
        await Recorder.start(update);
        btnRec.classList.add('rec-on'); btnRec.innerHTML = `${U.icon('stop', 16)} Encerrar gravação`;
        say(`Gravando. Deixe o celular perto da conversa e ${Native.available() ? 'o app aberto (a tela fica acesa)' : 'esta aba aberta'}. Avise os participantes. Limite: ${Recorder.MAX_MIN} min.`);
      } catch (err) { say('Não foi possível usar o microfone. Permita o acesso ao microfone e tente de novo.', 'err'); }
    };
  },
};

Object.assign(Actions, {
  evNew() { Events.form(null); },
  evEdit({ id }) { Events.form(S.events.find(e => e.id === id)); },
  evView({ id }) { const e = S.events.find(e => e.id === id); if (e) Events.view(e); },
});
