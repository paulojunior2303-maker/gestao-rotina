        <textarea id="ia-agent" name="agente" rows="6" placeholder="Ex.: Atue como meu assistente de documentação…">${U.esc((st.ia && st.ia.agente) || '')}</textarea>
        <div class="field ia-level"><label for="ia-nivel">Nível da ata</label><select id="ia-nivel" name="nivel">${UI.opts([['detalhada', 'Detalhada'], ['compacta', 'Compacta'], ['resumida', 'Resumida']], (st.ia && st.ia.nivel) || 'detalhada')}</select></div>
        <div class="row-actions"><button class="btn sm primary">Salvar instruções</button>${st.ia && st.ia.agente ? `<span class="muted small">${U.plural(st.ia.agente.length, 'caractere')} salvos</span>` : ''}</div>
      </form>
      <details class="ia-help"><summary>Como conseguir a chave</summary><ol class="steps">
        <li>Abra <strong>aistudio.google.com</strong> e entre com sua conta Google.</li>
        <li>Toque em <strong>Get API key</strong> e depois em <strong>Create API key</strong>.</li>
        <li>Copie a chave e cole no campo acima.</li></ol></details>
      <p class="muted small mt">A chave fica guardada nos seus dados (e nos backups). Nada é enviado para a IA sem você tocar em “Preencher com IA”. No plano gratuito, o Google pode usar o conteúdo para melhorar os modelos; ative o faturamento no AI Studio para evitar isso.</p>`)}

    ${sec('jornada', 'Jornada de trabalho', 'Horários usados para alertas de “fora do expediente” e para encaixar imprevistos.', `
      <form class="form-grid cfg-form" data-submit="cfgJornada">
        <div class="field"><label>Entrada</label><input type="time" name="workStart" value="${st.workStart}" required></div>
        <div class="field"><label>Saída</label><input type="time" name="workEnd" value="${st.workEnd}" required></div>
        <div class="field full"><label for="cfg-break">Intervalo de almoço</label><select id="cfg-break" name="breakMode" data-change="cfgBreakMode">${UI.opts([['flexivel', 'Flexível: marco na hora, pela Agenda'], ['fixo', 'Horário fixo todos os dias'], ['nenhum', 'Sem intervalo']], st.breakMode || 'fixo')}</select>
          <small class="hint">${(st.breakMode || 'fixo') === 'flexivel' ? 'Na Agenda, toque em <strong>Intervalo agora</strong> quando for almoçar: as atividades seguintes são empurradas.' : (st.breakMode || 'fixo') === 'fixo' ? 'O intervalo entra na agenda de todos os dias úteis, no horário abaixo.' : 'Nenhum intervalo é colocado na agenda.'}</small></div>
        ${(st.breakMode || 'fixo') === 'fixo' ? `<div class="field"><label>Início do intervalo</label><input type="time" name="breakStart" value="${st.breakStart}"></div>
        <div class="field"><label>Fim do intervalo</label><input type="time" name="breakEnd" value="${st.breakEnd}"></div>` : (st.breakMode || 'fixo') === 'flexivel' ? `<div class="field"><label>Duração do intervalo</label><select name="breakDur">${UI.opts([[30, '30 min'], [45, '45 min'], [60, '1 hora'], [90, '1h30'], [120, '2 horas']], st.breakDur || 60)}</select></div>` : ''}
        <div class="field full"><span class="lbl">Dias de trabalho</span><div class="wd-pick">${[1, 2, 3, 4, 5, 6, 0].map(d => `<label><input type="checkbox" name="workDays" value="${d}" ${st.workDays.includes(d) ? 'checked' : ''}><span>${U.WD_SHORT[d]}</span></label>`).join('')}</div></div>
        <div class="field"><label>Alertar prazos com antecedência de (dias)</label><input type="number" name="alertDays" min="0" max="30" value="${st.alertDays}"></div>
        ${(st.breakMode || 'fixo') === 'fixo' ? '<div class="field full"><label class="check"><input type="checkbox" name="syncBreak" checked> <span>Atualizar também o horário do bloco “Intervalo” na rotina padrão</span></label></div>' : ''}
        <div class="full"><button class="btn primary">Salvar jornada</button></div>
      </form>`)}

    ${sec('rotina', 'Rotina padrão (horários das atividades)', 'Modelo usado para montar a agenda de cada dia útil. Alterações valem para os dias que ainda não foram editados.', `
      <div class="table-wrap"><table class="table">
        <thead><tr><th>Horário</th><th>Atividade</th><th>Categoria</th><th>Prioridade</th><th>Frequência</th><th></th></tr></thead>
        <tbody>${routine.length ? '' : `<tr><td colspan="6" class="rt-empty">Sua rotina está em branco. Toque em <strong>Nova atividade recorrente</strong> para cadastrar o que se repete no seu dia (ex.: alinhamento com a equipe às 08:30).</td></tr>`}${routine.map(r => `<tr><td class="nowrap">${r.start}–${r.end}</td><td>${U.esc(r.title)}${r.fixed ? ' <span class="badge">fixo</span>' : ''}</td><td>${H.cat(r.category)}</td><td>${H.prio(r.priority)}</td><td>${freqTxt(r)}</td>
          <td class="nowrap"><button class="icon-btn xs" data-act="rtEdit" data-id="${r.id}" title="Editar">${U.icon('edit', 14)}</button><button class="icon-btn xs" data-act="rtDel" data-id="${r.id}" title="Excluir">${U.icon('trash', 14)}</button></td></tr>`).join('')}</tbody>
      </table></div>
      <div class="row-actions"><button class="btn sm" data-act="rtNew">${U.icon('plus', 15)} Nova atividade recorrente</button>${routine.length ? `<button class="btn sm ghost danger-text" data-act="rtClear">${U.icon('trash', 15)} Limpar rotina</button>` : ''}</div>`)}

    ${sec('categorias', 'Categorias de atividades', 'Usadas na agenda e nas tarefas. A cor identifica a categoria em todo o aplicativo.', `
      <div class="cfg-list">${st.categories.map(c => `<div class="cfg-item"><input type="color" value="${c.color}" data-change="catColor" data-id="${c.id}" aria-label="Cor"><input type="text" value="${U.esc(c.name)}" data-change="catName" data-id="${c.id}" aria-label="Nome"><button class="icon-btn xs" data-act="catDel" data-id="${c.id}" title="Excluir">${U.icon('trash', 14)}</button></div>`).join('')}</div>
      <form class="inline-add" data-submit="catAdd"><input type="color" name="color" value="#0ea5e9"><input name="name" placeholder="Nova categoria…" required><button class="btn sm">${U.icon('plus', 15)} Adicionar</button></form>`)}

    ${sec('prioridades', 'Prioridades e status', 'Você pode renomear e mudar as cores. Os quatro níveis são fixos porque orientam alertas e ordenação.', `
      <div class="grid-2 tight">
        <div><h4>Prioridades</h4><div class="cfg-list">${['baixa', 'media', 'alta', 'urgente'].map(k => `<div class="cfg-item"><input type="color" value="${st.priorities[k].color}" data-change="prColor" data-k="${k}"><input type="text" value="${U.esc(st.priorities[k].label)}" data-change="prLabel" data-k="${k}"></div>`).join('')}</div></div>
        <div><h4>Status</h4><div class="cfg-list">${['pendente', 'andamento', 'concluida', 'cancelada'].map(k => `<div class="cfg-item"><input type="color" value="${st.statuses[k].color}" data-change="stColor" data-k="${k}"><input type="text" value="${U.esc(st.statuses[k].label)}" data-change="stLabel" data-k="${k}"></div>`).join('')}</div></div>
      </div>`)}

    ${sec('tecnicos', 'Equipe', 'As pessoas da sua equipe: usadas como responsáveis, nos feedbacks e na produtividade individual.', `
      <div class="cfg-list">${st.technicians.length ? st.technicians.map(t => `<div class="cfg-item"><input type="text" value="${U.esc(t.name)}" data-change="tecName" data-id="${t.id}">${H.demo(t)}<button class="icon-btn xs" data-act="tecDel" data-id="${t.id}">${U.icon('trash', 14)}</button></div>`).join('') : '<p class="muted small">Ninguém cadastrado ainda.</p>'}</div>
      <form class="inline-add" data-submit="tecAdd"><input name="name" placeholder="Nome da pessoa…" required><button class="btn sm">${U.icon('plus', 15)} Adicionar</button></form>`)}

    ${!st.showIndicadores ? '' : sec('metas', 'Indicadores e metas', 'Dê aos indicadores os nomes que fazem sentido para a sua equipe. As metas são comparadas com os dados lançados em Indicadores, tarefas e projetos.', `
      <div class="metric-names">${METRICS.map(m => `<label class="field"><span class="lbl">Indicador ${METRICS.indexOf(m) + 1}</span><input type="text" value="${U.esc(m.label)}" placeholder="${U.esc(METRIC_DEFAULT_NAMES[m.key])}" data-change="cfgMetricName" data-k="${m.key}" maxlength="40"></label>`).join('')}</div>
      ${st.goals.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Meta</th><th>Indicador</th><th>Período</th><th>Alvo</th><th></th></tr></thead><tbody>${st.goals.map(g => `<tr><td>${U.esc(g.name || '—')}${H.demo(g)}</td><td>${metricLabel(g.metric)}</td><td>${g.period}</td><td>${g.direction === 'max' ? 'no máximo' : 'no mínimo'} ${g.target}</td><td class="nowrap"><button class="icon-btn xs" data-act="goalEdit" data-id="${g.id}">${U.icon('edit', 14)}</button><button class="icon-btn xs" data-act="goalDel" data-id="${g.id}">${U.icon('trash', 14)}</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted small">Nenhuma meta cadastrada.</p>'}
      <div class="row-actions"><button class="btn sm" data-act="goalNew">${U.icon('plus', 15)} Nova meta</button></div>`)}

    ${sec('dados', 'Dados e armazenamento', `Os dados ficam salvos ${Guide.whereData()} (~${lsSize} KB)${Drive.connected() ? ' e sincronizados com o seu Google Drive.' : '. Cada versão (app Android, site) guarda os seus próprios dados; conecte o Google Drive (acima) para deixá-los iguais.'}`, `
      <h4>Levar dados para outra versão ou aparelho</h4>
      <p class="muted small">Gera um <strong>código de texto</strong> com todos os seus dados. Mande para você mesmo (WhatsApp, e-mail, Keep) e cole na outra versão.</p>
      <div class="row-actions wrap">
        <button class="btn primary" data-act="xferOut">${U.icon('arrow', 15)} Enviar meus dados</button>
        <button class="btn" data-act="xferIn">${U.icon('download', 15)} Receber dados</button>
      </div>
      <h4>Backup em arquivo</h4>
      <div class="row-actions wrap">
        <button class="btn" data-act="dataExport">${U.icon('download', 15)} Exportar backup (arquivo)</button>
        <label class="btn">${U.icon('upload', 15)} Importar backup<input type="file" data-change="dataImport" hidden></label>
      </div>
      <h4>Dados de demonstração</h4>
      <p class="muted small">Exemplos marcados com “[Exemplo]” e o selo EXEMPLO, para conhecer o aplicativo. Não representam sua operação.</p>
      <div class="row-actions wrap">
        ${Store.hasDemo() ? `<button class="btn warn" data-act="demoRemove">${U.icon('trash', 15)} Remover dados de demonstração</button>` : `<button class="btn" data-act="demoLoad">${U.icon('plus', 15)} Carregar dados de demonstração</button>`}
      </div>
      <h4>Ajuda</h4>
      <div class="row-actions wrap"><button class="btn" data-act="tourOpen">${U.icon('play', 14)} Rever tutorial</button><a class="btn" href="#guia">${U.icon('info', 15)} Abrir guia de uso</a></div>
      <h4>Zona de risco</h4>
      <div class="row-actions"><button class="btn danger" data-act="dataReset">${U.icon('trash', 15)} Apagar todos os dados</button></div>`)}`;
  },
};

const Routine = {
  form(r) {
    const isNew = !r;
    r = r || { start: '08:00', end: '08:30', category: 'administrativo', priority: 'media', freq: 'semanal', days: [...S.settings.workDays], monthDay: 1 };
    UI.form({
      title: isNew ? 'Nova atividade recorrente' : 'Editar atividade da rotina',
      fields: [
        { name: 'title', label: 'Atividade', required: true, value: r.title },
        { name: 'start', label: 'Início', type: 'time', required: true, value: r.start, half: true },
        { name: 'end', label: 'Fim', type: 'time', required: true, value: r.end, half: true },
        { name: 'category', label: 'Categoria', type: 'select', options: H.catOptions(), value: r.category, half: true },
        { name: 'priority', label: 'Prioridade', type: 'select', options: H.prioOptions(), value: r.priority, half: true },
        { name: 'freq', label: 'Frequência', type: 'select', options: [['semanal', 'Dias da semana selecionados'], ['mensal', 'Mensal (um dia do mês)']], value: r.freq, half: true },
        { name: 'monthDay', label: 'Dia do mês', type: 'number', min: 1, max: 31, value: r.monthDay, half: true, showIf: 'freq=mensal', hint: 'Só aparece se o dia for útil.' },
        { name: 'days', label: 'Repetir em', type: 'weekdays', value: r.days, showIf: 'freq=semanal', hint: 'Somente os dias marcados como dias de trabalho exibem a rotina.' },
        { name: 'fixed', label: 'Horário fixo (não é deslocado na reorganização)', type: 'checkbox', value: r.fixed },
        { name: 'notes', label: 'Observações', type: 'textarea', rows: 2, value: r.notes },
      ],
      validate: v => U.toMin(v.end) <= U.toMin(v.start) ? 'O horário de fim deve ser depois do início.' : (v.freq === 'semanal' && !v.days.length ? 'Selecione ao menos um dia.' : (v.freq === 'mensal' && !(v.monthDay >= 1 && v.monthDay <= 31) ? 'Informe um dia do mês entre 1 e 31.' : null)),
      onSubmit(v) {
        if (isNew) S.routine.push({ id: U.uid(), ...v }); else Object.assign(r, v);
        commit(); UI.toast('Rotina atualizada. Vale para os dias ainda não editados.');
      },
    });
  },
};

const Goals = {
  form(g) {
    const isNew = !g;
    g = g || { metric: 'pontosCamera', period: 'semanal', direction: 'min', target: null };
    UI.form({
      title: isNew ? 'Nova meta' : 'Editar meta',
      fields: [
        { name: 'name', label: 'Nome da meta (opcional)', value: g.name },
        { name: 'metric', label: 'Indicador', type: 'select', options: GOAL_METRICS.map(m => [m.key, m.label]), value: g.metric, half: true },
        { name: 'period', label: 'Período', type: 'select', options: [['diaria', 'Diária'], ['semanal', 'Semanal'], ['mensal', 'Mensal']], value: g.period, half: true },
        { name: 'direction', label: 'Tipo', type: 'select', options: [['min', 'Atingir no mínimo'], ['max', 'Manter no máximo (ex.: retrabalhos)']], value: g.direction, half: true },
        { name: 'target', label: 'Valor alvo', type: 'number', min: 0, required: true, value: g.target, half: true },
      ],
      onSubmit(v) { if (isNew) S.settings.goals.push({ id: U.uid(), ...v }); else Object.assign(g, v); commit(); },
    });
  },
};

Object.assign(Actions, {
  cfgJump({ id }) {
    if (App.route !== 'config') { App.ui.cfgJump = id; App.go('config'); return; }
    document.getElementById('cfg-' + id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  async iaSave(_, form) {
    const k = form.elements.key.value.trim();
    if (!k) { UI.toast('Cole a chave antes de salvar.', 'warn'); return; }
    S.settings.ia = { ...(S.settings.ia || {}), key: k }; commit();
    UI.toast('Chave salva. Testando…');
    try { await IA.test(); UI.toast('IA funcionando.'); } catch (e) { UI.toast(U.esc(e.message), 'error'); }
  },
  async iaTest(_, el) {
    el.disabled = true;
    try { await IA.test(); UI.toast('IA funcionando.'); } catch (e) { UI.toast(U.esc(e.message), 'error'); }
    el.disabled = false;
  },
  iaRemove() { UI.confirm('Remover a chave da IA deste app?', () => { S.settings.ia = { ...(S.settings.ia || {}), key: '' }; commit(); UI.toast('Chave removida.'); }, { okLabel: 'Remover', danger: true }); },
  iaAgentSave(_, form) {
    S.settings.ia = { ...(S.settings.ia || {}), agente: form.elements.agente.value.trim(), nivel: form.elements.nivel.value };
    commit(); UI.toast(S.settings.ia.agente ? 'Instruções do agente salvas.' : 'Usando o estilo padrão.');
  },
  iaShow(_, el) { const i = el.closest('.ia-key').querySelector('input'); i.type = i.type === 'password' ? 'text' : 'password'; },
  cfgBreakMode(_, el) { S.settings.breakMode = el.value; commit(); UI.toast(el.value === 'flexivel' ? 'Intervalo flexível: marque pela Agenda.' : el.value === 'fixo' ? 'Intervalo em horário fixo.' : 'Sem intervalo na agenda.'); },
  cfgJornada(_, form) {
    const fd = new FormData(form);
    const v = { workStart: fd.get('workStart'), workEnd: fd.get('workEnd'), breakMode: fd.get('breakMode') || 'fixo', workDays: fd.getAll('workDays').map(Number), alertDays: Number(fd.get('alertDays') || 0) };
    if (fd.get('breakStart')) { v.breakStart = fd.get('breakStart'); v.breakEnd = fd.get('breakEnd'); }
    if (fd.get('breakDur')) v.breakDur = Number(fd.get('breakDur'));
    if (U.toMin(v.workEnd) <= U.toMin(v.workStart)) return UI.toast('A saída deve ser depois da entrada.', 'error');
    if (v.breakMode === 'fixo' && v.breakStart && v.breakEnd && U.toMin(v.breakEnd) <= U.toMin(v.breakStart)) return UI.toast('O fim do intervalo deve ser depois do início.', 'error');
    if (!v.workDays.length) return UI.toast('Selecione ao menos um dia de trabalho.', 'error');
    const old = { ...S.settings };
    Object.assign(S.settings, v);
    if (fd.get('syncBreak') && v.breakStart && v.breakEnd) {
      const br = S.routine.find(r => r.category === 'intervalo' && r.start === old.breakStart) || S.routine.find(r => r.category === 'intervalo');
      if (br) { br.start = v.breakStart; br.end = v.breakEnd; }
      else if (v.breakMode === 'fixo') S.routine.push({ id: U.uid(), start: v.breakStart, end: v.breakEnd, title: 'Intervalo', category: 'intervalo', priority: 'media', notes: '', fixed: true, freq: 'semanal', days: [...v.workDays], monthDay: 1 });
    }
    commit(); UI.toast('Jornada salva.');
  },
  rtNew() { Routine.form(null); },
  rtEdit({ id }) { Routine.form(S.routine.find(r => r.id === id)); },
  rtDel({ id }) { const r = S.routine.find(x => x.id === id); UI.confirm(`Remover <strong>${U.esc(r.title)}</strong> da rotina padrão?`, () => { S.routine = S.routine.filter(x => x.id !== id); commit(); }, { danger: true, okLabel: 'Remover' }); },
  rtClear() {
    const n = S.routine.length, backup = S.routine;
    UI.confirm(`Tem certeza que quer apagar <strong>${U.plural(n, 'atividade', 'atividades')}</strong> da rotina padrão?<br><small class="muted">A agenda dos próximos dias fica vazia até você cadastrar a sua rotina. Os dias já editados não mudam.</small>`, () => {
      S.routine = []; commit();
      UI.toast('Rotina limpa.', 'ok', { label: 'Desfazer', onClick: () => { S.routine = backup; commit(); UI.toast('Rotina restaurada.'); } });
    }, { danger: true, title: 'Limpar a rotina?', okLabel: 'Sim, limpar' });
  },
  catColor({ id }, el) { D.cat(id).color = el.value; commit(); },
  catName({ id }, el) { if (el.value.trim()) { S.settings.categories.find(c => c.id === id).name = el.value.trim(); commit(); } },
  catAdd(_, form) { const name = form.elements.name.value.trim(); S.settings.categories.push({ id: U.uid(), name, color: form.elements.color.value }); commit(); },
  catDel({ id }) {
    const c = D.cat(id);
    const used = S.tasks.some(t => t.category === id) || S.routine.some(r => r.category === id);
    UI.confirm(`Excluir a categoria <strong>${U.esc(c.name)}</strong>?${used ? '<br><small class="muted">Ela está em uso; esses itens passarão a aparecer como “Sem categoria”.</small>' : ''}`, () => { S.settings.categories = S.settings.categories.filter(x => x.id !== id); commit(); }, { danger: true, okLabel: 'Excluir' });
  },
  prColor({ k }, el) { S.settings.priorities[k].color = el.value; commit(); },
  prLabel({ k }, el) { if (el.value.trim()) { S.settings.priorities[k].label = el.value.trim(); commit(); } },
  stColor({ k }, el) { S.settings.statuses[k].color = el.value; commit(); },
  stLabel({ k }, el) { if (el.value.trim()) { S.settings.statuses[k].label = el.value.trim(); commit(); } },
  tecAdd(_, form) { const name = form.elements.name.value.trim(); if (D.techNames().includes(name)) return UI.toast('Essa pessoa já está cadastrada.', 'warn'); S.settings.technicians.push({ id: U.uid(), name }); commit(); },
  tecName({ id }, el) { const t = S.settings.technicians.find(x => x.id === id); if (el.value.trim()) { t.name = el.value.trim(); commit(); } },
  tecDel({ id }) { const t = S.settings.technicians.find(x => x.id === id); UI.confirm(`Remover <strong>${U.esc(t.name)}</strong>? Os lançamentos já feitos são mantidos.`, () => { S.settings.technicians = S.settings.technicians.filter(x => x.id !== id); commit(); }, { danger: true, okLabel: 'Remover' }); },
  goalNew() { Goals.form(null); },
  goalEdit({ id }) { Goals.form(S.settings.goals.find(g => g.id === id)); },
  goalDel({ id }) { UI.confirm('Excluir esta meta?', () => { S.settings.goals = S.settings.goals.filter(g => g.id !== id); commit(); }, { danger: true, okLabel: 'Excluir' }); },
  dataExport() { U.download(`backup-gestao-rotina_${U.today()}.json`, new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' })); UI.toast('Backup exportado.'); },
  dataImport(_, el) {
    const file = el.files[0]; if (!file) return;
    file.text().then(txt => Transfer.decode(txt)).then(data => Transfer.confirmImport(data)).catch(e => UI.toast(U.esc(e.message), 'error'));
    el.value = '';
  },
  cfgJogo(_, el) { S.settings.jogo = el.checked; Jogo.last = null; commit(); UI.toast(el.checked ? 'Modo jogo ligado: veja a Jornada no Início.' : 'Modo jogo desligado.'); },
  cfgEmpresa(_, el) { S.settings.empresa = el.value.trim(); commit(); },
  cfgMetricName({ k }, el) { S.settings.metricNames = { ...(S.settings.metricNames || {}), [k]: el.value.trim() }; commit(); UI.toast('Nome do indicador atualizado.'); },
  cfgProjetos(_, el) { S.settings.showProjetos = el.checked; commit(); UI.toast(el.checked ? 'Projetos aparece no menu, em Planejamento.' : 'Projetos ocultado. Os dados continuam guardados.'); },
  cfgIndicadores(_, el) { S.settings.showIndicadores = el.checked; commit(); UI.toast(el.checked ? 'Indicadores aparece no menu, em Planejamento.' : 'Indicadores ocultado. Os dados continuam guardados.'); },
  themeSet({ v }) { S.settings.theme = v; commit(); UI.toast(v === 'escuro' ? 'Modo escuro ativado.' : v === 'auto' ? 'O tema agora segue o aparelho.' : 'Modo claro ativado.'); },
  xferOut() { Transfer.openExport(); },
  xferIn() { Transfer.openImport(); },
  demoLoad() { Store.loadDemo(); commit(); UI.toast('Dados de demonstração carregados (marcados como EXEMPLO).'); },
  demoRemove() { UI.confirm('Remover todos os dados de demonstração? Seus dados reais não serão afetados.', () => { Store.removeDemo(); commit(); UI.toast('Dados de demonstração removidos.'); }, { okLabel: 'Remover' }); },
  dataReset() { UI.confirm('Apagar <strong>todos</strong> os dados e voltar às configurações iniciais? Essa ação não pode ser desfeita. Considere exportar um backup antes.', () => { Store.replace(Store.defaults()); App.render(); UI.toast('Dados apagados.'); }, { danger: true, okLabel: 'Apagar tudo' }); },
});

</script>
  <script>/* js/views/guia.js */
'use strict';
/* Tutorial de boas-vindas (primeiro acesso) e tela "Guia de uso" */

const Guide = {
  /* Onde os dados ficam, conforme o modo em que o app está rodando */
  whereData() {
    if (typeof Drive !== 'undefined' && Drive.connected()) return `${Native.available() ? 'neste celular' : 'neste navegador'} e no seu Google Drive (iguais no app e no site)`;
    if (Native.available()) return 'neste celular';
    if (Cloud.state === 'on') return 'na sua conta Claude (área privada), iguais no celular e no computador';
    return 'neste navegador';
  },
  /* Ilustrações: miniaturas dos componentes reais do app (não clicáveis) */
  mock: {
    nav: () => `<div class="tour-mock tm-side"><div class="tm-top">${U.icon('menu', 20)}<strong>Início</strong></div><div class="tm-menu">${[['dashboard', 'Início'], ['clock', 'Agenda'], ['tasks', 'Tarefas'], ['users', 'Reuniões e feedbacks'], ['alert', 'Imprevistos']].map(([i, l], n) => `<span class="${n === 0 ? 'on' : ''}">${U.icon(i, 16)}${l}</span>`).join('')}</div></div>`,
    agenda: () => `<div class="tour-mock"><div class="blk" style="--c:#7b3fe4"><div class="blk-time"><strong>09:00</strong><span>10:30</span></div>
      <div class="blk-body"><div class="blk-head"><span class="blk-title">Acompanhamento operacional</span></div><small class="blk-kind">Rotina do dia</small></div>
      <div class="blk-actions"><span class="icon-btn ok">${U.icon('check', 16)}</span><span class="icon-btn info">${U.icon('play', 14)}</span><span class="icon-btn">${U.icon('more', 16)}</span></div></div>
      <div class="tm-legend"><span>${U.icon('check', 13)} Concluir</span><span>${U.icon('play', 11)} Iniciar</span><span>${U.icon('more', 13)} Adiar, mover, excluir</span></div></div>`,
    task: () => `<div class="tour-mock"><div class="task dl-row-soon" style="--c:#e3a043"><div class="tk-body"><div class="tk-title">Cobrar relatório da equipe</div>
      <div class="tk-meta">${H.prio('alta')} <span class="muted">${U.icon('user', 13)} Carlos</span> <span class="dl dl-today">${U.icon('clock', 13)} Vence hoje</span></div></div><div class="tk-side"><span class="icon-btn ok">${U.icon('check', 16)}</span><span class="icon-btn">${U.icon('more', 16)}</span></div></div>
      <div class="tm-legend"><span>${U.icon('check', 13)} Concluir</span><span>${U.icon('more', 13)} Começar, cancelar, excluir</span><span>Toque no texto para editar</span></div></div>`,
    occ: () => `<div class="tour-mock"><div class="occ card prio-border-urgente"><div class="occ-h"><h3>Sistema fora do ar no cliente</h3><span class="grow"></span>${H.prio('urgente')}</div>
      <div class="occ-actions"><span class="btn sm">${U.icon('calendar', 15)} Encaixar na agenda</span><span class="btn sm ghost ok-text">${U.icon('check', 15)} Resolver</span></div></div></div>`,
    dash: () => `<div class="tour-mock tm-kpis"><div class="kpi k-green"><span class="kpi-l">Progresso do dia</span><strong class="kpi-v">45%</strong></div><div class="kpi k-red"><span class="kpi-l">Atrasadas</span><strong class="kpi-v">2</strong></div><div class="kpi k-yellow"><span class="kpi-l">Imprevistos</span><strong class="kpi-v">1</strong></div></div>`,
    plan: () => `<div class="tour-mock tm-grid">${[['calendar', 'Calendário', 'No Início e na Agenda'], ['users', 'Reuniões', 'Pauta, gravação e ata'], ['chat', 'Feedbacks', 'Registro com IA'], ['plus', 'Botão +', 'Cria o item da tela']].map(([i, t, d]) => `<div>${U.icon(i, 20)}<strong>${t}</strong><small>${d}</small></div>`).join('')}</div>`,
    data: () => `<div class="tour-mock tm-data"><span class="btn sm primary">${U.icon('arrow', 15)} Enviar meus dados</span><span class="btn sm">${U.icon('download', 15)} Receber dados</span></div>`,
  },

  slides() {
    const m = this.mock;
    return [
      { icon: 'dashboard', color: 'var(--primary)', title: 'Bem-vindo ao seu centro de controle',

const Tutorial = {
  el: null, i: 0,
  open(start = 0) {
    if (this.el) return;
    this.i = start;
    const el = document.createElement('div');
    el.className = 'modal-wrap tour-wrap';
    el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Tutorial');
    document.getElementById('modal-root').appendChild(el);
    this.el = el;
    this.draw();
    requestAnimationFrame(() => el.classList.add('open'));
    el.addEventListener('click', e => {
      const a = e.target.closest('[data-tour]'); if (!a) return;
      const act = a.dataset.tour;
      if (act === 'next') this.go(this.i + 1);
      else if (act === 'prev') this.go(this.i - 1);
      else if (act === 'dot') this.go(Number(a.dataset.n));
      else if (act === 'skip' || act === 'done') this.close(act === 'done');
    });
    let x0 = null, y0 = null;
    el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    el.addEventListener('touchend', e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) this.go(this.i + (dx < 0 ? 1 : -1));
      x0 = null;
    }, { passive: true });
    this.onKey = e => {
      if (e.key === 'Escape') { e.stopImmediatePropagation(); this.close(false); }
      else if (e.key === 'ArrowRight') this.go(this.i + 1);
      else if (e.key === 'ArrowLeft') this.go(this.i - 1);
    };
    document.addEventListener('keydown', this.onKey, true);
  },
  go(n) {
    const total = Guide.slides().length;
    if (n < 0 || n >= total) return;
    this.i = n; this.draw();
  },
  draw() {
    const slides = Guide.slides(), s = slides[this.i], last = this.i === slides.length - 1;
    this.el.innerHTML = `<div class="tour" style="--tc:${s.color}">
      <div class="tour-top"><span class="muted small">${this.i + 1} de ${slides.length}</span>${last ? '' : '<button class="btn sm ghost" data-tour="skip">Pular</button>'}</div>
      <div class="tour-body" aria-live="polite">
        <div class="tour-icon">${U.icon(s.icon, 26)}</div>
        <h2>${s.title}</h2>
        <p class="tour-text">${s.text}</p>
        ${s.mock}
        <ul class="tour-points">${s.points.map(p => `<li>${p}</li>`).join('')}</ul>
        ${last && !Store.hasDemo() && !S.tasks.length && !S.projects.length ? '<label class="check tour-demo"><input type="checkbox" id="tour-demo"> <span>Carregar <strong>dados de exemplo</strong> para explorar (marcados como EXEMPLO; dá para remover depois)</span></label>' : ''}
      </div>
      <div class="tour-foot">
        <div class="tour-dots">${slides.map((_, n) => `<button class="${n === this.i ? 'on' : ''}" data-tour="dot" data-n="${n}" aria-label="Etapa ${n + 1}"></button>`).join('')}</div>
        <div class="tour-btns">
          ${this.i ? '<button class="btn ghost" data-tour="prev">Voltar</button>' : ''}
          ${last ? '<button class="btn primary" data-tour="done">Começar a usar</button>' : `<button class="btn primary" data-tour="next">Próximo ${U.icon('right', 16)}</button>`}
        </div>
      </div>
    </div>`;
  },
  close(finished) {
    if (!this.el) return;
    const demo = finished && this.el.querySelector('#tour-demo') && this.el.querySelector('#tour-demo').checked;
    document.removeEventListener('keydown', this.onKey, true);
    const el = this.el; this.el = null;
    el.classList.remove('open'); setTimeout(() => el.remove(), 150);
    S.meta = S.meta || {};
    S.meta.tutorialSeen = true;
    if (demo) Store.loadDemo();
    commit();
    if (demo) UI.toast('Dados de exemplo carregados. Remova quando quiser em Configurações.');
    else if (!finished) UI.toast('Você pode rever o tutorial no Guia de uso (botão ? no topo).');
  },
  /* Primeiro acesso: abre automaticamente uma única vez */
  maybeShow() { if (!(S.meta && S.meta.tutorialSeen)) setTimeout(() => this.open(), 300); },
};

  <script>/* js/jogo.js */
'use strict';
/* Modo jogo (Jornada): XP, níveis, sequência, missões e conquistas.
   Nada é guardado à parte: o XP é CALCULADO a partir do que já está salvo (agenda, tarefas, imprevistos,
   reuniões e feedbacks). Assim vale o histórico, fica igual em todos os aparelhos e não dá para ganhar duas vezes.
   Liga/desliga em Configurações → Aparência (settings.jogo). */
const Jogo = {
  META: 40,   // XP por dia para manter a sequência
  PONTOS: { bloco: 5, diaBom: 20, tarefa: 10, noPrazo: 5, imprevisto: 15, reuniao: 20, feedback: 20 },
  CLASSES: {
    rotina: { nome: 'Rotina', sub: 'Atividades da agenda', icon: 'clock', cor: '#9461f5' },
    execucao: { nome: 'Execução', sub: 'Tarefas concluídas', icon: 'tasks', cor: '#3fb5a8' },
    equipe: { nome: 'Equipe', sub: 'Reuniões e feedbacks', icon: 'users', cor: '#e29cf5' },
    imprevistos: { nome: 'Imprevistos', sub: 'Urgências resolvidas', icon: 'alert', cor: '#f0566a' },
  },
  on() { return !!(S && S.settings && S.settings.jogo !== false); },
  day(iso) { return iso ? U.key(new Date(iso)) : null; },
  needGeral: L => 200 + 100 * (L - 1),
  needClasse: L => 80 + 40 * (L - 1),
  nivel(xp, need) { let L = 1, rest = xp; while (rest >= need(L)) { rest -= need(L); L++; } return { L, rest, need: need(L), pct: Math.round(rest / need(L) * 100) }; },

  /* Cada ponto ganho: { d: dia, xp, c: classe, t: tipo } */
  pontos() {
    const P = this.PONTOS, out = [], t = U.today();
    for (const [k, blocks] of Object.entries(S.days || {})) {
      if (k > t) continue;
      const real = blocks.filter(b => !D.isBreak(b) && b.status !== 'cancelada' && !b.demo);
      const done = real.filter(b => b.status === 'concluida');
      done.forEach(() => out.push({ d: k, xp: P.bloco, c: 'rotina', t: 'bloco' }));
      if (real.length >= 3 && done.length / real.length >= 0.8) out.push({ d: k, xp: P.diaBom, c: 'rotina', t: 'diaBom' });
    }
    S.tasks.forEach(x => {
      if (x.demo || x.status !== 'concluida' || !x.completedAt) return;
      const d = this.day(x.completedAt);
      out.push({ d, xp: P.tarefa, c: 'execucao', t: 'tarefa' });
      if (x.dueDate && d <= x.dueDate) out.push({ d, xp: P.noPrazo, c: 'execucao', t: 'noPrazo' });
    });
    S.occurrences.forEach(o => { if (!o.demo && o.status === 'concluida') out.push({ d: this.day(o.resolvedAt) || o.date, xp: P.imprevisto, c: 'imprevistos', t: 'imprevisto' }); });
    S.events.forEach(e => { if (!e.demo && e.registro) out.push({ d: this.day(e.registro.at) || e.date, xp: P.reuniao, c: 'equipe', t: 'reuniao' }); });
    (S.feedbacks || []).forEach(f => out.push({ d: this.day(f.createdAt) || f.date, xp: P.feedback, c: 'equipe', t: 'feedback' }));
    return out.filter(p => p.d);
  },

  /* Resumo usado no Início, na Jornada e no aviso de "+XP". Guardado em cache até o próximo salvamento (Store.rev). */
  calc() {
    const t = U.today(), chave = Store.rev + '|' + t;
    if (this._cache && this._cache.chave === chave) return this._cache.r;
    const base = this.pontos();
    const baseDia = {}; base.forEach(p => { baseDia[p.d] = (baseDia[p.d] || 0) + p.xp; });
    const miss = Missoes.estado(base, baseDia);
    const pts = base.concat(miss.filter(m => m.feitaEm).map(m => ({ d: m.feitaEm, xp: m.xp, c: null, t: 'missao' })));
    const porDia = {}; pts.forEach(p => { porDia[p.d] = (porDia[p.d] || 0) + p.xp; });
    const total = pts.reduce((s, p) => s + p.xp, 0);
    const porClasse = Object.fromEntries(Object.keys(this.CLASSES).map(c => [c, pts.filter(p => p.c === c).reduce((s, p) => s + p.xp, 0)]));
    const bateu = k => (porDia[k] || 0) >= this.META;
    // Sequência: dias úteis seguidos batendo a meta. Folga não quebra (e conta se bateu). Hoje só conta depois de bater.
    let streak = 0;
    for (let k = bateu(t) ? t : U.addDays(t, -1), n = 0; n < 400; k = U.addDays(k, -1), n++) {
      if (bateu(k)) streak++; else if (D.isWorkday(k)) break;
    }
    // Maior sequência da história (para as conquistas)
    const dias = Object.keys(porDia).sort();
    let melhor = 0;
    if (dias.length) {
      let run = 0;
      for (let k = dias[0]; k <= t; k = U.addDays(k, 1)) {
        if (bateu(k)) { run++; melhor = Math.max(melhor, run); } else if (D.isWorkday(k) && k !== t) run = 0;
      }
    }
    const r = { pts, porDia, total, porClasse, streak, melhor, hoje: porDia[t] || 0, geral: this.nivel(total, this.needGeral), miss };
    this._cache = { chave, r };
    return r;
  },

  conquistas(r) {
    const n = tp => r.pts.filter(p => p.t === tp).length;
    return [
      { n: 'Primeiros passos', d: 'Ganhe o primeiro XP', ok: r.total > 0, s: 'star' },
      { n: 'Pegando ritmo', d: '3 dias seguidos', ok: r.melhor >= 3, s: 'flame' },
      { n: 'Semana de fogo', d: '5 dias seguidos', ok: r.melhor >= 5, s: 'flame' },
      { n: 'Imparável', d: '20 dias seguidos', ok: r.melhor >= 20, s: 'flame' },
      { n: 'Dia redondo', d: 'Feche um dia com 80% da agenda', ok: n('diaBom') > 0, s: 'clock' },
      { n: 'Executor', d: '50 tarefas concluídas', ok: n('tarefa') >= 50, s: 'tasks' },
      { n: 'No prazo', d: '20 tarefas dentro do prazo', ok: n('noPrazo') >= 20, s: 'flag' },
      { n: 'Primeira ata', d: 'Registre uma reunião', ok: n('reuniao') > 0, s: 'chat' },
      { n: 'Líder presente', d: '10 feedbacks registrados', ok: n('feedback') >= 10, s: 'users' },
      { n: 'Apaga-incêndio', d: '10 imprevistos resolvidos', ok: n('imprevisto') >= 10, s: 'alert' },
      { n: 'Missão cumprida', d: 'Complete uma missão', ok: n('missao') > 0, s: 'target' },
      { n: 'Nível 5', d: 'Chegue ao nível geral 5', ok: r.geral.L >= 5, s: 'trophy' },
      { n: 'Nível 10', d: 'Chegue ao nível geral 10', ok: r.geral.L >= 10, s: 'trophy' },
    ];
  },

  /* Cartão compacto no topo do Início */
  card() {
    if (!this.on()) return '';
    const r = this.calc(), mp = Math.min(100, Math.round(r.hoje / this.META * 100));
    return `<a class="jg-card" href="#jornada" aria-label="Abrir a Jornada">
      <span class="jg-stat jg-flame ${r.streak ? 'lit' : ''}" title="${U.plural(r.streak, 'dia seguido', 'dias seguidos')} batendo a meta">${U.icon('flame', 18)}<b class="num">${r.streak}</b></span>
      <span class="jg-stat jg-xp">${U.icon('bolt', 17)}<b class="num">${r.total}</b> XP</span>
      <span class="jg-lv"><span class="jg-lvb num">${r.geral.L}</span>Nível</span>
      <span class="jg-meta"><span class="jg-meta-t"><span>Meta de hoje</span><b class="num">${Math.min(r.hoje, this.META)}/${this.META}</b></span><span class="jg-bar"><i style="width:${Math.max(mp, 3)}%"></i></span></span>
      ${U.icon('right', 16)}
    </a>`;
  },

  ring(pct, cor, inner) {
    const R = 30, C = 2 * Math.PI * R;
    return `<span class="jg-ring"><svg viewBox="0 0 68 68" aria-hidden="true"><circle cx="34" cy="34" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="6"/><circle cx="34" cy="34" r="${R}" fill="none" stroke="${cor}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - Math.max(pct, 3) / 100)).toFixed(1)}"/></svg>${inner}</span>`;
  },

  /* "+10 XP" discreto quando você conclui algo (e aviso ao bater a meta do dia) */
  last: null,
  check() {
    if (!this.on()) { this.last = null; return; }
    const r = this.calc();
    const feitas = r.miss.filter(m => m.feitaEm).map(m => m.id);
    if (this.last && r.total > this.last.total) {
      const metaAgora = this.last.hoje < this.META && r.hoje >= this.META;
      const nova = r.miss.find(m => m.feitaEm && !this.last.feitas.includes(m.id));
      this.pop(`+${r.total - this.last.total} XP`, nova ? `Missão cumprida: ${nova.titulo}` : metaAgora ? `Meta de hoje batida! Sequência: ${U.plural(r.streak, 'dia', 'dias')}` : '');
    }
    this.last = { total: r.total, hoje: r.hoje, feitas };
  },
  pop(txt, sub) {
    let el = document.getElementById('xp-pop');
    if (!el) { el = document.createElement('div'); el.id = 'xp-pop'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.innerHTML = `${U.icon(sub ? 'flame' : 'bolt', 16)}<b>${txt}</b>${sub ? `<small>${U.esc(sub)}</small>` : ''}`;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    clearTimeout(this.popT); this.popT = setTimeout(() => el.classList.remove('show'), sub ? 3200 : 1800);
  },
};

Views.jornada = {
  title: 'Jornada', icon: 'trophy', nav: 'Jornada',
  render() {
    const J = Jogo, r = J.calc(), t = U.today(), g = r.geral;
    const mp = Math.min(100, Math.round(r.hoje / J.META * 100));
    const ws = U.weekStart(t);
    const semana = [0, 1, 2, 3, 4, 5, 6].map(i => { const k = U.addDays(ws, i), ok = (r.porDia[k] || 0) >= J.META; return `<div class="jg-day ${ok ? 'ok' : ''} ${k === t ? 'today' : ''} ${D.isWorkday(k) ? '' : 'off'}"><span class="jg-dot">${ok ? U.icon('flame', 16) : ''}</span><small>${Cal.WD[i]}</small></div>`; }).join('');
    const conq = J.conquistas(r);
    const P = J.PONTOS;
    return `
    <section class="card jg-top">
      <div class="jg-top-stats">
        <div class="jg-big jg-flame ${r.streak ? 'lit' : ''}">${U.icon('flame', 26)}<div><b class="num">${r.streak}</b><small>${r.streak === 1 ? 'dia seguido' : 'dias seguidos'}</small></div></div>
        <div class="jg-big jg-xp">${U.icon('bolt', 24)}<div><b class="num">${r.total}</b><small>XP no total</small></div></div>
        <div class="jg-big jg-lvl"><span class="jg-lvb big num">${g.L}</span><div><b>Nível ${g.L}</b><small class="num">${g.rest} / ${g.need} XP para o ${g.L + 1}</small></div></div>
      </div>
      <span class="jg-bar lg"><i style="width:${Math.max(g.pct, 3)}%"></i></span>
    </section>

    <section class="grid-2">
      <div class="card">
        <div class="card-h"><h3>${U.icon('flame')} Sua semana</h3><span class="muted small">Meta: ${J.META} XP por dia</span></div>
        <div class="jg-week">${semana}</div>
        <div class="jg-meta-row"><span>Hoje</span><b class="num">${r.hoje} / ${J.META} XP</b></div>
        <span class="jg-bar gold"><i style="width:${Math.max(mp, 3)}%"></i></span>
        <p class="muted small">${r.hoje >= J.META ? 'Meta de hoje batida. A sequência está garantida.' : `Faltam ${J.META - r.hoje} XP. Folga e fim de semana não quebram a sequência.`}</p>
      </div>
      ${Missoes.card(r)}
    </section>

    <section>
      <div class="card-h jg-h"><h3>Suas áreas</h3><span class="muted small">Cada área sobe de nível com o que você faz nela</span></div>
      <div class="jg-classes">${Object.entries(J.CLASSES).map(([id, c]) => { const xp = r.porClasse[id], n = J.nivel(xp, J.needClasse), hoje = r.pts.filter(p => p.d === t && p.c === id).reduce((s, p) => s + p.xp, 0);
        return `<div class="card jg-cls" style="--c:${c.cor}">${J.ring(n.pct, c.cor, `<span class="jg-ic">${U.icon(c.icon, 20)}</span><span class="jg-lvtag num">${n.L}</span>`)}
          <div class="jg-cls-b"><strong>${c.nome}</strong><small class="muted">${c.sub}</small><span class="jg-bar sm"><i style="width:${Math.max(n.pct, 4)}%;background:${c.cor}"></i></span><small class="num"><b>${n.rest} / ${n.need} XP</b> para o nível ${n.L + 1}${hoje ? ` · <span class="jg-today">+${hoje} hoje</span>` : ''}</small></div></div>`; }).join('')}</div>
    </section>

    <section class="card">
      <div class="card-h"><h3>${U.icon('trophy')} Conquistas</h3><span class="muted small">${conq.filter(a => a.ok).length} de ${conq.length}</span></div>
      <div class="jg-conq">${conq.map(a => `<div class="jg-badge ${a.ok ? 'on' : ''}" title="${U.esc(a.d)}"><span class="jg-medal">${U.icon(a.s, 22)}</span><strong>${a.n}</strong><small>${a.d}</small></div>`).join('')}</div>
    </section>

    <details class="card jg-how">
      <summary>${U.icon('info')} Como ganhar XP</summary>
      <ul class="jg-how-l">
        <li><span>Concluir uma atividade da agenda</span><b>+${P.bloco}</b></li>
        <li><span>Fechar o dia com 80% da agenda concluída</span><b>+${P.diaBom}</b></li>
        <li><span>Concluir uma tarefa</span><b>+${P.tarefa}</b></li>
        <li><span>… dentro do prazo (bônus)</span><b>+${P.noPrazo}</b></li>
        <li><span>Resolver um imprevisto</span><b>+${P.imprevisto}</b></li>
        <li><span>Registrar uma reunião</span><b>+${P.reuniao}</b></li>
        <li><span>Registrar um feedback</span><b>+${P.feedback}</b></li>
      </ul>
      <p class="muted small">O XP é calculado a partir do que está salvo no app, então vale o que você já fez antes. Reabrir algo concluído tira o XP dele. Para desligar o modo jogo: Configurações → Aparência.</p>
    </details>`;

};

/* Missões da Jornada: quem lidera monta um pacote e envia por link (WhatsApp); quem recebe abre o link e aceita.
   Missões de ATRIBUIÇÃO criam o item de verdade no app de quem recebe (tarefa, reunião na agenda, imprevisto,
   pessoa em Feedbacks) e ficam concluídas quando esse item é concluído. Missões de META contam o que a pessoa faz. */
const Missoes = {
  /* Atribuições: [rótulo, título, rótulo do campo de texto, exemplo, usa data, usa hora] */
  ITENS: {
    tarefaItem: ['Tarefa (entra em Tarefas)', x => x.titulo, 'Tarefa', 'Ex.: Atualizar a planilha de materiais', true, true],
    reuniaoItem: ['Reunião (entra na agenda)', x => 'Reunião: ' + x.titulo, 'Assunto da reunião', 'Ex.: Alinhamento da escala', true, true],
    feedbackItem: ['Feedback com alguém (entra em Feedbacks)', x => 'Feedback com ' + x.titulo, 'Com quem', 'Nome do colaborador', true, false],
    imprevistoItem: ['Imprevisto para resolver', x => 'Resolver: ' + x.titulo, 'O que resolver', 'Ex.: Câmera offline no cliente X', true, true],
  },
  TIPOS: {
    tarefa: ['Concluir tarefas', n => `Concluir ${U.plural(n, 'tarefa', 'tarefas')}`],
    noPrazo: ['Concluir tarefas no prazo', n => `Concluir ${U.plural(n, 'tarefa', 'tarefas')} dentro do prazo`],
    bloco: ['Concluir atividades da agenda', n => `Concluir ${U.plural(n, 'atividade', 'atividades')} da agenda`],
    diaBom: ['Fechar dias com 80% da agenda', n => `Fechar ${U.plural(n, 'dia', 'dias')} com 80% da agenda`],
    meta: ['Bater a meta de XP do dia', n => `Bater a meta de XP em ${U.plural(n, 'dia', 'dias')}`],
    reuniao: ['Registrar reuniões', n => `Registrar ${U.plural(n, 'reunião', 'reuniões')}`],
    feedback: ['Registrar feedbacks', n => `Registrar ${U.plural(n, 'feedback', 'feedbacks')}`],
    imprevisto: ['Resolver imprevistos', n => `Resolver ${U.plural(n, 'imprevisto', 'imprevistos')}`],
    manual: ['Outra (a pessoa marca quando fizer)', () => ''],
  },
  valido(tipo) { return !!(this.ITENS[tipo] || this.TIPOS[tipo]); },
  SITE: 'https://paulojunior2303-maker.github.io/gestao-rotina/',
  /* XP da missão é automático: valor de cada unidade × quantidade (arredondado de 5 em 5, entre 10 e 500) */
  VALOR: { tarefa: 10, noPrazo: 12, bloco: 3, diaBom: 15, meta: 15, reuniao: 15, feedback: 15, imprevisto: 12 },
  MANUAL_XP: 30,
  ITEM_XP: { tarefaItem: 20, reuniaoItem: 30, feedbackItem: 30, imprevistoItem: 25 },
  xpDe(tipo, alvo) { return this.ITEM_XP[tipo] || (tipo === 'manual' ? this.MANUAL_XP : Math.min(500, Math.max(10, Math.round(this.VALOR[tipo] * alvo / 5) * 5))); },
  list() { return S.missoes || (S.missoes = []); },

  /* Progresso de cada missão: conta o que foi feito desde que ela foi aceita (e até o prazo, se houver) */
  estado(base, baseDia) {
    const t = U.today();
    return this.list().map(m => {
      const fim = m.prazo || '9999-12-31', dentro = d => d >= m.desde && d <= fim;
      let n = 0, feitaEm = null;
      if (m.tipo === 'manual') { n = m.feitaEm ? 1 : 0; feitaEm = m.feitaEm || null; }
      else if (this.ITENS[m.tipo]) { feitaEm = this.itemFeito(m); n = feitaEm ? 1 : 0; }
      else {
        const datas = m.tipo === 'meta'
          ? Object.keys(baseDia).filter(d => dentro(d) && baseDia[d] >= Jogo.META)
          : base.filter(p => p.t === m.tipo && dentro(p.d)).map(p => p.d);
        datas.sort(); n = Math.min(datas.length, m.alvo);
        if (datas.length >= m.alvo) feitaEm = datas[m.alvo - 1];
      }
      const de = m.tipo === 'manual' || this.ITENS[m.tipo] ? 1 : m.alvo;
      return { ...m, n, de, feitaEm, expirada: !feitaEm && !!m.prazo && t > m.prazo };
    });
  },

  /* Dia em que o item criado pela missão foi concluído (ou null) */
  itemFeito(m) {
    const ref = m.ref || {}, day = iso => iso ? U.key(new Date(iso)) : U.today();
    if (m.tipo === 'tarefaItem') { const x = S.tasks.find(y => y.id === ref.id); return x && x.status === 'concluida' ? day(x.completedAt) : null; }
    if (m.tipo === 'reuniaoItem') { const e = S.events.find(y => y.id === ref.id); return e && e.registro ? day(e.registro.at) : null; }
    if (m.tipo === 'imprevistoItem') { const o = S.occurrences.find(y => y.id === ref.id); return o && o.status === 'concluida' ? day(o.resolvedAt) : null; }
    if (m.tipo === 'feedbackItem') {
      const nome = (m.pessoa || '').trim().toLowerCase();
      const ds = (S.feedbacks || []).filter(f => (f.pessoa || '').trim().toLowerCase() === nome).map(f => f.createdAt ? day(f.createdAt) : f.date).filter(d => d >= m.desde).sort();
      return ds[0] || null;
    }
    return null;
  },
  /* Abrir o item da missão (tarefa, reunião, imprevisto ou registrar o feedback) */
  abrir(m) {
    const ref = m.ref || {};
    if (m.tipo === 'tarefaItem') { const x = S.tasks.find(y => y.id === ref.id); if (x) return Tasks.form(x); }
    if (m.tipo === 'reuniaoItem') { const e = S.events.find(y => y.id === ref.id); if (e) return Events.view(e); }
    if (m.tipo === 'imprevistoItem') { const o = S.occurrences.find(y => y.id === ref.id); if (o) return Occ.form(o); }
    if (m.tipo === 'feedbackItem') return FB.form(null, m.pessoa);
    UI.toast('O item desta missão foi excluído.', 'warn');
  },

  card(r) {
    const ativas = r.miss.filter(m => !m.feitaEm && !m.expirada), feitas = r.miss.filter(m => m.feitaEm), fora = r.miss.filter(m => m.expirada);
    const item = m => `<li class="${m.feitaEm ? 'ok' : m.expirada ? 'exp' : ''}">
        <span class="jg-chk">${m.feitaEm ? U.icon('check', 15) : ''}</span>
        <span class="jg-miss-t">${this.ITENS[m.tipo] ? `<a href="#jornada" data-act="msAbrir" data-id="${m.id}">${U.esc(m.titulo)}</a>` : `<span>${U.esc(m.titulo)}</span>`}
          <small class="muted">${m.de_ ? `De ${U.esc(m.de_)} · ` : ''}${m.data ? `${U.fmtShort(m.data)}${m.hora ? ' ' + m.hora : ''} · ` : ''}${m.prazo ? `até ${U.fmtShort(m.prazo)} · ` : ''}+${m.xp} XP${m.expirada ? ' · prazo encerrado' : ''}</small>
          ${!m.feitaEm && m.tipo !== 'manual' && !this.ITENS[m.tipo] ? `<span class="jg-bar sm"><i style="width:${Math.max(Math.round(m.n / m.de * 100), 3)}%"></i></span>` : ''}</span>
        ${this.ITENS[m.tipo] ? (m.feitaEm ? '' : `<button class="btn sm" data-act="msAbrir" data-id="${m.id}">${m.tipo === 'feedbackItem' ? 'Registrar' : 'Abrir'}</button>`) : m.tipo === 'manual' && !m.expirada ? (m.feitaEm ? `<button class="icon-btn" data-act="msFeita" data-id="${m.id}" data-v="" title="Desmarcar">${U.icon('undo', 15)}</button>` : `<button class="btn sm" data-act="msFeita" data-id="${m.id}" data-v="1">Concluí</button>`) : `<span class="jg-miss-n num">${m.n}/${m.de}</span>`}
        <button class="icon-btn xs" data-act="msDel" data-id="${m.id}" title="Remover missão" aria-label="Remover missão">${U.icon('x', 14)}</button></li>`;
    return `<div class="card jg-miss-card">
      <div class="card-h"><h3>${U.icon('target')} Missões</h3><span class="muted small">${feitas.length} de ${r.miss.length}</span></div>
      ${r.miss.length ? `<ul class="jg-miss">${ativas.map(item).join('')}</ul>
        ${feitas.length || fora.length ? `<details class="jg-done"><summary>Concluídas e encerradas (${feitas.length + fora.length})</summary><ul class="jg-miss">${feitas.concat(fora).map(item).join('')}</ul></details>` : ''}`
        : `<p class="muted small">Nenhuma missão ainda. Quem lidera a equipe monta as missões e envia por um link; você também pode criar as suas.</p>`}
      <div class="row-actions wrap jg-miss-actions">
        <button class="btn sm primary" data-act="msEnviar">${U.icon('arrow', 15)} Enviar missões para alguém</button>
        <button class="btn sm" data-act="msNova">${U.icon('plus', 15)} Criar para mim</button>
        <button class="btn sm ghost" data-act="msReceber">${U.icon('download', 15)} Receber</button>
        ${r.miss.length ? `<button class="btn sm ghost" data-act="msProgresso">${U.icon('upload', 15)} Enviar meu progresso</button>` : ''}
      </div>
    </div>`;
  },

  /* Formulário de uma ou mais missões (para mim ou para enviar) */
  form(paraOutro) {
    const opt = (k, l) => `<option value="${k}">${l}</option>`;
    const tipos = `<optgroup label="Atribuir (cria no app da pessoa)">${Object.entries(this.ITENS).map(([k, [l]]) => opt(k, l)).join('')}</optgroup>
      <optgroup label="Metas (o app conta sozinho)">${Object.entries(this.TIPOS).filter(([k]) => k !== 'manual').map(([k, [l]]) => opt(k, l)).join('')}</optgroup>
      <optgroup label="Livre">${opt('manual', this.TIPOS.manual[0])}</optgroup>`;
    const linha = () => `<div class="ms-row">
        <label class="ms-f ms-f-tipo"><span>Missão</span><select class="ms-tipo">${tipos}</select></label>
        <label class="ms-f ms-f-n"><span>Quantidade</span><input class="ms-n" type="number" min="1" max="999" value="5" inputmode="numeric"></label>
        <label class="ms-f ms-f-txt"><span class="ms-txt-l">Título</span><input class="ms-txt" type="text" maxlength="90" list="ms-pessoas"></label>
        <label class="ms-f ms-f-data"><span>Data</span><input class="ms-data" type="date" min="${U.today()}"></label>
        <label class="ms-f ms-f-hora"><span>Horário</span><input class="ms-hora" type="time"></label>
        <button type="button" class="icon-btn xs ms-rm" title="Remover esta missão" aria-label="Remover esta missão">${U.icon('x', 14)}</button>
        <p class="ms-sum"></p></div>`;
    const m = UI.modal({
      title: paraOutro ? 'Enviar missões' : 'Criar missão para mim',
      wide: true,
      body: `${paraOutro ? `<div class="form-grid">
          <div class="field"><label>Para quem</label><input name="para" list="ms-pessoas" maxlength="60" placeholder="Nome da pessoa"></div>
          <div class="field"><label>Seu nome (aparece para a pessoa)</label><input name="de" maxlength="60" value="${U.esc(S.settings.meuNome || '')}" placeholder="Ex.: Victor"></div></div>` : ''}
        <datalist id="ms-pessoas">${D.techNames().map(n => `<option value="${U.esc(n)}">`).join('')}</datalist>
        <p class="muted small"><strong>Atribuir</strong> cria o item ${paraOutro ? 'no app da pessoa' : 'no seu app'} (a tarefa em Tarefas, a reunião na agenda, o feedback em Feedbacks) e, com data, ele aparece no calendário. A missão fica concluída quando o item for concluído. <strong>Metas</strong> contam o que for feito a partir de ${paraOutro ? 'quando a pessoa aceitar' : 'hoje'}. O XP é calculado sozinho.</p>
        <div class="ms-rows">${linha()}</div>
        <button type="button" class="btn sm ghost ms-add">${U.icon('plus', 15)} Adicionar outra missão</button>
        <div class="field ms-prazo"><label>Prazo para tudo (opcional)</label><input type="date" name="prazo" min="${U.today()}"></div>
        <p class="form-error" hidden></p>`,
      footer: `<span class="grow"></span><button class="btn ghost" data-no>Cancelar</button><button class="btn primary" data-ok>${paraOutro ? `${U.icon('arrow', 15)} Gerar link` : 'Salvar'}</button>`,
    });
    const el = m.el, rows = el.querySelector('.ms-rows');
    const ler = row => {
      const tipo = row.querySelector('.ms-tipo').value;
      return { tipo, alvo: Math.min(999, Math.max(1, Math.round(Number(row.querySelector('.ms-n').value) || 1))), titulo: row.querySelector('.ms-txt').value.trim(), data: row.querySelector('.ms-data').value || '', hora: row.querySelector('.ms-hora').value || '' };
    };
    // Mostra só os campos de cada tipo, o que a pessoa vai ver e o XP calculado
    const sync = row => {
      const x = ler(row), it = this.ITENS[x.tipo], manual = x.tipo === 'manual';
      row.querySelector('.ms-f-n').hidden = !!it || manual;
      row.querySelector('.ms-f-data').hidden = !(it || manual);
      row.querySelector('.ms-f-hora').hidden = !(it && it[5]);
      row.querySelector('.ms-txt-l').textContent = it ? it[2] : manual ? 'Escreva a missão' : 'Título (opcional)';
      row.querySelector('.ms-txt').placeholder = it ? it[3] : manual ? 'Ex.: revisar 1 POP' : 'Usa o título automático';
      const tit = this.titulo(x);
      row.querySelector('.ms-sum').innerHTML = `${U.esc(tit || '(preencha o campo acima)')}${x.data && (it || manual) ? ` · ${U.fmtShort(x.data)}${x.hora && it && it[5] ? ' ' + x.hora : ''}` : ''} · <b>+${this.xpDe(x.tipo, x.alvo)} XP</b>${manual ? ' <small>(marcada à mão)</small>' : ''}`;
    };
    rows.querySelectorAll('.ms-row').forEach(sync);
    el.addEventListener('input', e => { const r = e.target.closest('.ms-row'); if (r) sync(r); });
    el.addEventListener('change', e => { const r = e.target.closest('.ms-row'); if (r) sync(r); });
    el.querySelector('.ms-add').onclick = () => { rows.insertAdjacentHTML('beforeend', linha()); rows.querySelectorAll('.ms-row').forEach(sync); };
    rows.addEventListener('click', e => { if (e.target.closest('.ms-rm') && rows.children.length > 1) e.target.closest('.ms-row').remove(); });
    el.querySelector('[data-no]').onclick = () => m.close();
    el.querySelector('[data-ok]').onclick = () => {
      const err = el.querySelector('.form-error'), fail = msg => { err.textContent = msg; err.hidden = false; };
      const prazo = el.querySelector('[name=prazo]').value || '';
      const lista = [...rows.querySelectorAll('.ms-row')].map(r => {
        const x = ler(r), it = this.ITENS[x.tipo];
        if (!it && x.tipo !== 'manual') { x.data = ''; x.hora = ''; }
        if (!(it && it[5])) x.hora = '';
        if (it || x.tipo === 'manual') x.alvo = 1;
        return { ...x, xp: this.xpDe(x.tipo, x.alvo) };
      });
      if (lista.some(x => (this.ITENS[x.tipo] || x.tipo === 'manual') && !x.titulo)) return fail('Preencha o campo de cada missão (ex.: o nome da tarefa ou de quem recebe o feedback).');
      if (lista.some(x => x.tipo === 'reuniaoItem' && !x.data)) return fail('Informe a data da reunião.');
      if (!paraOutro) { this.aceitar({ de: '', prazo, missoes: lista }); m.close(); UI.toast(U.plural(lista.length, 'missão criada', 'missões criadas') + '.'); return; }
      const para = el.querySelector('[name=para]').value.trim(), de = el.querySelector('[name=de]').value.trim();
      if (!para) return fail('Informe para quem são as missões.');
      if (de && de !== S.settings.meuNome) { S.settings.meuNome = de; Store.save(); }
      m.close();
      this.compartilhar({ id: U.uid(), de, para, prazo, missoes: lista });
    };
  },

  /* Pacote <-> código (vai no link) */
  codificar(p) { return btoa(unescape(encodeURIComponent(JSON.stringify({ v: 1, ...p })))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  decodificar(txt) {
    const m = String(txt || '').trim().match(/[?&]p=([A-Za-z0-9_-]+)/) || String(txt || '').trim().match(/^([A-Za-z0-9_-]{20,})$/);
    if (!m) return null;
    try {
      const b = m[1].replace(/-/g, '+').replace(/_/g, '/');
      const o = JSON.parse(decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4)))));
      const cut = (s, n) => String(s || '').slice(0, n);
      const missoes = (Array.isArray(o.missoes) ? o.missoes : []).slice(0, 30)
        .filter(x => x && this.valido(x.tipo))
        .map(x => { const alvo = Math.min(999, Math.max(1, Math.round(Number(x.alvo) || 1))), dt = /^\d{4}-\d{2}-\d{2}$/.test(x.data || '') ? x.data : '', hr = /^\d{2}:\d{2}$/.test(x.hora || '') ? x.hora : '';
          return { tipo: x.tipo, alvo, titulo: cut(x.titulo, 90), data: dt, hora: hr, xp: this.xpDe(x.tipo, alvo) }; })
        .filter(x => !(this.ITENS[x.tipo] || x.tipo === 'manual') || x.titulo);
      if (!missoes.length) return null;
      return { id: cut(o.id, 40) || U.uid(), de: cut(o.de, 60), para: cut(o.para, 60), prazo: /^\d{4}-\d{2}-\d{2}$/.test(o.prazo || '') ? o.prazo : '', missoes };
    } catch (e) { return null; }
  },
  link(p) { return `${this.SITE}${CANAL_TESTE ? 'teste/' : ''}#missoes?p=${this.codificar(p)}`; },

  async compartilhar(p) {
    const url = this.link(p);
    const txt = `${p.de ? p.de + ' te enviou' : 'Você recebeu'} ${U.plural(p.missoes.length, 'missão', 'missões')} no FlowFire:\n${p.missoes.map(x => '• ' + this.titulo(x)).join('\n')}${p.prazo ? `\nPrazo: ${U.fmtDate(p.prazo)}` : ''}\n\nAbra o link para aceitar (no app do celular: Jornada → Missões → Receber e cole o link):\n${url}`;
    UI.modal({
      title: `Missões para ${p.para}`,
      body: `<p>Mande este texto para <strong>${U.esc(p.para)}</strong> pelo WhatsApp ou e-mail. Quando a pessoa abrir o link e aceitar, as missões entram na Jornada dela e o progresso conta sozinho.</p>
        <textarea class="ms-share" rows="8" readonly>${U.esc(txt)}</textarea>`,
      footer: `<button class="btn ghost" data-copy>${U.icon('download', 15)} Copiar</button><span class="grow"></span><a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">Enviar pelo WhatsApp</a>`,
    }).el.querySelector('[data-copy]').onclick = async () => { try { await navigator.clipboard.writeText(txt); UI.toast('Copiado.'); } catch (e) { UI.toast('Selecione o texto e copie.', 'warn'); } };
  },

  titulo(x) { const it = this.ITENS[x.tipo]; return it ? (x.titulo ? it[1](x) : '') : (x.titulo || this.TIPOS[x.tipo][1](x.alvo)); },

  /* Recebe um pacote: confirma e guarda as missões (a contagem começa hoje) */
  receber(txt) {
    const p = this.decodificar(txt);
    if (!p) { UI.toast('Link ou código de missões inválido.', 'error'); return false; }
    if (this.list().some(m => m.pacote === p.id)) { App.go('jornada'); UI.toast('Você já aceitou essas missões.'); return true; }
    UI.confirm(`${p.de ? `<strong>${U.esc(p.de)}</strong> te enviou` : 'Você recebeu'} ${U.plural(p.missoes.length, 'missão', 'missões')}${p.para ? ` (para ${U.esc(p.para)})` : ''}:<ul class="ms-prev">${p.missoes.map(x => `<li>${U.esc(this.titulo(x))}${x.data ? ` (${U.fmtShort(x.data)}${x.hora ? ' ' + x.hora : ''})` : ''} <b>+${x.xp} XP</b></li>`).join('')}</ul>${p.prazo ? `Prazo: ${U.fmtDate(p.prazo)}<br>` : ''}<small class="muted">Tarefas, reuniões e imprevistos já entram no seu app${p.missoes.some(x => x.data) ? ' e no calendário' : ''}. As metas contam a partir de hoje.</small>`,
      () => { this.aceitar(p); App.go('jornada'); UI.toast('Missões aceitas. Boa jornada!'); }, { title: 'Novas missões', okLabel: 'Aceitar missões' });
    return true;
  },
  aceitar(p) {
    const t = U.today(), pacote = p.id || null;
    S.settings.jogo = true;   // quem aceita missões usa a Jornada
    const now = new Date().toISOString(), origem = p.de ? `Missão de ${p.de}.` : 'Missão da Jornada.';
    const cat = id => (S.settings.categories.some(c => c.id === id) ? id : (S.settings.categories[0] || {}).id || '');
    p.missoes.forEach(x => {
      const m = { id: U.uid(), pacote, de_: p.de || '', titulo: this.titulo(x), tipo: x.tipo, alvo: x.alvo, xp: x.xp, prazo: p.prazo || '', data: x.data || '', hora: x.hora || '', desde: t, feitaEm: null };
      const quando = x.data || p.prazo || '';
      if (x.tipo === 'tarefaItem') {
        const k = { id: U.uid(), title: x.titulo, description: origem, category: cat('equipe'), priority: 'alta', status: 'pendente', startDate: '', dueDate: quando, dueTime: x.hora || '', responsible: '', notes: '', createdAt: now, completedAt: null, missao: m.id };
        S.tasks.push(k); m.ref = { id: k.id };
      } else if (x.tipo === 'reuniaoItem') {
        const e = { id: U.uid(), title: x.titulo, date: x.data || quando || t, time: x.hora || '', pautas: [], notes: origem, reuniao: true, missao: m.id };
        S.events.push(e); m.ref = { id: e.id };
      } else if (x.tipo === 'imprevistoItem') {
        const o = { id: U.uid(), createdAt: now, scheduled: null, title: x.titulo, description: origem, priority: 'alta', date: t, time: U.fromMin(U.nowMin()), dueDate: quando, dueTime: x.hora || '', responsible: '', notes: '', status: 'pendente', missao: m.id };
        S.occurrences.push(o); m.ref = { id: o.id };
      } else if (x.tipo === 'feedbackItem') {
        m.pessoa = x.titulo;
        if (!D.techNames().some(n => n.toLowerCase() === x.titulo.toLowerCase())) S.settings.technicians.push({ id: U.uid(), name: x.titulo });
      }
      this.list().push(m);
    });
    commit();
  },

  progresso() {
    const r = Jogo.calc();
    const txt = `Progresso das minhas missões (${U.fmtDate(U.today())}):\n${r.miss.map(m => `${m.feitaEm ? '✅' : m.expirada ? '⌛' : '⬜'} ${m.titulo}: ${m.feitaEm ? 'concluída em ' + U.fmtShort(m.feitaEm) : `${m.n}/${m.de}`}`).join('\n')}\nNível ${r.geral.L} · ${r.total} XP · sequência de ${U.plural(r.streak, 'dia', 'dias')}`;
    UI.modal({
      title: 'Enviar meu progresso',
      body: `<p class="muted small">Mande para quem te passou as missões.</p><textarea class="ms-share" rows="8" readonly>${U.esc(txt)}</textarea>`,
      footer: `<span class="grow"></span><a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">Enviar pelo WhatsApp</a>`,
    });
  },
};

Object.assign(Actions, {
  msEnviar() { Missoes.form(true); },
  msNova() { Missoes.form(false); },
  msReceber() {
    const m = UI.form({
      title: 'Receber missões', submitLabel: 'Continuar',
      fields: [{ name: 'code', label: 'Cole aqui o link (ou o código) que você recebeu', type: 'textarea', rows: 4, required: true }],
      onSubmit(v) { Missoes.receber(v.code); },
    });
    return m;
  },
  msFeita({ id, v }) { const m = Missoes.list().find(x => x.id === id); if (!m) return; m.feitaEm = v ? U.today() : null; commit(); },

'use strict';
/* Relatórios: exportação Excel (.xlsx) e PDF (via impressão do navegador) */
const Reports = {
  data(from, to) {
    const metrics = METRICS.map(m => [m.label, D.metricValue(m.key, from, to), m.snapshot ? 'Último valor registrado' : 'Soma no período']);
    const techs = Ind.techRows(from, to).filter(r => r.days);
    const goals = S.settings.goals.map(g => { const st = D.goalStatus(g, to < U.today() ? to : U.today()); return [g.name || metricLabel(g.metric), g.period, (g.direction === 'max' ? '≤ ' : '≥ ') + g.target, st.val, st.achieved === null ? 'Sem dados' : st.achieved ? 'Alcançada' : 'Não alcançada']; });
    const tasks = S.tasks.filter(x => OPEN(x.status) || (x.completedAt && x.completedAt.slice(0, 10) >= from && x.completedAt.slice(0, 10) <= to) || (x.dueDate && x.dueDate >= from && x.dueDate <= to));
    const occ = S.occurrences.filter(o => (o.date >= from && o.date <= to) || OPEN(o.status));
    const days = U.daysInRange(from, to > U.today() ? U.today() : to).filter(k => S.days[k] && S.days[k].length).map(k => { const p = D.progress(k); return [U.fmtDate(k), U.WD[U.weekday(k)], p.total, p.done, p.pct === null ? null : p.pct / 100]; });
    return { metrics, techs, goals, tasks, occ, days };
  },

  xlsx(from, to, label) {

        ['Projetos concluídos no período', D.metricValue('projetosConcluidos', from, to), ''], ['Projetos em andamento (atual)', S.projects.filter(p => p.status === 'andamento').length, ''], ['Tarefas concluídas no período', D.metricValue('tarefasConcluidas', from, to), '']] },
      { name: 'Lançamentos', rows: [['Data', 'Pessoa', ...METRICS.map(m => m.label), 'Observações'], ...D.records(from, to).sort((a, b) => a.date.localeCompare(b.date)).map(r => [U.fmtDate(r.date), r.technician || 'Equipe (geral)', ...METRICS.map(m => r.values[m.key] ?? null), r.notes || ''])] },
      { name: 'Produtividade por pessoa', rows: [['Pessoa', 'Dias com lançamento', ...METRICS.map(m => m.label)], ...d.techs.map(r => [r.name, r.days, r.pontosCamera, r.manutencoes, r.retrabalhos])] },
      { name: 'Metas', rows: [['Meta', 'Período', 'Alvo', 'Realizado', 'Situação'], ...d.goals] },
      { name: 'Tarefas', rows: [['Nome', 'Categoria', 'Prioridade', 'Status', 'Responsável', 'Criada em', 'Início', 'Prazo', 'Horário', 'Concluída em', 'Descrição', 'Observações'], ...d.tasks.map(x => [x.title, D.cat(x.category).name, D.prio(x.priority).label, D.status(x.status).label, x.responsible || '', U.fmtDateTime(x.createdAt), x.startDate ? U.fmtDate(x.startDate) : '', x.dueDate ? U.fmtDate(x.dueDate) : '', x.dueTime || '', x.completedAt ? U.fmtDateTime(x.completedAt) : '', x.description || '', x.notes || ''])] },
      { name: 'Projetos', rows: [['Projeto', 'Cliente', 'Responsável', 'Status', '% concluído', 'Início', 'Prazo', 'Etapas', 'Pendências abertas', 'Observações'], ...S.projects.map(p => [p.name, p.client || '', p.responsible || '', PROJECT_STATUS[p.status].label, D.projectProgress(p) / 100, p.startDate ? U.fmtDate(p.startDate) : '', p.dueDate ? U.fmtDate(p.dueDate) : '', (p.stages || []).map(s => (s.done ? '[x] ' : '[ ] ') + s.name).join('; '), (p.pendencias || []).filter(x => !x.done).map(x => x.text).join('; '), p.notes || ''])] },

  pdf(from, to, label) {
    const d = Reports.data(from, to);
    const table = (head, rows) => rows.length ? `<table><thead><tr>${head.map(h => `<th>${U.esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c === null || c === undefined ? '<em>sem dados</em>' : U.esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '<p><em>Sem dados.</em></p>';

        <h2>Metas</h2>${table(['Meta', 'Período', 'Alvo', 'Realizado', 'Situação'], d.goals.map(g => [g[0], g[1], g[2], g[3] === null ? null : U.fmtNum(g[3]), g[4]]))}
        <h2>Projetos</h2>${table(['Projeto', 'Cliente', 'Responsável', 'Status', '%', 'Prazo'], S.projects.filter(p => p.status !== 'cancelado').map(p => [p.name, p.client || '—', p.responsible || '—', PROJECT_STATUS[p.status].label, D.projectProgress(p) + '%', U.fmtDate(p.dueDate)]))}
        <h2>Tarefas</h2>${table(['Tarefa', 'Prioridade', 'Status', 'Responsável', 'Prazo'], d.tasks.map(x => [x.title, D.prio(x.priority).label, D.status(x.status).label + (D.taskLate(x) ? ' (atrasada)' : ''), x.responsible || '—', x.dueDate ? U.fmtDate(x.dueDate) : '—']))}
        <h2>Imprevistos</h2>${table(['Imprevisto', 'Prioridade', 'Status', 'Data', 'Responsável'], d.occ.map(o => [o.title, D.prio(o.priority).label, D.status(o.status).label, U.fmtDate(o.date), o.responsible || '—']))}
        <h2>Execução da agenda</h2>${table(['Data', 'Dia', 'Atividades', 'Concluídas', '%'], d.days.map(r => [r[0], r[1], r[2], r[3], r[4] === null ? '—' : Math.round(r[4] * 100) + '%']))}
      </div>`;
    const native = Native.available();
    if (Cloud.downloads || native) {
      // No claude.ai a impressão é bloqueada (baixa o relatório); no app Android abre a impressão nativa
      const doc = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Relatório de gestão — ${U.esc(label)}</title>
        <style>body{font-family:Segoe UI,system-ui,Arial,sans-serif;max-width:960px;margin:24px auto;padding:0 16px;color:#0f1b2d}.report{font-size:13px}.report header{border-bottom:2px solid #0f1b2d;margin-bottom:10px;padding-bottom:6px}.report h1{font-size:20px;margin:0}.report h2{font-size:14.5px;margin:18px 0 6px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #cbd5e1;padding:5px 7px;text-align:left}th{background:#e2e8f0;-webkit-print-color-adjust:exact;print-color-adjust:exact}tr{page-break-inside:avoid}.tip{background:#eff6ff;border:1px solid #bfdbfe;padding:8px 12px;border-radius:8px}@media print{.tip{display:none}@page{size:A4;margin:14mm}}</style></head>
        <body>${native ? '' : '<p class="tip">Para gerar o PDF: use Imprimir (Ctrl+P ou Compartilhar → Imprimir no celular) e escolha “Salvar como PDF”.</p>'}${body}${native ? '' : `<script>window.addEventListener('load',function(){setTimeout(function(){try{window.print()}catch(e){}},300)})<\/script>`}</body></html>`;
      if (native) { Native.print(doc, `Relatorio-gestao-${from}-a-${to}`); UI.toast('Na impressão, escolha “Salvar como PDF”.'); return; }
      Cloud.save(`relatorio-gestao_${from}_${to}.html`, new Blob([doc], { type: 'text/html' }));
      UI.toast('Abra o relatório baixado e escolha “Salvar como PDF” na impressão.');
      return;
    }
    const root = document.getElementById('print-root');
    root.innerHTML = body;
    const done = () => { root.innerHTML = ''; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => window.print(), 50);
    UI.toast('Na janela de impressão, escolha "Salvar como PDF".');
  },
};
